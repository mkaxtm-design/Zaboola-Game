<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0518">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>زعبوله | بره الصندوق + البيدون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:#f4ecff;min-height:100vh;
  background:linear-gradient(-45deg,#0b0518,#1a0b2e,#08131f,#2a0a22);
  background-size:400% 400%;
  animation:bgmove 22s ease infinite;
  overflow-x:hidden;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.42;pointer-events:none;z-index:0;}
.orb.a{width:250px;height:250px;background:#ff2e9a;top:-70px;right:-70px;animation:float1 15s ease-in-out infinite;}
.orb.b{width:230px;height:230px;background:#00f0ff;bottom:-80px;left:-80px;animation:float2 18s ease-in-out infinite;}
.orb.c{width:200px;height:200px;background:#a855f7;top:45%;left:60%;animation:float1 21s ease-in-out infinite reverse;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,38px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-30px)}}

button{
  font-family:inherit;font-size:16px;font-weight:800;color:#fff;
  border:none;outline:none;cursor:pointer;border-radius:16px;
  padding:14px 18px;
  transition:filter .14s ease, box-shadow .2s ease, opacity .2s ease;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;
}
button:active{filter:brightness(.78);}
button:disabled{opacity:.42;filter:grayscale(.45);}
button.primary{background:linear-gradient(135deg,#ff2e9a,#a855f7);box-shadow:0 6px 22px rgba(255,46,154,.38),0 0 0 1px rgba(255,255,255,.12) inset;}
button.secondary{background:linear-gradient(135deg,#00f0ff,#3b82f6);box-shadow:0 6px 22px rgba(0,240,255,.30);color:#04141a;}
button.success{background:linear-gradient(135deg,#22ff88,#0ea5a4);box-shadow:0 6px 22px rgba(34,255,136,.28);color:#06231a;}
button.warn{background:linear-gradient(135deg,#ffb020,#ff5e3a);box-shadow:0 6px 22px rgba(255,94,58,.3);color:#241000;}
button.danger{background:linear-gradient(135deg,#ff2e5e,#a8002e);box-shadow:0 6px 22px rgba(255,46,94,.45);color:#fff;}
button.ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:none;font-weight:700;}
button.small{font-size:13px;padding:9px 14px;border-radius:12px;}
button.mini{width:34px;height:34px;min-width:34px;border-radius:10px;padding:0;font-size:18px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);}
button.block{width:100%;}

input[type=text],input[type=tel]{
  font-family:inherit;font-size:16px;font-weight:700;width:100%;padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);color:#fff;outline:none;
  transition:border-color .18s, background .18s;-webkit-appearance:none;appearance:none;
}
input::placeholder{color:rgba(255,255,255,.35);font-weight:600;}
input:focus{border-color:#ff2e9a;background:rgba(255,255,255,.11);}
input[type=tel]{letter-spacing:6px;text-align:center;font-size:22px;font-weight:900;}

#app{position:relative;z-index:2;padding:16px 14px 90px;max-width:960px;margin:0 auto;}
.screen{display:none;animation:fadein .28s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{
  background:rgba(22,10,40,.72);border:1px solid rgba(255,255,255,.10);border-radius:24px;
  padding:20px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);margin-bottom:16px;
}
h1,h2,h3,h4{margin:0 0 12px;line-height:1.25;}
h2{font-size:22px;font-weight:900;}
h3{font-size:18px;font-weight:800;}
label{display:block;font-size:14px;font-weight:800;margin:16px 0 8px;color:#c9b6ff;}
label:first-child{margin-top:0;}

.brand{text-align:center;padding:34px 0 22px;}
.logo{
  font-size:clamp(44px,15vw,76px);font-weight:900;letter-spacing:-2px;margin:0;
  background:linear-gradient(120deg,#ff2e9a,#00f0ff 45%,#22ff88 75%,#a855f7);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:shine 6s ease infinite;filter:drop-shadow(0 4px 26px rgba(255,46,154,.45));
}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tag{color:#a797c9;font-size:15px;font-weight:700;margin:6px 0 0;}

.games{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px;}
@media(min-width:560px){.games{grid-template-columns:1fr 1fr;}}
.game-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right;
  padding:20px;border-radius:22px;
  background:linear-gradient(140deg,rgba(255,46,154,.18),rgba(168,85,247,.14));
  border:1.5px solid rgba(255,46,154,.35);box-shadow:0 10px 34px rgba(255,46,154,.18);font-weight:800;
}
.game-card.bd{
  background:linear-gradient(140deg,rgba(0,240,255,.18),rgba(34,255,136,.14));
  border-color:rgba(0,240,255,.35);box-shadow:0 10px 34px rgba(0,240,255,.18);
}
.game-card .game-emoji{font-size:38px;line-height:1;}
.game-card .game-title{font-size:20px;font-weight:900;color:#fff;}
.game-card .game-sub{font-size:13px;color:#c9b6ff;font-weight:700;}

.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;max-height:230px;overflow-y:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;}
.av{aspect-ratio:1/1;border-radius:14px;font-size:24px;background:rgba(255,255,255,.06);border:2px solid transparent;padding:0;display:flex;align-items:center;justify-content:center;}
.av.sel{border-color:#ff2e9a;background:rgba(255,46,154,.20);box-shadow:0 0 16px rgba(255,46,154,.55);}

.chip-row{display:flex;gap:10px;flex-wrap:wrap;}
.chip{
  flex:1 1 auto;min-width:130px;font-size:14px;font-weight:800;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);color:#e8ddff;
}
.chip.on{background:linear-gradient(135deg,rgba(0,240,255,.28),rgba(59,130,246,.22));border-color:#00f0ff;color:#fff;box-shadow:0 0 16px rgba(0,240,255,.35);}

.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.pin-badge{font-size:15px;font-weight:800;color:#c9b6ff;}
.pin-badge span{display:inline-block;font-size:24px;font-weight:900;letter-spacing:5px;color:#00f0ff;text-shadow:0 0 16px rgba(0,240,255,.7);margin-inline-start:6px;}
.lobby-sub{font-size:13px;color:#8d7fb0;font-weight:700;margin-top:4px;}

.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin:14px 0;}
.pcard{position:relative;border-radius:16px;padding:10px 6px 8px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);}
.pcard.off{opacity:.45;}
.pcard .pava{font-size:28px;line-height:1.1;}
.pcard .pname{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#efe6ff;}
.pcard .host-tag{font-size:10px;font-weight:800;color:#ffd166;margin-top:2px;}
.pcard .off-tag{font-size:10px;font-weight:800;color:#ff6b8a;margin-top:2px;}
.pcard .kick{position:absolute;top:-7px;left:-7px;width:24px;height:24px;min-width:24px;border-radius:50%;font-size:12px;padding:0;font-weight:900;background:linear-gradient(135deg,#ff2e5e,#ff5e3a);color:#fff;box-shadow:0 4px 12px rgba(255,46,94,.5);}

.game-topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px;position:sticky;top:8px;z-index:20;}
.pill{background:rgba(22,10,40,.88);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:900;color:#e5d9ff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;}
#game-timer{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.6);min-width:74px;text-align:center;}
#game-score{color:#22ff88;text-shadow:0 0 14px rgba(34,255,136,.5);}

.game-hint{
  position:sticky;top:56px;z-index:19;
  font-size:11px;font-weight:700;color:#c9b6ff;
  background:rgba(22,10,40,.88);
  border:1px solid rgba(255,255,255,.10);
  border-radius:10px;
  padding:6px 12px;
  text-align:center;
  margin-bottom:10px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  line-height:1.5;
}
.game-hint.hidden{display:none;}

.phase{display:flex;flex-direction:column;gap:14px;}
.phase-title{font-size:19px;font-weight:900;text-align:center;margin:0;background:linear-gradient(120deg,#ff2e9a,#00f0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(255,46,154,.35));}
.q-label{font-size:13px;font-weight:800;color:#a797c9;}
.question-box{font-size:clamp(19px,5.5vw,26px);font-weight:900;line-height:1.5;padding:20px 16px;border-radius:20px;text-align:center;background:linear-gradient(140deg,rgba(0,240,255,.14),rgba(168,85,247,.14));border:1.5px solid rgba(0,240,255,.35);box-shadow:0 0 30px rgba(0,240,255,.15);color:#fff;word-break:break-word;}
.waiting{text-align:center;font-size:15px;font-weight:800;color:#a797c9;padding:18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.16);}
.ok-box{text-align:center;font-size:15px;font-weight:800;color:#06231a;padding:16px;border-radius:16px;background:linear-gradient(135deg,#22ff88,#0ea5a4);box-shadow:0 8px 26px rgba(34,255,136,.3);word-break:break-word;}
.answered-count{text-align:center;font-size:14px;font-weight:800;color:#c9b6ff;padding:8px;}
.timer-big{text-align:center;font-size:34px;font-weight:900;color:#00f0ff;text-shadow:0 0 22px rgba(0,240,255,.65);padding:6px;letter-spacing:2px;line-height:1;}

.list{display:flex;flex-direction:column;gap:9px;}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);}
.row.me{border-color:rgba(255,46,154,.55);background:rgba(255,46,154,.10);}
.row .r-ava{font-size:26px;line-height:1;min-width:32px;text-align:center;position:relative;}
.row .r-main{flex:1;min-width:0;}
.row .r-name{font-size:13px;font-weight:900;color:#efe6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .r-ans{font-size:14px;font-weight:700;color:#b9a8e0;word-break:break-word;margin-top:2px;}
.row .r-ans.none{color:#7a6b9c;font-style:italic;}
.row .r-pts{font-size:17px;font-weight:900;min-width:46px;text-align:center;color:#00f0ff;}
.row .r-pts.pos{color:#22ff88;}
.row .r-pts.neg{color:#ff5e7a;}
.row .r-total{font-size:11px;font-weight:800;color:#8d7fb0;text-align:center;min-width:44px;}
.r-ctrl{display:flex;gap:6px;}
.rank-medal{font-size:22px;min-width:30px;text-align:center;}

.bidon-box{text-align:center;padding:18px;border-radius:20px;background:linear-gradient(140deg,rgba(255,176,32,.20),rgba(255,94,58,.16));border:1.5px solid rgba(255,176,32,.5);box-shadow:0 0 30px rgba(255,176,32,.22);}
.bidon-box .b-title{font-size:13px;font-weight:800;color:#ffd166;}
.bidon-box .b-name{font-size:22px;font-weight:900;color:#fff;margin-top:4px;}

.winner-box{text-align:center;padding:22px 16px;border-radius:22px;background:linear-gradient(140deg,rgba(255,46,154,.22),rgba(0,240,255,.14));border:1.5px solid rgba(255,46,154,.45);box-shadow:0 0 40px rgba(255,46,154,.25);}
.winner-box .w-title{font-size:13px;font-weight:800;color:#c9b6ff;}
.winner-box .w-ava{font-size:52px;line-height:1.2;}
.winner-box .w-name{font-size:24px;font-weight:900;}
.winner-box .w-score{font-size:15px;font-weight:800;color:#00f0ff;margin-top:4px;}

#toast-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;padding:0 14px;}
.toast{max-width:92vw;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:800;color:#fff;background:rgba(30,14,54,.96);border:1.5px solid rgba(0,240,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.55);animation:tin .25s ease;text-align:center;}
.toast.err{border-color:rgba(255,46,94,.75);background:rgba(52,10,26,.96);}
.toast.ok{border-color:rgba(34,255,136,.75);background:rgba(8,44,28,.96);}
.toast.out{opacity:0;transition:opacity .35s;}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

#loading-overlay{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(6,2,14,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:16px;font-weight:900;color:#fff;}
#loading-overlay.hidden{display:none;}
.loader{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.14);border-top-color:#ff2e9a;border-right-color:#00f0ff;animation:spin .85s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

#mic-btn{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:18px;width:64px;height:64px;min-width:64px;border-radius:50%;font-size:26px;padding:0;z-index:9000;background:linear-gradient(135deg,#00f0ff,#3b82f6);box-shadow:0 8px 28px rgba(0,240,255,.45);color:#04141a;display:flex;align-items:center;justify-content:center;touch-action:none;}
#mic-btn.hidden{display:none;}
#mic-btn.rec{background:linear-gradient(135deg,#ff2e5e,#ff8a3a);box-shadow:0 0 0 8px rgba(255,46,94,.22),0 8px 28px rgba(255,46,94,.6);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

.hidden{display:none !important;}
.muted{color:#8d7fb0;font-size:13px;font-weight:700;text-align:center;}
.tiny{font-size:12px;color:#8d7fb0;font-weight:700;text-align:center;line-height:1.7;}
.stack{display:flex;flex-direction:column;gap:10px;}
.center{text-align:center;}
.crown{color:#ffd166;font-size:14px;}

/* ====== BaiDon Animations ====== */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .5s ease-in-out;}
@keyframes redflash{0%{background:rgba(255,0,0,.55)}100%{background:transparent}}
.red-flash{animation:redflash .7s ease-out;}
@keyframes iceIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.ice-block{position:relative;overflow:hidden;border-radius:12px;}
.ice-block::after{content:'❄️';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,rgba(150,220,255,.75),rgba(100,180,255,.55));animation:iceIn .4s ease-out;pointer-events:none;}
@keyframes heartpop{0%{transform:scale(.4) translateY(0);opacity:1}100%{transform:scale(1.8) translateY(-40px);opacity:0}}
.heart-pop{position:fixed;z-index:9500;font-size:34px;pointer-events:none;animation:heartpop 1.2s ease-out forwards;color:#ff4d8e;}
@keyframes dangerPulse{0%,100%{box-shadow:inset 0 0 40px rgba(255,0,0,.25)}50%{box-shadow:inset 0 0 90px rgba(255,0,0,.6)}}
.danger-zone{animation:dangerPulse 1.8s infinite;border-color:rgba(255,46,94,.5) !important;}
@keyframes unmaskAnim{0%{filter:blur(24px);opacity:0;transform:scale(.8)}100%{filter:blur(0);opacity:1;transform:scale(1)}}
.unmask{animation:unmaskAnim 1.4s ease-out;}

/* ====== Cartoon Track (no periodic animation) ====== */
.bd-track-wrap{margin:10px 0 22px;padding:8px 4px 12px;}
.bd-track{
  position:relative;height:80px;border-radius:20px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 24px,transparent 24px 48px),
    linear-gradient(90deg,rgba(34,255,136,.10),rgba(0,240,255,.08) 50%,rgba(255,46,94,.12));
  border:2px solid rgba(255,255,255,.14);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  overflow:visible;
}
.bd-track .mid-line{position:absolute;top:0;bottom:0;width:2px;background:#00f0ff;box-shadow:0 0 12px #00f0ff;z-index:1;}
.bd-track .mid-line::before{content:'💫';position:absolute;top:-14px;left:-8px;font-size:11px;}
.bd-track .danger-line{position:absolute;top:0;bottom:0;width:2px;background:#ff2e5e;box-shadow:0 0 14px #ff2e5e;z-index:1;}
.bd-track .danger-line::before{content:'⚠️';position:absolute;top:-14px;left:-8px;font-size:11px;}
.bd-track .finish-line{position:absolute;top:0;bottom:0;right:0;width:10px;background:repeating-linear-gradient(0deg,#ffd166 0 8px,#0b0518 8px 16px);border-radius:0 18px 18px 0;z-index:1;}
.bd-track .bd-num{position:absolute;top:100%;transform:translateX(-50%);font-size:10px;font-weight:800;color:#8d7fb0;margin-top:3px;white-space:nowrap;}
.bd-track .bd-num.major{color:#ffd166;font-size:12px;font-weight:900;}

/* Token: STATIC by default. Only slides when position changes. */
.bd-token{
  position:absolute;
  transform:translateX(-50%);
  font-size:22px;line-height:1;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));
  z-index:2;
  transition:none;
}
.bd-token.me{font-size:26px;filter:drop-shadow(0 0 8px rgba(255,46,154,.8)) drop-shadow(0 3px 5px rgba(0,0,0,.7));}
.bd-token.frozen{filter:hue-rotate(180deg) brightness(1.35) drop-shadow(0 0 6px rgba(100,200,255,.9));}
.bd-token.baiDonRevealed{font-size:26px;filter:drop-shadow(0 0 10px rgba(255,46,94,.9));}
.bd-token.sliding{transition:left .65s cubic-bezier(.34,1.56,.64,1);}

.num-chip{flex:1 1 0;min-width:52px;font-size:20px;font-weight:900;padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);color:#fff;}
.num-chip.on{background:linear-gradient(135deg,rgba(34,255,136,.35),rgba(0,240,255,.25));border-color:#22ff88;box-shadow:0 0 16px rgba(34,255,136,.5);}
.num-chip.attack.on{background:linear-gradient(135deg,rgba(255,46,94,.35),rgba(168,85,247,.25));border-color:#ff2e5e;box-shadow:0 0 16px rgba(255,46,94,.5);}
.disguise-chip{background:linear-gradient(135deg,rgba(168,85,247,.30),rgba(255,46,154,.20));border-color:#a855f7;color:#fff;}
.disguise-chip.on{background:linear-gradient(135deg,rgba(168,85,247,.55),rgba(255,46,154,.40));border-color:#ff2e9a;box-shadow:0 0 16px rgba(168,85,247,.6);}

.hearts{font-size:13px;color:#ff4d8e;letter-spacing:1px;}
.row.danger{background:rgba(255,46,94,.10);border-color:rgba(255,46,94,.35);}
.row.revealed-bd{background:linear-gradient(135deg,rgba(255,46,94,.25),rgba(168,85,247,.20));border-color:rgba(255,46,94,.6);box-shadow:0 0 22px rgba(255,46,94,.3);}
.row.eliminated{opacity:.45;filter:grayscale(.7);}

.frozen-box{text-align:center;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(100,180,255,.18),rgba(150,220,255,.12));border:1.5px solid rgba(100,180,255,.5);color:#bfe4ff;font-weight:800;}
.spectator-box{text-align:center;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(120,120,120,.20),rgba(80,80,80,.15));border:1.5px solid rgba(200,200,200,.3);color:#ccc;font-weight:800;}

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
"use strict";
/* ================================================================
   0) Constants + Utilities
   ================================================================ */
const AVATARS = ['🦊','🐼','🐯','🦁','🐸','🐵','🐧','🐨','🐰','🐷','🐔','🐙','🦄','🐝','🦋','🐢','🐳','🦉','🐺','🐮','🐹','🐭','🦝','🦥','🦦','🦔','🐿️','🐊','🦖','🦕','🐬','🦈','🐲','🤖','👽'];
const MAX_PLAYERS = 20;
const MIN_PLAYERS = 3;
const TOTAL_ROUNDS = 10;
const TIMER_SECONDS = 25;
const BAIDON_TIMER = 30;
const ROOM_TTL_MS = 30 * 60 * 1000;
const HOST_TIMEOUT_MS = 120 * 1000;

const firebaseConfig = {
  apiKey: "AIzaSyBfOqZBoIRmz_s3qLjR9DjHld7Wv_onBe0",
  authDomain: "system-chat-96932.firebaseapp.com",
  databaseURL: "https://system-chat-96932-default-rtdb.firebaseio.com",
  projectId: "system-chat-96932",
  storageBucket: "system-chat-96932.firebasestorage.app",
  messagingSenderId: "965982067456",
  appId: "1:965982067456:web:896ef2babae15baa3eb1e5"
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function toast(msg, type){
  const wrap = $('toast-wrap');
  const t = el('div', 'toast ' + (type || ''));
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, 3200);
}
function showLoading(text){ $('loading-text').textContent = text || 'جاري الدخول... ⏳'; $('loading-overlay').classList.remove('hidden'); }
function hideLoading(){ $('loading-overlay').classList.add('hidden'); }
function onEnter(input, fn){ input.addEventListener('keydown', function(e){ if (e.keyCode === 13 || e.key === 'Enter'){ e.preventDefault(); fn(); } }); }
function safeBlur(node){ setTimeout(function(){ try { if (node && node.blur) node.blur(); } catch(e){} }, 60); }
function showScreen(name){
  const all = document.querySelectorAll('.screen');
  for (let i = 0; i < all.length; i++) all[i].classList.remove('active');
  const target = $('screen-' + name);
  if (target) target.classList.add('active');
  try { window.scrollTo(0, 0); } catch(e){}
}
function normalizeAnswer(text){
  if (text == null) return '';
  let s = String(text).toLowerCase().trim();
  s = s.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
  s = s.replace(/[أإآٱ]/g, 'ا');
  s = s.replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  s = s.replace(/[^\w\u0600-\u06FF\s]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}
function nameWithCrown(room, uid, name){
  if (room.hostId === uid) return esc(name) + ' <span class="crown">👑</span>';
  return esc(name);
}

/* ================================================================
   1) App state
   ================================================================ */
const App = {
  uid: null, pin: null, name: '', avatar: '', isHost: false,
  flowMode: 'create', gameType: 'box', hostMode: 'play',
  roomRef: null, room: null,
  connectedRef: null, connectedCb: null,
  sig: '', lastPhaseKey: ''
};
let db = null;
let fbReady = false;

/* ================================================================
   2) Firebase init
   ================================================================ */
function initFirebase(){
  return new Promise(function(resolve, reject){
    let done = false;
    const timer = setTimeout(function(){ if (!done){ done = true; reject(new Error('FIREBASE_TIMEOUT')); } }, 7000);
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      db.ref('.info/connected').once('value').then(function(){
        if (done) return; done = true; clearTimeout(timer); fbReady = true; resolve();
      }).catch(function(err){ if (done) return; done = true; clearTimeout(timer); reject(err); });
    } catch (e) { if (done) return; done = true; clearTimeout(timer); reject(e); }
  });
}

/* ================================================================
   3) Core
   ================================================================ */
const Core = {
  sweepOldRooms(){
    try {
      db.ref('rooms').orderByChild('lastActivity').endAt(Date.now() - ROOM_TTL_MS).once('value').then(function(snap){
        const updates = {}; let any = false;
        snap.forEach(function(child){ updates[child.key] = null; any = true; });
        if (any) db.ref('rooms').update(updates).catch(function(){});
      }).catch(function(){});
    } catch (e) {}
  },

  async createRoom(pin, name, avatar, hostMode, gameType){
    const snap = await db.ref('rooms/' + pin).once('value');
    if (snap.exists()) throw new Error('PIN_TAKEN');
    const uid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    const now = Date.now();
    const room = {
      pin: pin, hostId: uid, hostMode: hostMode || 'play', gameType: gameType || 'box',
      createdAt: now, lastActivity: now, status: 'lobby', players: {},
      game: gameType === 'baidon' ? BaiDonGame.emptyState() : {
        round: 1, phase: 'idle', mode: 'written', question: '', timerEnd: 0, doubleRound: false
      }
    };
    room.players[uid] = {
      name: name, avatar: avatar, score: 0, dupes: 0, cumulative: 0,
      isHost: true, online: true, joinedAt: now, lastSeen: now
    };
    await db.ref('rooms/' + pin).set(room);
    localStorage.setItem('zab_uid_' + pin, uid);
    return uid;
  },

  async joinRoom(pin, name, avatar){
    const snap = await db.ref('rooms/' + pin).once('value');
    const room = snap.val();
    if (!room) throw new Error('NO_ROOM');
    const players = room.players || {};
    let uid = null;
    const savedUid = localStorage.getItem('zab_uid_' + pin);
    if (savedUid && players[savedUid]) uid = savedUid;
    if (!uid) {
      const keys = Object.keys(players);
      for (let i = 0; i < keys.length; i++){
        const p = players[keys[i]];
        if (p && p.name === name && !p.online){ uid = keys[i]; break; }
      }
    }
    if (!uid) {
      if (room.kicked && room.kicked[name]) throw new Error('KICKED');
      const count = Object.keys(players).length;
      if (count >= MAX_PLAYERS) throw new Error('FULL');
      const keys = Object.keys(players);
      for (let i = 0; i < keys.length; i++){
        if (players[keys[i]] && players[keys[i]].name === name) throw new Error('NAME_TAKEN');
      }
      for (let i = 0; i < keys.length; i++){
        if (players[keys[i]] && players[keys[i]].avatar === avatar) throw new Error('AVATAR_TAKEN');
      }
      if (room.status !== 'lobby') throw new Error('STARTED');
      uid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      const now = Date.now();
      await db.ref('rooms/' + pin + '/players/' + uid).set({
        name: name, avatar: avatar, score: 0, dupes: 0, cumulative: 0,
        isHost: false, online: true, joinedAt: now, lastSeen: now
      });
      await db.ref('rooms/' + pin).update({ lastActivity: now });
      localStorage.setItem('zab_uid_' + pin, uid);
      return uid;
    }
    await db.ref('rooms/' + pin + '/players/' + uid).update({ online: true, lastSeen: Date.now() });
    await db.ref('rooms/' + pin).update({ lastActivity: Date.now() });
    localStorage.setItem('zab_uid_' + pin, uid);
    return uid;
  },

  attach(pin, uid){
    App.pin = pin; App.uid = uid;
    App.roomRef = db.ref('rooms/' + pin);
    const meRef = App.roomRef.child('players/' + uid);
    meRef.onDisconnect().update({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
    meRef.update({ online: true, lastSeen: Date.now() }).catch(function(){});

    App.connectedRef = db.ref('.info/connected');
    App.connectedCb = App.connectedRef.on('value', function(s){
      if (s.val() === true && App.uid && App.roomRef){
        App.roomRef.child('players/' + App.uid).update({ online: true, lastSeen: Date.now() }).catch(function(){});
      }
    });

    App.roomRef.on('value', function(snap){
      const room = snap.val();
      if (!room){ Core.leaveToHome('تم إغلاق الزعبل 🚪'); return; }
      if (!room.players || !room.players[App.uid]){ Core.leaveToHome('تم طردك من الزعبل 🚪'); return; }
      App.room = room;
      App.isHost = (room.hostId === App.uid);
      render();
    });

    setupMicListener(pin);

    setInterval(function(){
      if (App.roomRef && App.uid){
        App.roomRef.child('players/' + App.uid).update({ lastSeen: Date.now() }).catch(function(){});
      }
    }, 20000);

    setInterval(function(){
      if (App.room && App.room.players){ Core.checkHostMigration(); }
    }, 15000);
  },

  async checkHostMigration(){
    if (!App.room || !App.pin) return;
    const room = App.room;
    const host = room.players && room.players[room.hostId];
    if (!host) return;
    const lastSeen = host.lastSeen || host.joinedAt || 0;
    if (Date.now() - lastSeen < HOST_TIMEOUT_MS) return;
    const candidates = Object.keys(room.players)
      .filter(uid => uid !== room.hostId && room.players[uid].online)
      .map(uid => ({ uid, joinedAt: room.players[uid].joinedAt || 0 }))
      .sort((a, b) => a.joinedAt - b.joinedAt);
    if (candidates.length === 0) return;
    const oldHostId = room.hostId;
    const newHostId = candidates[0].uid;
    try {
      await db.ref('rooms/' + App.pin).transaction(function(r){
        if (!r) return r;
        if (r.hostId !== oldHostId) return;
        r.hostId = newHostId;
        r.lastActivity = Date.now();
        return r;
      });
      if (App.uid === newHostId) toast('انتقلت صلاحية الهوست إليك 👑', 'ok');
    } catch (e){}
  },

  detach(){
    try { if (App.roomRef) App.roomRef.off(); } catch(e){}
    try { if (App.connectedRef && App.connectedCb) App.connectedRef.off('value', App.connectedCb); } catch(e){}
    try { if (App.roomRef) App.roomRef.child('mic').off(); } catch(e){}
    App.roomRef = null; App.room = null; App.uid = null; App.pin = null;
    App.isHost = false; App.sig = ''; App.lastPhaseKey = '';
    hideMic(); hideLoading();
  },

  leaveToHome(message){
    Core.detach();
    showScreen('home');
    if (message) toast(message, 'err');
  },

  async leave(){
    const room = App.room; const pin = App.pin; const uid = App.uid;
    if (!room || !pin || !uid){ Core.leaveToHome(); return; }
    try {
      if (room.hostId === uid){
        const others = Object.keys(room.players).filter(k => k !== uid)
          .map(k => ({ id: k, joinedAt: room.players[k].joinedAt || 0 }))
          .sort((a, b) => a.joinedAt - b.joinedAt);
        if (others.length === 0){ await db.ref('rooms/' + pin).remove(); }
        else {
          const updates = {};
          updates['players/' + uid] = null;
          updates['hostId'] = others[0].id;
          updates['lastActivity'] = Date.now();
          await db.ref('rooms/' + pin).update(updates);
        }
      } else {
        await db.ref('rooms/' + pin + '/players/' + uid).remove();
        await db.ref('rooms/' + pin).update({ lastActivity: Date.now() });
      }
    } catch (e){}
    Core.leaveToHome();
  },

  async kick(playerId){
    if (!App.isHost || !App.room) return;
    const target = App.room.players[playerId];
    if (!target) return;
    if (playerId === App.uid){ toast('مش ممكن تطرد نفسك 😅', 'err'); return; }
    try {
      const updates = {};
      updates['players/' + playerId] = null;
      updates['kicked/' + target.name] = true;
      updates['lastActivity'] = Date.now();
      await App.roomRef.update(updates);
      toast('تم طرد ' + target.name, 'ok');
    } catch (e){ toast('مشكلة في الاتصال', 'err'); }
  }
};

/* ================================================================
   4) Helpers
   ================================================================ */
function setGame(fields){
  if (!App.roomRef) return Promise.resolve();
  const patch = { lastActivity: Date.now() };
  Object.keys(fields).forEach(function(k){ patch['game/' + k] = fields[k]; });
  return App.roomRef.update(patch);
}
function getAnswererIds(room){
  const players = room.players || {};
  const ids = Object.keys(players);
  if (room.hostMode === 'judge'){
    return ids.filter(function(id){ return id !== room.hostId; });
  }
  return ids;
}
function getSortedPlayers(room){
  return Object.keys(room.players || {}).map(function(k){ return Object.assign({ id: k }, room.players[k]); })
    .sort(function(a, b){ return (b.score || 0) - (a.score || 0) || (a.joinedAt || 0) - (b.joinedAt || 0); });
}
function getJoinedPlayers(room){
  return Object.keys(room.players || {}).map(function(k){ return Object.assign({ id: k }, room.players[k]); })
    .sort(function(a, b){ return (a.joinedAt || 0) - (b.joinedAt || 0); });
}
function countAnswered(room){
  const g = room.game || {};
  const answers = g.answers || {};
  return getAnswererIds(room).filter(function(id){ return answers[id] && answers[id].text; }).length;
}

/* ================================================================
   5) BoxGame (unchanged)
   ================================================================ */
const BoxGame = {
  computeRound(answers, answererIds, doubleRound){
    const normalized = {}; const counts = {};
    answererIds.forEach(function(id){
      const txt = answers && answers[id] ? answers[id].text : '';
      const n = normalizeAnswer(txt);
      normalized[id] = n;
      if (n) counts[n] = (counts[n] || 0) + 1;
    });
    const points = {}; const dupes = {};
    answererIds.forEach(function(id){
      const n = normalized[id];
      if (!n){ points[id] = doubleRound ? -30 : 0; dupes[id] = 0; return; }
      if (counts[n] > 1){ points[id] = doubleRound ? -30 : 0; dupes[id] = 1; }
      else { points[id] = doubleRound ? 30 : 10; dupes[id] = 0; }
    });
    return { points: points, dupes: dupes };
  },

  async hostStart(){
    if (!App.isHost || !App.room) return;
    const players = App.room.players || {};
    if (Object.keys(players).length < MIN_PLAYERS){
      toast('الحد الأدنى ' + MIN_PLAYERS + ' زعابيل للبدء', 'err'); return;
    }
    const updates = {
      status: 'playing', lastActivity: Date.now(),
      'game/round': 1, 'game/phase': 'prepare', 'game/mode': 'written',
      'game/question': '', 'game/answers': null, 'game/points': null,
      'game/dupes': null, 'game/roundResult': null, 'game/doubleRound': false,
      'game/timerEnd': 0, 'game/vote': null, 'game/voteTie': false, 'game/voteResult': '', 'game/ready': null
    };
    Object.keys(players).forEach(function(pid){
      updates['players/' + pid + '/score'] = 0;
      updates['players/' + pid + '/dupes'] = 0;
    });
    try { await App.roomRef.update(updates); App.sig = ''; }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async startTimer(){
    if (!App.isHost) return;
    try { await setGame({ phase: 'answering', timerEnd: Date.now() + TIMER_SECONDS * 1000, answers: null, points: null, dupes: null }); App.sig = ''; }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  hostEndTimerBusy: false,
  async hostEndTimer(){
    if (!App.isHost) return;
    if (BoxGame.hostEndTimerBusy) return;
    const room = App.room;
    if (!room || !room.game || room.game.phase !== 'answering') return;
    BoxGame.hostEndTimerBusy = true;
    try {
      const g = room.game;
      const answererIds = getAnswererIds(room);
      const result = BoxGame.computeRound(g.answers || {}, answererIds, !!g.doubleRound);
      await setGame({ phase: 'scoring', timerEnd: 0, points: result.points, dupes: result.dupes });
      App.sig = '';
    } catch (e){ toast('مشكلة في الاتصال', 'err'); }
    finally { setTimeout(function(){ BoxGame.hostEndTimerBusy = false; }, 900); }
  },

  async adjustPoints(playerId, delta){
    if (!App.isHost || !App.room) return;
    const g = App.room.game || {};
    const step = g.doubleRound ? 30 : 10;
    const current = (g.points && g.points[playerId]) || 0;
    try { await setGame({ ['points/' + playerId]: current + (delta > 0 ? step : -step) }); }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async hostConfirmScores(){
    if (!App.isHost || !App.room) return;
    const room = App.room; const g = room.game || {};
    const points = g.points || {}; const dupes = g.dupes || {}; const players = room.players || {};
    const updates = { lastActivity: Date.now() };
    const roundResult = {};
    Object.keys(players).forEach(function(pid){
      const p = points[pid] || 0;
      const total = (players[pid].score || 0) + p;
      const d = (players[pid].dupes || 0) + (dupes[pid] || 0);
      updates['players/' + pid + '/score'] = total;
      updates['players/' + pid + '/dupes'] = d;
      roundResult[pid] = { points: p, total: total };
    });
    updates['game/phase'] = 'roundResult';
    updates['game/roundResult'] = roundResult;
    try { await App.roomRef.update(updates); App.sig = ''; }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async hostNextRound(){
    if (!App.isHost || !App.room) return;
    const g = App.room.game || {};
    const round = g.round || 1;
    try {
      if (round >= TOTAL_ROUNDS){ await setGame({ phase: 'final' }); App.sig = ''; return; }
      if (round === TOTAL_ROUNDS - 1){
        await setGame({ phase: 'vote', vote: null, voteTie: false, voteResult: '', answers: null, points: null, dupes: null });
        App.sig = ''; return;
      }
      await setGame({ round: round + 1, phase: 'prepare', mode: 'written', question: '', answers: null, points: null, dupes: null, roundResult: null, timerEnd: 0 });
      App.sig = '';
    } catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async castVote(choice){
    if (!App.room || !App.room.game || App.room.game.phase !== 'vote') return;
    try { await setGame({ ['vote/' + App.uid]: choice }); }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async hostResolveVote(){
    if (!App.isHost || !App.room) return;
    const g = App.room.game || {};
    const votes = g.vote || {};
    let normal = 0, double = 0;
    Object.keys(votes).forEach(function(pid){ if (votes[pid] === 'double') double++; else if (votes[pid] === 'normal') normal++; });
    if (double === normal){ try { await setGame({ voteTie: true }); toast('تعادل! القرار للهوست 👑'); } catch (e){} return; }
    await BoxGame.hostStartRound10(double > normal ? 'double' : 'normal');
  },

  async hostStartRound10(choice){
    if (!App.isHost) return;
    try {
      await setGame({
        round: TOTAL_ROUNDS, phase: 'prepare', mode: 'written', question: '',
        answers: null, points: null, dupes: null, roundResult: null, timerEnd: 0,
        doubleRound: (choice === 'double'), voteResult: choice, voteTie: false
      });
      App.sig = '';
    } catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async hostPlayAgain(){
    if (!App.isHost) return;
    try { await setGame({ phase: 'playAgain', ready: null }); App.sig = ''; }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  async setReady(){
    if (!App.room || !App.room.game) return;
    try { await setGame({ ['ready/' + App.uid]: true }); }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  restartBusy: false,
  async hostRestart(){
    if (!App.isHost || !App.room) return;
    if (BoxGame.restartBusy) return;
    BoxGame.restartBusy = true;
    try {
      const room = App.room;
      const updates = {
        lastActivity: Date.now(),
        'game/round': 1, 'game/phase': 'prepare', 'game/mode': 'written',
        'game/question': '', 'game/answers': null, 'game/points': null,
        'game/dupes': null, 'game/roundResult': null, 'game/doubleRound': false,
        'game/timerEnd': 0, 'game/vote': null, 'game/voteTie': false, 'game/voteResult': '', 'game/ready': null
      };
      Object.keys(room.players || {}).forEach(function(pid){
        updates['players/' + pid + '/cumulative'] = (room.players[pid].cumulative || 0) + (room.players[pid].score || 0);
        updates['players/' + pid + '/score'] = 0;
        updates['players/' + pid + '/dupes'] = 0;
      });
      await App.roomRef.update(updates);
      App.sig = '';
    } catch (e){ toast('مشكلة في الاتصال', 'err'); }
    finally { setTimeout(function(){ BoxGame.restartBusy = false; }, 1200); }
  },

  build(room, g, phase, round){
    const wrap = el('div', 'phase');
    const isHost = App.isHost;
    const answererIds = getAnswererIds(room);
    const amAnswerer = answererIds.indexOf(App.uid) !== -1;
    switch (phase){
      case 'prepare':     BoxGame.uiPrepare(wrap, room, g, round, isHost); break;
      case 'reading':     BoxGame.uiReading(wrap, room, g, round, isHost); break;
      case 'answering':   BoxGame.uiAnswering(wrap, room, g, round, isHost, amAnswerer, answererIds); break;
      case 'scoring':     BoxGame.uiScoring(wrap, room, g, round, isHost, answererIds); break;
      case 'roundResult': BoxGame.uiRoundResult(wrap, room, g, round, isHost); break;
      case 'vote':        BoxGame.uiVote(wrap, room, g, isHost); break;
      case 'final':       BoxGame.uiFinal(wrap, room, g, isHost); break;
      case 'playAgain':   BoxGame.uiPlayAgain(wrap, room, g, isHost); break;
      default:            wrap.appendChild(el('div', 'waiting', '…'));
    }
    return wrap;
  },

  uiPrepare(wrap, room, g, round, isHost){
    const mode = g.mode || 'written';
    wrap.appendChild(el('h3', 'phase-title', 'تجهيز السؤال -- الجولة ' + round + (g.doubleRound ? ' 🔥 دبل' : '')));
    const chipRow = el('div', 'chip-row');
    const cWritten = el('button', 'chip' + (mode === 'written' ? ' on' : ''), 'كتابي ✍️');
    const cVerbal  = el('button', 'chip' + (mode === 'verbal' ? ' on' : ''), 'شفهي 🎤');
    cWritten.type = 'button'; cVerbal.type = 'button';
    if (isHost){
      cWritten.onclick = function(){ setGame({ mode: 'written' }); App.sig = ''; };
      cVerbal.onclick  = function(){ setGame({ mode: 'verbal' }); App.sig = ''; };
    } else { cWritten.disabled = true; cVerbal.disabled = true; }
    chipRow.appendChild(cWritten); chipRow.appendChild(cVerbal);
    wrap.appendChild(chipRow);
    if (isHost){
      if (mode === 'written'){
        const inp = el('input'); inp.type = 'text'; inp.id = 'q-input';
        inp.placeholder = 'اكتب السؤال هنا…'; inp.value = g.question || ''; inp.autocomplete = 'off';
        const btn = el('button', 'primary block', 'اعرض السؤال 📖');
        btn.onclick = function(){
          const v = inp.value.trim();
          if (!v){ toast('اكتب السؤال الأول ✍️', 'err'); return; }
          safeBlur(inp);
          setGame({ question: v, phase: 'reading' }).then(function(){ App.sig = ''; }).catch(function(){ toast('مشكلة', 'err'); });
        };
        onEnter(inp, function(){ btn.click(); });
        wrap.appendChild(inp); wrap.appendChild(btn);
      } else {
        const btn = el('button', 'primary block', 'اقرأ السؤال وابدأ التايمر 🎤⏱');
        btn.onclick = function(){ BoxGame.startTimer(); };
        wrap.appendChild(el('div', 'tiny', 'اقرأ السؤال بصوتك عالي 🎤'));
        wrap.appendChild(btn);
      }
    } else { wrap.appendChild(el('div', 'waiting', '⏳ الهوست بيجهز السؤال…')); }
  },

  uiReading(wrap, room, g, round, isHost){
    wrap.appendChild(el('h3', 'phase-title', 'اقرأ السؤال 👀'));
    wrap.appendChild(el('div', 'q-label', 'السؤال:'));
    wrap.appendChild(el('div', 'question-box', esc(g.question || '')));
    if (isHost){
      const btn = el('button', 'primary block', 'بدء التايمر ⏱');
      btn.onclick = function(){ BoxGame.startTimer(); };
      wrap.appendChild(btn);
    } else { wrap.appendChild(el('div', 'waiting', '📖 اقرأ السؤال…')); }
  },

  uiAnswering(wrap, room, g, round, isHost, amAnswerer, answererIds){
    wrap.appendChild(el('h3', 'phase-title', 'اكتب إجابتك الفريدة ✍️' + (g.doubleRound ? ' (دبل! ±30)' : '')));
    if (g.mode === 'verbal'){ wrap.appendChild(el('div', 'q-label', 'سؤال شفهي 🎤')); wrap.appendChild(el('div', 'question-box', 'اسمع الهوست 👂')); }
    else { wrap.appendChild(el('div', 'q-label', 'السؤال:')); wrap.appendChild(el('div', 'question-box', esc(g.question || ''))); }
    const timerText = el('div', 'timer-big'); timerText.id = 'box-timer-text';
    timerText.textContent = '--';
    wrap.appendChild(timerText);
    const area = el('div'); area.id = 'ans-area';
    const myAnswer = (g.answers || {})[App.uid];
    if (amAnswerer){
      if (myAnswer && myAnswer.text){ area.innerHTML = '<div class="ok-box">✅ تم إرسال إجابتك: ' + esc(myAnswer.text) + '</div>'; }
      else {
        const inp = el('input'); inp.type = 'text'; inp.id = 'ans-input'; inp.placeholder = 'إجابتك… (خليها فريدة!)'; inp.autocomplete = 'off'; inp.maxLength = 40;
        const btn = el('button', 'success block', 'إرسال الإجابة ✅');
        btn.onclick = function(){ BoxGame.submitAnswer(inp, btn); };
        onEnter(inp, function(){ btn.click(); });
        area.appendChild(inp); area.appendChild(btn);
      }
    } else { area.appendChild(el('div', 'waiting', 'أنت الحكم 👨‍⚖️ -- متابع فقط')); }
    wrap.appendChild(area);
    const counter = el('div', 'answered-count'); counter.id = 'answered-count';
    counter.textContent = countAnswered(room) + ' / ' + answererIds.length + ' أجابوا';
    wrap.appendChild(counter);
    if (isHost){
      const endBtn = el('button', 'warn block', 'إنهاء التايمر ⏹');
      endBtn.onclick = function(){ BoxGame.hostEndTimer(); };
      wrap.appendChild(endBtn);
    }
  },

  async submitAnswer(inp, btn){
    const text = inp.value.trim();
    if (!text){ toast('اكتب إجابة الأول 🙃', 'err'); return; }
    if (text.length > 40){ toast('الإجابة طويلة (40 حرف كحد أقصى)', 'err'); return; }
    btn.disabled = true; btn.textContent = 'جاري الإرسال... ⏳';
    safeBlur(inp);
    try {
      const patch = {};
      patch['game/answers/' + App.uid] = { text: text, ts: Date.now() };
      patch['lastActivity'] = Date.now();
      await App.roomRef.update(patch);
      const area = $('ans-area');
      if (area) area.innerHTML = '<div class="ok-box">✅ تم إرسال إجابتك: ' + esc(text) + '</div>';
      const counter = $('answered-count');
      if (counter && App.room) counter.textContent = countAnswered(App.room) + ' / ' + getAnswererIds(App.room).length + ' أجابوا';
    } catch (e){ btn.disabled = false; btn.textContent = 'إرسال الإجابة ✅'; toast('مشكلة في الاتصال', 'err'); }
  },

  uiScoring(wrap, room, g, round, isHost, answererIds){
    wrap.appendChild(el('h3', 'phase-title', 'تقييم الجولة ' + round + (g.doubleRound ? ' 🔥' : '')));
    const list = el('div', 'list');
    answererIds.forEach(function(pid){
      const p = room.players[pid]; if (!p) return;
      const ans = (g.answers || {})[pid];
      const pts = (g.points || {})[pid] || 0;
      const row = el('div', 'row' + (pid === App.uid ? ' me' : ''));
      const cls = pts > 0 ? 'pos' : (pts < 0 ? 'neg' : '');
      row.innerHTML = '<div class="r-ava">' + esc(p.avatar) + '</div>' +
        '<div class="r-main"><div class="r-name">' + nameWithCrown(room, pid, p.name) + '</div>' +
        '<div class="r-ans' + (ans && ans.text ? '' : ' none') + '">' + (ans && ans.text ? esc(ans.text) : '-- لم يجب --') + '</div></div>' +
        '<div class="r-pts ' + cls + '">' + (pts > 0 ? '+' : '') + pts + '</div>';
      if (isHost){
        const ctrl = el('div', 'r-ctrl');
        const plus = el('button', 'mini', '+'); const minus = el('button', 'mini', '−');
        plus.type = 'button'; minus.type = 'button';
        plus.onclick = function(){ BoxGame.adjustPoints(pid, +1); };
        minus.onclick = function(){ BoxGame.adjustPoints(pid, -1); };
        ctrl.appendChild(plus); ctrl.appendChild(minus); row.appendChild(ctrl);
      }
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if (isHost){
      wrap.appendChild(el('div', 'tiny', 'النقاط محسوبة تلقائياً. عدّل يدوياً قبل التأكيد.'));
      const btn = el('button', 'primary block', 'تأكيد النتيجة ✅');
      btn.onclick = function(){ BoxGame.hostConfirmScores(); };
      wrap.appendChild(btn);
    } else { wrap.appendChild(el('div', 'waiting', '⏳ الهوست بيراجع…')); }
  },

  uiRoundResult(wrap, room, g, round, isHost){
    wrap.appendChild(el('h3', 'phase-title', 'نتائج الجولة ' + round));
    const rr = g.roundResult || {};
    const players = getSortedPlayers(room);
    const list = el('div', 'list');
    players.forEach(function(p){
      const r = rr[p.id] || { points: 0, total: p.score || 0 };
      const ans = (g.answers || {})[p.id];
      const cls = r.points > 0 ? 'pos' : (r.points < 0 ? 'neg' : '');
      const row = el('div', 'row' + (p.id === App.uid ? ' me' : ''));
      row.innerHTML = '<div class="r-ava">' + esc(p.avatar) + '</div>' +
        '<div class="r-main"><div class="r-name">' + nameWithCrown(room, p.id, p.name) + '</div>' +
        '<div class="r-ans' + (ans && ans.text ? '' : ' none') + '">' + (ans && ans.text ? esc(ans.text) : '-- لم يجب --') + '</div></div>' +
        '<div class="r-pts ' + cls + '">' + (r.points > 0 ? '+' : '') + r.points + '</div>' +
        '<div class="r-total">مجموع<br>' + r.total + '</div>';
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if (isHost){
      const isLast = (round >= TOTAL_ROUNDS);
      const label = (round === TOTAL_ROUNDS - 1) ? 'إلى التصويت 🗳️' : (isLast ? 'النتيجة النهائية 🏆' : 'الجولة التالية ▶️');
      const btn = el('button', 'primary block', label);
      btn.onclick = function(){ BoxGame.hostNextRound(); };
      wrap.appendChild(btn);
    } else { wrap.appendChild(el('div', 'waiting', '⏳ في انتظار الهوست…')); }
  },

  uiVote(wrap, room, g, isHost){
    wrap.appendChild(el('h3', 'phase-title', 'تصويت الجولة الأخيرة 🗳️'));
    const votes = g.vote || {};
    let normal = 0, double = 0;
    Object.keys(votes).forEach(function(pid){ if (votes[pid] === 'double') double++; else if (votes[pid] === 'normal') normal++; });
    const myVote = votes[App.uid];
    wrap.appendChild(el('div', 'waiting', 'الجولة العاشرة! عادي (10) ولا دبل (30/-30)?'));
    const chipRow = el('div', 'chip-row');
    const cNormal = el('button', 'chip' + (myVote === 'normal' ? ' on' : ''), 'عادي -- 10 نقاط<br><small>' + normal + ' صوت</small>');
    const cDouble = el('button', 'chip' + (myVote === 'double' ? ' on' : ''), 'دبل -- 30/-30 🔥<br><small>' + double + ' صوت</small>');
    cNormal.type = 'button'; cDouble.type = 'button';
    cNormal.onclick = function(){ BoxGame.castVote('normal'); };
    cDouble.onclick = function(){ BoxGame.castVote('double'); };
    if (g.voteTie){ cNormal.disabled = true; cDouble.disabled = true; }
    chipRow.appendChild(cNormal); chipRow.appendChild(cDouble);
    wrap.appendChild(chipRow);
    const totalVoters = Object.keys(room.players || {}).length;
    wrap.appendChild(el('div', 'tiny', (normal + double) + ' / ' + totalVoters + ' صوّتوا'));
    if (isHost){
      if (g.voteTie){
        wrap.appendChild(el('div', 'waiting', 'تعادل! قرارك 👑'));
        const tieRow = el('div', 'chip-row');
        const b1 = el('button', 'chip on', 'عادي (10)'); const b2 = el('button', 'chip on', 'دبل (30/-30) 🔥');
        b1.type = 'button'; b2.type = 'button';
        b1.onclick = function(){ BoxGame.hostStartRound10('normal'); };
        b2.onclick = function(){ BoxGame.hostStartRound10('double'); };
        tieRow.appendChild(b1); tieRow.appendChild(b2); wrap.appendChild(tieRow);
      } else {
        const btn = el('button', 'primary block', 'احسم التصويت ✅');
        btn.onclick = function(){ BoxGame.hostResolveVote(); };
        wrap.appendChild(btn);
      }
    } else { wrap.appendChild(el('div', 'waiting', '⏳ في انتظار الهوست…')); }
  },

  uiFinal(wrap, room, g, isHost){
    const players = getSortedPlayers(room);
    const winner = players[0];
    if (winner){
      const wbox = el('div', 'winner-box');
      wbox.innerHTML = '<div class="w-title">🏆 الفائز 🏆</div>' +
        '<div class="w-ava">' + esc(winner.avatar) + '</div>' +
        '<div class="w-name">' + esc(winner.name) + (room.hostId === winner.id ? ' 👑' : '') + '</div>' +
        '<div class="w-score">' + (winner.score || 0) + ' نقطة</div>' +
        ((winner.cumulative || 0) > 0 ? '<div class="tiny" style="margin-top:6px">تراكمي: ' + winner.cumulative + ' نقطة</div>' : '');
      wrap.appendChild(wbox);
    }
    const totalPlayers = Object.keys(room.players || {}).length;
    if (totalPlayers > 4){
      let bidon = null;
      players.forEach(function(p){ const d = p.dupes || 0; if (d > 0 && (!bidon || d > (bidon.dupes || 0))) bidon = p; });
      if (bidon){
        const bbox = el('div', 'bidon-box');
        bbox.innerHTML = '<div class="b-title">🎯 لقب "البيدون"</div><div class="b-name">' + esc(bidon.avatar) + ' ' + esc(bidon.name) + '</div>';
        wrap.appendChild(bbox);
      }
    }
    const list = el('div', 'list');
    players.forEach(function(p, i){
      const medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : (i + 1)));
      const row = el('div', 'row' + (p.id === App.uid ? ' me' : ''));
      row.innerHTML = '<div class="rank-medal">' + medal + '</div>' +
        '<div class="r-ava">' + esc(p.avatar) + '</div>' +
        '<div class="r-main"><div class="r-name">' + nameWithCrown(room, p.id, p.name) + '</div>' +
        ((p.cumulative || 0) > 0 ? '<div class="r-ans">تراكمي: ' + p.cumulative + '</div>' : '') + '</div>' +
        '<div class="r-pts pos">' + (p.score || 0) + '</div>';
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if (isHost){
      const btn = el('button', 'primary block', 'إعادة الزعبله 🔁');
      btn.onclick = function(){ BoxGame.hostPlayAgain(); };
      wrap.appendChild(btn);
    } else { wrap.appendChild(el('div', 'waiting', '⏳ في انتظار الهوست…')); }
  },

  uiPlayAgain(wrap, room, g, isHost){
    wrap.appendChild(el('h3', 'phase-title', 'إعادة الزعبله 🔁'));
    const ready = g.ready || {};
    const total = Object.keys(room.players || {}).length;
    const readyCount = Object.keys(ready).filter(function(k){ return ready[k]; }).length;
    wrap.appendChild(el('div', 'waiting', 'الاستعداد: ' + readyCount + ' / ' + total + ' زعبول'));
    if (!isHost){
      if (ready[App.uid]) wrap.appendChild(el('div', 'ok-box', '✅ أنت مستعد!'));
      else {
        const btn = el('button', 'success block', 'أنا مستعد ✋');
        btn.onclick = function(){ BoxGame.setReady(); };
        wrap.appendChild(btn);
      }
    } else {
      wrap.appendChild(el('div', 'tiny', 'في انتظار استعداد الجميع…'));
      const btn = el('button', 'primary block', 'ابدأ من جديد 🚀');
      btn.disabled = readyCount < total;
      btn.onclick = function(){ BoxGame.hostRestart(); };
      wrap.appendChild(btn);
    }
  }
};

/* ================================================================
   6) BaiDonGame — Final version
   ================================================================ */
const BaiDonGame = {
  _lastPositions: {},

  getConfig(count){
    if (count <= 3) return { target: 20, maxNum: 3, middleLine: 10, dangerZone: 15 };
    if (count <= 5) return { target: 30, maxNum: 4, middleLine: 15, dangerZone: 23 };
    return { target: 40, maxNum: 5, middleLine: 20, dangerZone: 30 };
  },

  emptyState(){
    return {
      round: 1, phase: 'idle', timerEnd: 0,
      target: 20, maxNum: 3, middleLine: 10, dangerZone: 15,
      baiDonId: null, baiDonRevealed: false,
      actions: null, votes: null, endGuessUid: null,
      lastResult: null, voteResult: null,
      finalMessage: '', winner: '', winnerName: '',
      introReady: null
    };
  },

  async hostStart(){
    if (!App.isHost || !App.room) return;
    const players = App.room.players || {};
    const ids = Object.keys(players);
    if (ids.length < 2){ toast('الحد الأدنى لاعبين للبدء في البيدون', 'err'); return; }
    const cfg = BaiDonGame.getConfig(ids.length);
    const candidateIds = App.room.hostMode === 'judge' ? ids.filter(id => id !== App.room.hostId) : ids;

  // ✅ FIX: disguise => don't set move
  async submitAction(move, attackNum, disguise){
    if (!App.room || !App.room.game) return;
    const g = App.room.game;
    if (g.phase !== 'action') return;
    const baiDonId = g.baiDonId;
    const amBaiDon = (App.uid === baiDonId);
    const isRevealed = !!g.baiDonRevealed;
    const ps = g.playerState || {};
    const myPs = ps[App.uid];
    if (!myPs || myPs.eliminated || myPs.frozen > 0) return;

    const action = {};
    if (amBaiDon){
      const disguiseOn = disguise && myPs.hearts > 1;
      if (!isRevealed && !disguiseOn) action.move = move;   // ← مش بنحفظ move لو مموّه
      action.attack = attackNum;
      if (disguiseOn) action.disguise = true;
    } else {
      if (!move) return;
      action.move = move;
    }
    action.ts = Date.now();
    try { await setGame({ ['actions/' + App.uid]: action }); }
    catch (e){ toast('مشكلة في الاتصال', 'err'); }
  },

  resolveBusy: false,
  async hostResolve(){
    if (!App.room || !App.room.game) return;
    if (BaiDonGame.resolveBusy) return;
    BaiDonGame.resolveBusy = true;
    try {
      const room = App.room;
      const g = room.game;
      if (g.phase !== 'action') return;
      const actions = g.actions || {};
      const baiDonId = g.baiDonId;
      const baiDonRevealed = !!g.baiDonRevealed;
      const ps = JSON.parse(JSON.stringify(g.playerState || {}));
      const target = g.target || 20;
      const middleLine = g.middleLine || 10;
      const dangerZone = g.dangerZone || 15;
      const round = g.round || 1;

      const events = [];
      const hitThisRound = {};

      const bdAction = actions[baiDonId];
      const attackNum = bdAction ? bdAction.attack : null;
      const wantDisguise = !!(bdAction && bdAction.disguise);

      let botUsed = false;
      let effectiveAttack = attackNum;
      if (!effectiveAttack){
        const bdOnline = room.players[baiDonId] && room.players[baiDonId].online;
        if (!bdOnline){
          effectiveAttack = Math.floor(Math.random() * g.maxNum) + 1;
          botUsed = true;
        }
      }

      // 1. BaiDon attack (against runners only)
      if (effectiveAttack){
        Object.keys(actions).forEach(function(uid){
          if (uid === baiDonId) return;
          const a = actions[uid];
          if (!a || !a.move) return;
          const p = ps[uid];
          if (!p || p.eliminated) return;
          if (a.move === effectiveAttack){
            hitThisRound[uid] = true;
            p.hearts = Math.max(0, p.hearts - 1);
            events.push({ type: 'hit', uid: uid, attackNum: effectiveAttack, bot: botUsed });
            const gap = p.lastHitRound ? (round - p.lastHitRound) : 999;
            if (gap <= 3){
              p.frozen = (p.frozen || 0) + 1;
              events.push({ type: 'freeze', uid: uid });
              p.lastHitRound = 0;
            } else {
              p.lastHitRound = round;
            }
          }
        });
      }

      // 2. Disguise: baiDon attacks HIMSELF (real heart loss)
      const bdPs = ps[baiDonId];
      if (wantDisguise && bdPs && !bdPs.eliminated && bdPs.hearts > 1){
        bdPs.hearts -= 1;
        events.push({ type: 'hit', uid: baiDonId, attackNum: effectiveAttack, disguise: true });
      }

      // 3. Apply movements
      Object.keys(actions).forEach(function(uid){
        const p = ps[uid];
        if (!p || p.eliminated) return;
        if (p.frozen > 0){
          p.frozen -= 1;
          if (p.frozen > 0) events.push({ type: 'stillFrozen', uid: uid });
          return;
        }
        if (hitThisRound[uid]) return;

        // ✅ KEY FIX: disguise = no movement for baiDon
        if (wantDisguise && uid === baiDonId) return;

        if (uid === baiDonId && baiDonRevealed) return;
        const a = actions[uid];
        if (!a || !a.move) return;

        const prevPos = p.pos;
        p.pos = Math.min(target, p.pos + a.move);
        if (prevPos < middleLine && p.pos >= middleLine && !p.crossedMiddle){
          p.crossedMiddle = true;
          p.hearts = Math.min(4, p.hearts + 1);
          events.push({ type: 'middleLine', uid: uid });
        }
        if (p.pos >= dangerZone && !p.inDanger){
          p.inDanger = true;
          if (p.hearts > 2){ p.hearts = 2; events.push({ type: 'dangerZone', uid: uid }); }
        }
        events.push({ type: 'move', uid: uid, from: prevPos, to: p.pos });
      });

      // 4. Eliminations
      Object.keys(ps).forEach(function(uid){
        if (ps[uid].hearts <= 0 && !ps[uid].eliminated){
          ps[uid].eliminated = true;
          events.push({ type: 'eliminated', uid: uid });
        }
      });

      // 5. Win conditions
      const runnersAlive = Object.keys(ps).filter(function(uid){
        return uid !== baiDonId && !ps[uid].eliminated && ps[uid].hearts > 0;
      });

      let winner = null, winnerName = '', finalMessage = '', endGuessUid = null;

      if (!baiDonRevealed && bdPs && !bdPs.eliminated && bdPs.pos >= target){
        winner = 'baidon';
        winnerName = room.players[baiDonId] ? room.players[baiDonId].name : '';
        finalMessage = '🎭 البيدون الحقيقي ' + (room.players[baiDonId] ? room.players[baiDonId].avatar + ' ' + room.players[baiDonId].name : '') + ' غفلكم وفاز بالسباق!';
      } else if (baiDonRevealed && runnersAlive.length === 0){
        winner = 'baidon';
        winnerName = room.players[baiDonId] ? room.players[baiDonId].name : '';
        finalMessage = '🎭 البيدون الحقيقي ' + (room.players[baiDonId] ? room.players[baiDonId].avatar + ' ' + room.players[baiDonId].name : '') + ' فاز عليكم!';
      } else {
        const runnersAtEnd = Object.keys(ps).filter(function(uid){
          return uid !== baiDonId && !ps[uid].eliminated && ps[uid].pos >= target;
        });
        if (runnersAtEnd.length > 0){
          if (baiDonRevealed){
            winner = 'runner';
            winnerName = room.players[runnersAtEnd[0]] ? room.players[runnersAtEnd[0]].name : '';
            finalMessage = '🏆 الزعبول السالك ' + (room.players[runnersAtEnd[0]] ? room.players[runnersAtEnd[0]].avatar + ' ' + room.players[runnersAtEnd[0]].name : '') + ' فاز عليكم!';
          } else {
            endGuessUid = runnersAtEnd[0];
          }
        }
      }

      const updates = {
        lastActivity: Date.now(),
        'game/actions': null,
        'game/lastResult': { events: events, round: round, attackNum: effectiveAttack, bot: botUsed }
      };
      Object.keys(ps).forEach(function(uid){
        updates['game/playerState/' + uid + '/pos'] = ps[uid].pos;
        updates['game/playerState/' + uid + '/hearts'] = ps[uid].hearts;
        updates['game/playerState/' + uid + '/frozen'] = ps[uid].frozen;
        updates['game/playerState/' + uid + '/eliminated'] = ps[uid].eliminated;
        updates['game/playerState/' + uid + '/lastHitRound'] = ps[uid].lastHitRound;
        updates['game/playerState/' + uid + '/crossedMiddle'] = ps[uid].crossedMiddle;
        updates['game/playerState/' + uid + '/inDanger'] = ps[uid].inDanger;
        updates['players/' + uid + '/score'] = ps[uid].pos;
        updates['players/' + uid + '/hearts'] = ps[uid].hearts;
        updates['players/' + uid + '/pos'] = ps[uid].pos;
      });

      if (winner){
        updates['game/phase'] = 'final';
        updates['game/winner'] = winner;
        updates['game/winnerName'] = winnerName;
        updates['game/finalMessage'] = finalMessage;
        if (winner === 'baidon'){
          updates['players/' + baiDonId + '/cumulative'] = (room.players[baiDonId].cumulative || 0) + 100;
        }
      } else if (endGuessUid){
        updates['game/phase'] = 'endGuess';
        updates['game/endGuessUid'] = endGuessUid;
      } else {
        updates['game/phase'] = 'resolve';
      }

      await App.roomRef.update(updates);
      App.sig = '';

      events.forEach(function(ev){
        if (ev.uid === App.uid){
          if (ev.type === 'hit' && !ev.disguise){
            document.body.classList.add('red-flash');
            setTimeout(function(){ document.body.classList.remove('red-flash'); }, 800);
          }
          if (ev.type === 'middleLine') showHeartPop();
          if (ev.type === 'dangerZone') toast('تحذير ⚠️ دخلت منطقة الرعب! تم تنزيل قلوبك لقلبين!', 'err');
        }
      });
      events.forEach(function(ev){
        if (ev.type === 'middleLine'){
          const p = room.players[ev.uid];
          if (p) toast('عاش يا ' + p.name + '! عديت النص وخدت قلب هدية (+١)', 'ok');
        }
      });
    } catch (e){
      console.error(e);
      toast('مشكلة في الاتصال', 'err');
    } finally {
      setTimeout(function(){ BaiDonGame.resolveBusy = false; }, 800);
    }
  },

  async castVote(targetId){
    if (!App.room || !App.room.game || App.room.game.phase !== 'vote') return;
    if (targetId === App.uid){ toast('متقدرش تصوت لنفسك', 'err'); return; }

  async hostResolveVote(){
    if (!App.isHost || !App.room) return;
    const g = App.room.game;
    if (!g || g.phase !== 'vote') return;
    const votes = g.votes || {};
    const voteCounts = {};
    Object.keys(votes).forEach(function(voter){
      const target = votes[voter];
      if (target) voteCounts[target] = (voteCounts[target] || 0) + 1;
    });
    let topId = null, topCount = 0, tie = false;
    Object.keys(voteCounts).forEach(function(id){
      if (voteCounts[id] > topCount){ topCount = voteCounts[id]; topId = id; tie = false; }
      else if (voteCounts[id] === topCount && topCount > 0){ tie = true; }
    });

    if (!topId || tie){
      try {
        await setGame({ phase: 'voteResult', voteResult: { tie: true, topId: null, counts: voteCounts } });
        App.sig = '';
        toast('تعادل -- تستمر اللعبة');
      } catch (e){}
      return;
    }

    const baiDonId = g.baiDonId;
    const ps = JSON.parse(JSON.stringify(g.playerState || {}));
    const updates = {
      lastActivity: Date.now(),
      'game/voteResult': { tie: false, topId: topId, counts: voteCounts, wasBaiDon: topId === baiDonId }
    };

    if (topId === baiDonId){
      updates['game/baiDonRevealed'] = true;
      if (ps[baiDonId]){
        ps[baiDonId].pos = 0;
        updates['game/playerState/' + baiDonId + '/pos'] = 0;
        updates['players/' + baiDonId + '/pos'] = 0;
        updates['players/' + baiDonId + '/score'] = 0;
      }
      updates['game/phase'] = 'voteResult';
      toast('🎭 تم كشف البيدون! ' + (App.room.players[baiDonId] ? App.room.players[baiDonId].name : '') + ' أصبح Turret!', 'ok');
    } else {
      Object.keys(votes).forEach(function(voter){
        if (votes[voter] === topId){
          if (ps[voter]){
            ps[voter].pos = Math.max(0, ps[voter].pos - 2);
            updates['game/playerState/' + voter + '/pos'] = ps[voter].pos;
            updates['players/' + voter + '/pos'] = ps[voter].pos;
            updates['players/' + voter + '/score'] = ps[voter].pos;
          }
        }
      });
      updates['game/phase'] = 'voteResult';
      toast('❌ تصويت خاطئ! ' + (App.room.players[topId] ? App.room.players[topId].name : '') + ' بريء -- اللي صوّت ضده رجع خطوتين', 'err');
    }
    try { await App.roomRef.update(updates); App.sig = ''; }
    catch (e){ toast('مشكلة', 'err'); }
  },

  build(room, g, phase, round){
    const wrap = el('div', 'phase');
    const isHost = App.isHost;
    const amBaiDon = (g.baiDonId === App.uid);
    const isRevealed = !!g.baiDonRevealed;
    const ps = g.playerState || {};
    const myPs = ps[App.uid];
    const isEliminated = !!(myPs && myPs.eliminated);
    const isFrozen = !!(myPs && myPs.frozen > 0);

    switch (phase){
      case 'intro':      BaiDonGame.uiIntro(wrap, room, g, isHost, amBaiDon); break;
      case 'action':     BaiDonGame.uiAction(wrap, room, g, round, isHost, amBaiDon, isRevealed, isEliminated, isFrozen); break;
      case 'resolve':    BaiDonGame.uiResolve(wrap, room, g, round, isHost); break;
      case 'vote':       BaiDonGame.uiVote(wrap, room, g, isHost, isEliminated); break;
      case 'voteResult': BaiDonGame.uiVoteResult(wrap, room, g, isHost); break;
      case 'endGuess':   BaiDonGame.uiEndGuess(wrap, room, g, isHost); break;
      case 'final':      BaiDonGame.uiFinal(wrap, room, g, isHost); break;
      case 'playAgain':  BaiDonGame.uiPlayAgain(wrap, room, g, isHost); break;
      default:           wrap.appendChild(el('div', 'waiting', '…'));
    }
    return wrap;
  },

  // ---------- TRACK: static by default, slide only when position changes ----------
  buildTrack(room, g){
    const wrap = el('div', 'bd-track-wrap');
    const track = el('div', 'bd-track');
    const target = g.target || 20;
    const ps = g.playerState || {};

    // Numbers
    const marks = [0];
    for (let i = 5; i < target; i += 5) marks.push(i);
    marks.push(target);
    marks.forEach(function(num){
      const m = el('div', 'bd-num' + (num === 0 || num === target || num === g.middleLine ? ' major' : ''));
      m.textContent = String(num);
      m.style.left = ((num / target) * 100) + '%';
      track.appendChild(m);
    });

    const midPct = ((g.middleLine || 10) / target) * 100;
    const mid = el('div', 'mid-line');
    mid.style.left = midPct + '%';
    track.appendChild(mid);

    const dngPct = ((g.dangerZone || 15) / target) * 100;
    const dng = el('div', 'danger-line');
    dng.style.left = dngPct + '%';
    track.appendChild(dng);

    track.appendChild(el('div', 'finish-line'));

    // Tokens — sorted by joinedAt for stable vertical position
    const ids = Object.keys(room.players || {}).filter(function(uid){
      const p = ps[uid];
      return p && !p.eliminated;
    });
    ids.sort(function(a, b){
      return (room.players[a].joinedAt || 0) - (room.players[b].joinedAt || 0);
    });

    ids.forEach(function(uid, i){
      const p = ps[uid];
      const player = room.players[uid];
      if (!player) return;

      const token = el('div', 'bd-token' + (uid === App.uid ? ' me' : '') + (p.frozen > 0 ? ' frozen' : '') + (uid === g.baiDonId && g.baiDonRevealed ? ' baiDonRevealed' : ''));
      token.style.top = (i % 3 === 0 ? '18%' : (i % 3 === 1 ? '44%' : '70%'));

      let display = player.avatar;
      if (uid === g.baiDonId && g.baiDonRevealed) display = '🎭';
      token.textContent = display;
      token.title = (player.name || '') + ' — ' + p.pos + '/' + target + ' ❤️' + p.hearts;

      const newPct = (p.pos / target) * 100;
      const prevPos = BaiDonGame._lastPositions[uid];

      if (prevPos !== undefined && prevPos !== p.pos){
        // Position changed → animate from old to new
        const oldPct = (prevPos / target) * 100;
        token.style.left = oldPct + '%';
        token.style.transition = 'none';
        // Force reflow
        void token.offsetWidth;
        token.classList.add('sliding');
        token.style.left = newPct + '%';
      } else {
        // Static position
        token.style.left = newPct + '%';
      }

      track.appendChild(token);
      BaiDonGame._lastPositions[uid] = p.pos;
    });

    wrap.appendChild(track);
    return wrap;
  },
