<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0518">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>زعبوله | البيدون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:#f4ecff;min-height:100vh;
  background:linear-gradient(-45deg,#0b0518,#1a0b2e,#08131f,#2a0a22);
  background-size:400% 400%;animation:bgmove 22s ease infinite;
  overflow-x:hidden;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes bgmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.42;pointer-events:none;z-index:0;}
.orb.a{width:250px;height:250px;background:#ff2e9a;top:-70px;right:-70px;animation:float1 15s ease-in-out infinite;}
.orb.b{width:230px;height:230px;background:#00f0ff;bottom:-80px;left:-80px;animation:float2 18s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,38px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-30px)}}

button{font-family:inherit;font-size:16px;font-weight:800;color:#fff;border:none;outline:none;cursor:pointer;border-radius:16px;padding:14px 18px;transition:filter .14s,box-shadow .2s,opacity .2s;-webkit-user-select:none;user-select:none;touch-action:manipulation;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;}
button:active{filter:brightness(.78);}
button:disabled{opacity:.42;filter:grayscale(.45);}
button.primary{background:linear-gradient(135deg,#ff2e9a,#a855f7);box-shadow:0 6px 22px rgba(255,46,154,.38),0 0 0 1px rgba(255,255,255,.12) inset;}
button.secondary{background:linear-gradient(135deg,#00f0ff,#3b82f6);box-shadow:0 6px 22px rgba(0,240,255,.30);color:#04141a;}
button.success{background:linear-gradient(135deg,#22ff88,#0ea5a4);box-shadow:0 6px 22px rgba(34,255,136,.28);color:#06231a;}
button.warn{background:linear-gradient(135deg,#ffb020,#ff5e3a);box-shadow:0 6px 22px rgba(255,94,58,.3);color:#241000;}
button.ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:none;font-weight:700;}
button.small{font-size:13px;padding:9px 14px;border-radius:12px;}
button.block{width:100%;}

input[type=text],input[type=tel]{font-family:inherit;font-size:16px;font-weight:700;width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);color:#fff;outline:none;transition:border-color .18s,background .18s;-webkit-appearance:none;appearance:none;}
input::placeholder{color:rgba(255,255,255,.35);font-weight:600;}
input:focus{border-color:#ff2e9a;background:rgba(255,255,255,.11);}
input[type=tel]{letter-spacing:6px;text-align:center;font-size:22px;font-weight:900;}

#app{position:relative;z-index:2;padding:16px 14px 90px;max-width:960px;margin:0 auto;}
.screen{display:none;animation:fadein .28s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:rgba(22,10,40,.72);border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:20px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.45);margin-bottom:16px;}
h1,h2,h3,h4{margin:0 0 12px;line-height:1.25;}
h2{font-size:22px;font-weight:900;}
h3{font-size:18px;font-weight:800;}
label{display:block;font-size:14px;font-weight:800;margin:16px 0 8px;color:#c9b6ff;}
label:first-child{margin-top:0;}

.brand{text-align:center;padding:34px 0 22px;}
.logo{font-size:clamp(44px,15vw,76px);font-weight:900;letter-spacing:-2px;margin:0;background:linear-gradient(120deg,#ff2e9a,#00f0ff 45%,#22ff88 75%,#a855f7);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 6s ease infinite;filter:drop-shadow(0 4px 26px rgba(255,46,154,.45));}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tag{color:#a797c9;font-size:15px;font-weight:700;margin:6px 0 0;line-height:1.6;}

.setup-tab-row{display:flex;gap:6px;margin-bottom:8px;}
.setup-tab{flex:1;font-size:13px;font-weight:800;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#c9b6ff;cursor:pointer;}
.setup-tab.on{background:linear-gradient(135deg,rgba(0,240,255,.28),rgba(59,130,246,.22));border-color:#00f0ff;color:#fff;}

.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;}
.asset-grid.cars{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));max-height:160px;}
.asset-tile{aspect-ratio:1/1;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;}
.asset-tile img{width:100%;height:100%;object-fit:contain;padding:4px;}
.asset-tile.sel{border-color:#ff2e9a;background:rgba(255,46,154,.20);box-shadow:0 0 16px rgba(255,46,154,.55);}

.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.pin-badge{font-size:15px;font-weight:800;color:#c9b6ff;}
.pin-badge span{display:inline-block;font-size:24px;font-weight:900;letter-spacing:5px;color:#00f0ff;text-shadow:0 0 16px rgba(0,240,255,.7);margin-inline-start:6px;}
.lobby-sub{font-size:13px;color:#8d7fb0;font-weight:700;margin-top:4px;}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin:14px 0;}
.pcard{position:relative;border-radius:16px;padding:10px 6px 8px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);}
.pcard.off{opacity:.45;}
.pcard .pava{font-size:26px;line-height:1.1;width:100%;height:32px;display:flex;align-items:center;justify-content:center;}
.pcard .pava img{max-width:100%;max-height:100%;object-fit:contain;}
.pcard .pname{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#efe6ff;}
.pcard .host-tag{font-size:10px;font-weight:800;color:#ffd166;margin-top:2px;}
.pcard .off-tag{font-size:10px;font-weight:800;color:#ff6b8a;margin-top:2px;}
.pcard .kick{position:absolute;top:-7px;left:-7px;width:24px;height:24px;min-width:24px;border-radius:50%;font-size:12px;padding:0;font-weight:900;background:linear-gradient(135deg,#ff2e5e,#ff5e3a);color:#fff;box-shadow:0 4px 12px rgba(255,46,94,.5);}

.game-topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:6px;position:sticky;top:8px;z-index:20;}
.pill{background:rgba(22,10,40,.88);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:900;color:#e5d9ff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;}
#game-timer{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.6);min-width:74px;text-align:center;}
#game-score{color:#22ff88;text-shadow:0 0 14px rgba(34,255,136,.5);}

/* === TOP BAR (per player) === */
.race-top-bar{
  display:flex;gap:6px;overflow-x:auto;padding:6px 4px;margin-bottom:6px;
  background:rgba(22,10,40,.65);border:1px solid rgba(255,255,255,.10);
  border-radius:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.race-top-bar::-webkit-scrollbar{display:none;}
.rtb-player{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:56px;padding:5px 4px;border-radius:10px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  font-size:9px;font-weight:800;color:#e5d9ff;text-align:center;position:relative;
  transition:border-color .2s,background .2s;
}
.rtb-player.me{border-color:rgba(255,46,154,.55);background:rgba(255,46,154,.10);}
.rtb-player.is-speaking{background:rgba(34,255,136,.18);border-color:#22ff88;box-shadow:0 0 10px rgba(34,255,136,.5);}
.rtb-player.revealed-bd{border-color:#ff2e5e;box-shadow:0 0 10px rgba(255,46,94,.5);}
.rtb-ava{font-size:18px;line-height:1.1;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.rtb-ava img{max-width:100%;max-height:100%;object-fit:contain;}
.rtb-name{font-size:9px;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;}
.rtb-score{font-size:10px;color:#22ff88;font-weight:900;}
.rtb-mic{
  position:absolute;top:2px;right:2px;width:14px;height:14px;
  font-size:8px;padding:0;border-radius:50%;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;line-height:1;
  min-width:14px;
}
.rtb-mic.on{background:rgba(34,255,136,.7);border-color:#22ff88;animation:pulse 1s infinite;}
.rtb-mic:disabled{opacity:.4;cursor:default;}

.game-hint{position:sticky;top:56px;z-index:19;font-size:11px;font-weight:700;color:#c9b6ff;background:rgba(22,10,40,.88);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:6px 12px;text-align:center;margin-bottom:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);line-height:1.5;}
.game-hint.hidden{display:none;}

.phase{display:flex;flex-direction:column;gap:10px;}
.phase-title{font-size:19px;font-weight:900;text-align:center;margin:0;background:linear-gradient(120deg,#ff2e9a,#00f0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(255,46,154,.35));}
.waiting{text-align:center;font-size:15px;font-weight:800;color:#a797c9;padding:18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.16);}
.ok-box{text-align:center;font-size:15px;font-weight:800;color:#06231a;padding:16px;border-radius:16px;background:linear-gradient(135deg,#22ff88,#0ea5a4);box-shadow:0 8px 26px rgba(34,255,136,.3);word-break:break-word;}
.answered-count{text-align:center;font-size:14px;font-weight:800;color:#c9b6ff;padding:6px;}
.timer-big{text-align:center;font-size:28px;font-weight:900;color:#00f0ff;text-shadow:0 0 22px rgba(0,240,255,.65);padding:2px;letter-spacing:2px;line-height:1;}

.list{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);}
.row.me{border-color:rgba(255,46,154,.55);background:rgba(255,46,154,.10);}
.row .r-ava{font-size:22px;line-height:1;min-width:30px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.row .r-ava img{max-width:100%;max-height:100%;object-fit:contain;}
.row .r-main{flex:1;min-width:0;}
.row .r-name{font-size:13px;font-weight:900;color:#efe6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-medal{font-size:22px;min-width:30px;text-align:center;}

.winner-box{text-align:center;padding:22px 16px;border-radius:22px;background:linear-gradient(140deg,rgba(255,46,154,.22),rgba(0,240,255,.14));border:1.5px solid rgba(255,46,154,.45);box-shadow:0 0 40px rgba(255,46,154,.25);}
.winner-box .w-title{font-size:13px;font-weight:800;color:#c9b6ff;}
.winner-box .w-ava{font-size:52px;line-height:1.2;height:64px;display:flex;align-items:center;justify-content:center;}
.winner-box .w-ava img{max-height:100%;max-width:100%;object-fit:contain;}
.winner-box .w-name{font-size:24px;font-weight:900;}
.winner-box .w-score{font-size:15px;font-weight:800;color:#00f0ff;margin-top:4px;}

#toast-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;padding:0 14px;}
.toast{max-width:92vw;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:800;color:#fff;background:rgba(30,14,54,.96);border:1.5px solid rgba(0,240,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.55);animation:tin .25s ease;text-align:center;}
.toast.err{border-color:rgba(255,46,94,.75);background:rgba(52,10,26,.96);}
.toast.ok{border-color:rgba(34,255,136,.75);background:rgba(8,44,28,.96);}
.toast.out{opacity:0;transition:opacity .35s;}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

#loading-overlay{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(6,2,14,.86);font-size:16px;font-weight:900;color:#fff;}
#loading-overlay.hidden{display:none;}
.loader{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.14);border-top-color:#ff2e9a;border-right-color:#00f0ff;animation:spin .85s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none!important;}
.tiny{font-size:12px;color:#8d7fb0;font-weight:700;text-align:center;line-height:1.7;}
.stack{display:flex;flex-direction:column;gap:10px;}
.center{text-align:center;}
.crown{color:#ffd166;font-size:14px;}

.intro-card{text-align:center;padding:24px 18px;border-radius:22px;position:relative;overflow:hidden;}
.intro-card.bd{background:linear-gradient(160deg,rgba(255,46,94,.30),rgba(168,85,247,.22));border:2px solid rgba(255,46,94,.55);box-shadow:0 0 60px rgba(255,46,94,.35);}
.intro-card.runner{background:linear-gradient(160deg,rgba(34,255,136,.25),rgba(0,240,255,.18));border:2px solid rgba(34,255,136,.55);box-shadow:0 0 60px rgba(34,255,136,.30);}
.intro-role{font-size:28px;font-weight:900;margin:8px 0;line-height:1.2;}
.intro-hint{font-size:13px;font-weight:700;opacity:.9;margin-top:8px;line-height:1.6;}
@keyframes shush{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(-8deg)}}
.shush-emoji{font-size:56px;display:inline-block;animation:shush 1.5s ease-in-out infinite;}
@keyframes runAnim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.runner-emoji{font-size:56px;display:inline-block;animation:runAnim 1s ease-in-out infinite;}

/* === RACE === */
.race-wrap{position:relative;display:grid;grid-template-columns:90px 1fr 60px;gap:6px;height:62vh;min-height:420px;max-height:720px;margin-bottom:6px;}

.stations-col{display:flex;flex-direction:column-reverse;gap:6px;justify-content:flex-start;padding-bottom:14px;overflow-y:auto;max-height:100%;-webkit-overflow-scrolling:touch;}
.stations-col::-webkit-scrollbar{width:0;}
.station{position:relative;width:100%;min-height:66px;border-radius:12px;background:linear-gradient(135deg,#1f1530,#15082a);border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;font-size:10px;font-weight:800;color:#fff;transition:border-color .25s,box-shadow .25s,background .25s;overflow:hidden;touch-action:manipulation;}
.station .s-head{display:flex;align-items:center;justify-content:center;gap:4px;line-height:1;}
.station .s-ico{font-size:12px;opacity:.7;}
.station .s-num{font-size:20px;font-weight:900;color:#ffd166;line-height:1;}
.station .s-btns{display:flex;gap:2px;width:100%;}
.station .st-btn{flex:1;font-family:inherit;font-size:9px;font-weight:900;padding:5px 2px;border-radius:7px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;touch-action:manipulation;line-height:1.1;transition:all .12s;}
.station .st-btn:active{transform:scale(.94);}
.station .st-btn:disabled{opacity:.3;pointer-events:none;}
.station .st-btn.st-move.on{background:linear-gradient(135deg,#22ff88,#0ea5a4);border-color:#22ff88;color:#04141a;box-shadow:0 0 12px rgba(34,255,136,.6);}
.station .st-btn.st-block.on{background:linear-gradient(135deg,#ff2e5e,#a8002e);border-color:#ff2e5e;color:#fff;box-shadow:0 0 12px rgba(255,46,94,.6);}
.station.success{border-color:#22ff88;background:rgba(34,255,136,.18);box-shadow:0 0 22px rgba(34,255,136,.75);}
.station.fail{border-color:#ff2e5e;background:rgba(255,46,94,.18);box-shadow:0 0 22px rgba(255,46,94,.75);animation:stationShake .5s ease;}
@keyframes stationShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.station .st-victims{font-size:8px;color:#ff8fb5;text-align:center;line-height:1.1;margin-top:1px;}

.road-scene{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(to bottom,#1a0b2e 0%,#0a0616 60%,#05030d 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.7);}
.road-bg{position:absolute;inset:0;clip-path:polygon(0% 0%,100% 0%,72% 100%,28% 100%);background:linear-gradient(to bottom,#0d0d10 0%,#1c1c22 100%);}
.road-shoulder-l{position:absolute;inset:0;clip-path:polygon(0% 0%,28% 100%,0% 100%);background:linear-gradient(to bottom,#15082a,#2b1a3e);opacity:.8;}
.road-shoulder-r{position:absolute;inset:0;clip-path:polygon(100% 0%,100% 100%,72% 100%);background:linear-gradient(to bottom,#15082a,#2b1a3e);opacity:.8;}
.road-dashes{position:absolute;inset:0;clip-path:polygon(48% 0%,52% 0%,60% 100%,40% 100%);background:repeating-linear-gradient(to bottom,transparent 0 22px,rgba(255,255,255,.35) 22px 26px);}
.road-edge-l{position:absolute;inset:0;clip-path:polygon(28% 0%,28.5% 0%,1.5% 100%,0% 100%);background:linear-gradient(to bottom,rgba(0,240,255,.2),#00f0ff);opacity:.7;}
.road-edge-r{position:absolute;inset:0;clip-path:polygon(71.5% 0%,72% 0%,100% 100%,98.5% 100%);background:linear-gradient(to bottom,rgba(0,240,255,.2),#00f0ff);opacity:.7;}

.road-num{position:absolute;right:5%;transform:translateY(-50%);font-size:11px;font-weight:900;color:rgba(255,255,255,.65);background:rgba(22,10,40,.75);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:2px 6px;z-index:3;pointer-events:none;line-height:1.2;}
.road-num.major{color:#ffd166;font-size:12px;right:3%;background:rgba(255,209,102,.15);border-color:rgba(255,209,102,.5);}

.car-token{position:absolute;transform:translateX(-50%);transition:top 1.6s cubic-bezier(.34,1.3,.64,1),opacity .3s;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;width:56px;}
.car-token .car-body{position:relative;width:56px;height:40px;display:flex;align-items:center;justify-content:center;}
.car-token .car-body .car-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));}
.car-token .car-body .car-img img{width:100%;height:100%;object-fit:contain;}
.car-token .car-body .car-img .car-emoji{font-size:26px;line-height:1;}
.car-token .car-body .car-identity{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));background:rgba(0,0,0,.55);border-radius:50%;padding:1px;}
.car-token .car-body .car-identity img{max-width:100%;max-height:100%;object-fit:contain;}
.car-token .car-name{font-size:9px;font-weight:900;color:#fff;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:6px;margin-top:1px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(4px);text-align:center;}
.car-token.me .car-name{background:rgba(255,46,154,.75);}
.car-token.revealed .car-body{border:2px solid #ff2e5e;border-radius:8px;box-shadow:0 0 14px rgba(255,46,94,.85);animation:bdPulse 1.8s ease-in-out infinite;}
@keyframes bdPulse{0%,100%{box-shadow:0 0 12px rgba(255,46,94,.6)}50%{box-shadow:0 0 22px rgba(255,46,94,1)}}
.car-token.frozen .car-body{filter:brightness(1.4) hue-rotate(180deg);}

/* ============================================================
   UTILS
   ============================================================ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function toast(msg,type){const w=$('toast-wrap');const t=el('div','toast '+(type||''));t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t);},400);},3200);}
function showLoading(txt){$('loading-text').textContent=txt||'...';$('loading-overlay').classList.remove('hidden');}
function hideLoading(){$('loading-overlay').classList.add('hidden');}
function onEnter(inp,fn){inp.addEventListener('keydown',e=>{if(e.keyCode===13||e.key==='Enter'){e.preventDefault();fn();}});}
function safeBlur(n){setTimeout(()=>{try{if(n&&n.blur)n.blur();}catch(e){}},60);}
function showScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const t=$('screen-'+n);if(t)t.classList.add('active');try{window.scrollTo(0,0);}catch(e){}}
function nameWithCrown(room,uid,name){return room.hostId===uid?esc(name)+' <span class="crown">👑</span>':esc(name);}
function getVoteInterval(n){return n<=3?3:(n===4?4:5);}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function identityHtml(id,cls){
  if(!id)return '<span class="'+(cls||'')+'">❓</span>';
  if(id.startsWith('sticker_')){
    const sId=id.replace('sticker_','');
    const s=STICKERS.find(x=>x.id===sId);
    if(s&&s.url)return '<img class="'+(cls||'')+'" src="'+esc(s.url)+'" alt="">';
    return '<span class="'+(cls||'')+'">🎨</span>';
  }
  const a=AVATARS.find(x=>x.id===id);
  return '<span class="'+(cls||'')+'">'+(a?a.emoji:'❓')+'</span>';
}
function identityEmoji(id){const a=AVATARS.find(x=>x.id===id);return a?a.emoji:'❓';}
function carHtml(carId,cls){
  const c=CARS.find(x=>x.id===carId);
  if(c&&c.url)return '<img class="'+(cls||'')+'" src="'+esc(c.url)+'" alt="">';
  return '<span class="car-emoji '+(cls||'')+'">🚗</span>';
}

/* ============================================================
   SFX (Web Audio) — richer engine sounds
   ============================================================ */
const SFX={
  ctx:null,
  _init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  _tone(freq,dur,type,gain,delay){
    this._init();if(!this.ctx)return;
    const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(gain||0.1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+0.05);
  },
  _engine(dur,freqStart,freqEnd,gain){
    this._init();if(!this.ctx)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(freqStart,t);
    o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
    g.gain.setValueAtTime(gain,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+0.05);
  },
  click(){this._tone(600,0.04,'square',0.04);},
  stationSuccess(){this._tone(523,0.15,'sine',0.1);this._tone(659,0.15,'sine',0.1,0.1);this._tone(784,0.3,'sine',0.1,0.22);},
  stationFail(){this._tone(220,0.2,'sawtooth',0.12);this._tone(180,0.25,'sawtooth',0.12,0.15);this._tone(140,0.35,'square',0.1,0.35);},
  engineMove(){this._engine(1.6,60,180,0.10);this._engine(1.4,90,240,0.06);},
  engineReverse(){this._engine(1.6,180,50,0.10);this._engine(1.4,140,70,0.06);},
  freeze(){this._tone(880,0.2,'sine',0.08);this._tone(1320,0.25,'sine',0.07,0.08);},
  baiDonHit(){this._tone(80,0.6,'sawtooth',0.18);this._tone(160,0.35,'square',0.14,0.2);this._tone(120,0.6,'sawtooth',0.16,0.55);},
  win(){this._tone(523,0.18,'sine',0.12);this._tone(659,0.18,'sine',0.12,0.15);this._tone(784,0.18,'sine',0.12,0.3);this._tone(1047,0.5,'sine',0.12,0.45);},
  lose(){this._tone(523,0.2,'triangle',0.1);this._tone(440,0.25,'triangle',0.1,0.15);this._tone(330,0.5,'triangle',0.1,0.35);},
  unmask(){this._tone(200,0.4,'sawtooth',0.12);this._tone(400,0.3,'square',0.12,0.25);this._tone(800,0.4,'sawtooth',0.12,0.5);},
  vote(){this._tone(660,0.12,'sine',0.08);this._tone(880,0.15,'sine',0.08,0.1);}
};

/* ============================================================
   Asset Cache (IndexedDB)
   ============================================================ */
const AssetCache={
  db:null,
  async init(){
    return new Promise(res=>{
      if(!window.indexedDB)return res();
      try{
        const r=indexedDB.open('zabola_assets_v4',1);
        r.onupgradeneeded=()=>{try{r.result.createObjectStore('blobs');}catch(e){}};
        r.onsuccess=()=>{this.db=r.result;res();};
        r.onerror=()=>res();r.onblocked=()=>res();
      }catch(e){res();}
    });
  },
  async get(id){
    if(!this.db)return null;
    return new Promise(res=>{
      try{const tx=this.db.transaction('blobs','readonly');const rq=tx.objectStore('blobs').get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(e){res(null);}
    });
  },
  async set(id,blob){
    if(!this.db)return;
    return new Promise(res=>{
      try{const tx=this.db.transaction('blobs','readwrite');tx.objectStore('blobs').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}
    });
  }
};

/* ============================================================
   ComedyAudio + Queue
   ============================================================ */
const ComedyAudio={
  audios:{},
  async preload(){ /* Sounds are loaded on first use to reduce startup traffic and memory. */ },
  play(id,onEnd){
    let a=this.audios[id];
    if(!a){
      const sound=COMEDY_SOUNDS.find(s=>s.id===id);
      if(!sound){if(onEnd)onEnd();return;}
      try{a=new Audio(sound.url);a.preload='none';this.audios[id]=a;}catch(e){if(onEnd)onEnd();return;}
    }
    try{
      a.currentTime=0;let called=false;
      const done=()=>{if(called)return;called=true;if(onEnd)onEnd();};
      a.onended=done;a.onerror=done;
      const p=a.play();
      if(p&&p.catch)p.catch(()=>setTimeout(done,250));
      setTimeout(done,15000);
    }catch(e){if(onEnd)onEnd();}
  }
};

const ComedyQueue={
  queue:[],playing:false,currentItem:null,onQueueChange:null,seenKeys:new Set(),
  enqueue(item){
    if(!item||!item.soundId)return;
    this.queue.push(item);
    this.queue.sort((a,b)=>(a.ts||0)-(b.ts||0));
    this.process();
    if(this.onQueueChange)this.onQueueChange();
  },
  process(){
    if(this.playing||this.queue.length===0)return;
    const next=this.queue.shift();
    this.playing=true;this.currentItem=next;
    if(this.onQueueChange)this.onQueueChange();
    ComedyAudio.play(next.soundId,()=>{
      this.playing=false;this.currentItem=null;
      if(this.onQueueChange)this.onQueueChange();
      this.process();
    });
  },
  waitForEnd(){
    return new Promise(res=>{
      if(!this.playing)return res();
      const t=setInterval(()=>{if(!this.playing){clearInterval(t);res();}},100);
      setTimeout(()=>{clearInterval(t);res();},12000);
    });
  },
  clearPending(){this.queue=[];if(this.onQueueChange)this.onQueueChange();},
  reset(){this.clearPending();this.currentItem=null;if(this.onQueueChange)this.onQueueChange();},
  resetSeen(){this.seenKeys.clear();}
};

const App={
  uid:null,pin:null,name:'',
  carId:'',identityId:'',identityType:'avatar',
  isHost:false,flowMode:'create',hostMode:'play',
  roomRef:null,room:null,connectedRef:null,connectedCb:null,
  sig:'',_comedyCooldownUntil:0,_micOn:false,_intervals:[]
};
let db=null;

function initFirebase(){
  return new Promise((res,rej)=>{
    let done=false;
    const t=setTimeout(()=>{if(!done){done=true;rej(new Error('FB_TIMEOUT'));}},7000);
    try{
      firebase.initializeApp(firebaseConfig);
      db=firebase.database();
      db.ref('.info/connected').once('value').then(()=>{
        if(done)return;done=true;clearTimeout(t);res();
      }).catch(err=>{if(done)return;done=true;clearTimeout(t);rej(err);});
    }catch(e){if(done)return;done=true;clearTimeout(t);rej(e);}
  });
}

/* ============================================================
   CORE
   ============================================================ */
const Core={
  sweepOldRooms(){
    try{
      db.ref('rooms').orderByChild('lastActivity').endAt(Date.now()-ROOM_TTL_MS).once('value').then(s=>{
        const u={};let any=false;
        s.forEach(c=>{u[c.key]=null;any=true;});
        if(any)db.ref('rooms').update(u).catch(()=>{});
      }).catch(()=>{});
    }catch(e){}
  },
  async createRoom(pin,name,carId,identityId,identityType,hostMode){
    const s=await db.ref('rooms/'+pin).once('value');
    if(s.exists())throw new Error('PIN_TAKEN');
    const uid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    const now=Date.now();
    const room={
      pin,hostId:uid,hostMode:hostMode||'play',
      createdAt:now,lastActivity:now,status:'lobby',players:{},
      game:BaiDonGame.emptyState()
    };
    room.players[uid]={
      name,carId,identityId,identityType,
      cumulative:0,score:0,pos:0,
      isHost:true,online:true,joinedAt:now,lastSeen:now
    };
    await db.ref('rooms/'+pin).set(room);
    localStorage.setItem('zab_uid_'+pin,uid);
    return uid;
  },
  async joinRoom(pin,name,carId,identityId,identityType){
    const s=await db.ref('rooms/'+pin).once('value');
    const room=s.val();
    if(!room)throw new Error('NO_ROOM');
    const players=room.players||{};
    let uid=null;
    const saved=localStorage.getItem('zab_uid_'+pin);
    if(saved&&players[saved])uid=saved;
    if(!uid){
      const keys=Object.keys(players);
      for(let i=0;i<keys.length;i++){const p=players[keys[i]];if(p&&p.name===name&&!p.online){uid=keys[i];break;}}
    }
    if(!uid){
      if(room.kicked&&room.kicked[name])throw new Error('KICKED');
      const keys=Object.keys(players);
      if(keys.length>=MAX_PLAYERS)throw new Error('FULL');
      for(let i=0;i<keys.length;i++){if(players[keys[i]]&&players[keys[i]].name===name)throw new Error('NAME_TAKEN');}
      for(let i=0;i<keys.length;i++){if(players[keys[i]]&&players[keys[i]].carId===carId)throw new Error('CAR_TAKEN');}
      for(let i=0;i<keys.length;i++){if(players[keys[i]]&&players[keys[i]].identityId===identityId)throw new Error('IDENTITY_TAKEN');}
      if(room.status!=='lobby')throw new Error('STARTED');
      uid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
      const now=Date.now();
      await db.ref('rooms/'+pin+'/players/'+uid).set({
        name,carId,identityId,identityType,
        cumulative:0,score:0,pos:0,
        isHost:false,online:true,joinedAt:now,lastSeen:now
      });
      await db.ref('rooms/'+pin).update({lastActivity:now});
      localStorage.setItem('zab_uid_'+pin,uid);
      return uid;
    }
    await db.ref('rooms/'+pin+'/players/'+uid).update({online:true,lastSeen:Date.now()});
    await db.ref('rooms/'+pin).update({lastActivity:Date.now()});
    localStorage.setItem('zab_uid_'+pin,uid);
    return uid;
  },
  attach(pin,uid){
    App.pin=pin;App.uid=uid;
    App.roomRef=db.ref('rooms/'+pin);
    const me=App.roomRef.child('players/'+uid);
    me.onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP,micOn:false,speaking:false});
    me.update({online:true,lastSeen:Date.now()}).catch(()=>{});
    App.connectedRef=db.ref('.info/connected');
    App.connectedCb=App.connectedRef.on('value',s=>{
      if(s.val()===true&&App.uid&&App.roomRef){
        App.roomRef.child('players/'+App.uid).update({online:true,lastSeen:Date.now()}).catch(()=>{});
      }
    });
    App.roomRef.on('value',s=>{
      const room=s.val();
      if(!room){Core.leaveToHome('تم إغلاق الزعبل 🚪');return;}
      if(!room.players||!room.players[App.uid]){Core.leaveToHome('تم طردك 🚪');return;}
      App.room=room;
      App.isHost=(room.hostId===App.uid);
      Voice.sync(room).catch(err=>console.warn('Voice sync:',err));
      render();
    });
    setupComedyListener(pin);
    Voice.attach().catch(err=>console.warn('Voice attach:',err));
    App._intervals.push(setInterval(()=>{if(App.roomRef&&App.uid)App.roomRef.child('players/'+App.uid).update({lastSeen:Date.now()}).catch(()=>{});},30000));
    App._intervals.push(setInterval(()=>{if(App.room&&App.room.players)Core.checkHostMigration();},20000));
  },
  async checkHostMigration(){
    if(!App.room||!App.pin)return;
    const room=App.room;
    const host=room.players&&room.players[room.hostId];
    if(!host)return;
    const lastSeen=host.lastSeen||host.joinedAt||0;
    if(Date.now()-lastSeen<HOST_TIMEOUT_MS)return;
    const cands=Object.keys(room.players).filter(u=>u!==room.hostId&&room.players[u].online).map(u=>({uid:u,joinedAt:room.players[u].joinedAt||0})).sort((a,b)=>a.joinedAt-b.joinedAt);
    if(cands.length===0)return;
    const oldHost=room.hostId,newHost=cands[0].uid;
    try{
      await db.ref('rooms/'+App.pin).transaction(r=>{
        if(!r)return r;
        if(r.hostId!==oldHost)return;
        r.hostId=newHost;r.lastActivity=Date.now();return r;
      });
      if(App.uid===newHost)toast('انتقلت صلاحية الهوست إليك 👑','ok');
    }catch(e){}
  },
  detach(){
    try{Voice.detach();}catch(e){}
    (App._intervals||[]).forEach(t=>clearInterval(t));App._intervals=[];
    if(BaiDonGame._autoStartTimer){clearTimeout(BaiDonGame._autoStartTimer);BaiDonGame._autoStartTimer=null;}
    if(BaiDonGame._animSafetyTimer){clearTimeout(BaiDonGame._animSafetyTimer);BaiDonGame._animSafetyTimer=null;}
    try{if(App.roomRef)App.roomRef.off();}catch(e){}
    try{if(App.connectedRef&&App.connectedCb)App.connectedRef.off('value',App.connectedCb);}catch(e){}
    try{if(App.roomRef)App.roomRef.child('game/comedySounds').off();}catch(e){}
    App.roomRef=null;App.room=null;App.uid=null;App.pin=null;
    App.isHost=false;App.sig='';App._micOn=false;
    ComedyQueue.reset();ComedyQueue.resetSeen();
    hideLoading();
  },
  leaveToHome(msg){Core.detach();showScreen('home');if(msg)toast(msg,'err');},
  async leave(){
    const room=App.room,pin=App.pin,uid=App.uid;
    if(!room||!pin||!uid){Core.leaveToHome();return;}
    try{
      if(room.hostId===uid){
        const others=Object.keys(room.players).filter(k=>k!==uid).map(k=>({id:k,joinedAt:room.players[k].joinedAt||0})).sort((a,b)=>a.joinedAt-b.joinedAt);
        if(others.length===0){await db.ref('rooms/'+pin).remove();}
        else{
          const u={};u['players/'+uid]=null;u['hostId']=others[0].id;u['lastActivity']=Date.now();
          await db.ref('rooms/'+pin).update(u);
        }
      }else{
        await db.ref('rooms/'+pin+'/players/'+uid).remove();
        await db.ref('rooms/'+pin).update({lastActivity:Date.now()});
      }
    }catch(e){}
    Core.leaveToHome();
  },
  async kick(pid){
    if(!App.isHost||!App.room)return;
    const t=App.room.players[pid];
    if(!t)return;
    if(pid===App.uid){toast('مش ممكن تطرد نفسك 😅','err');return;}
    try{
      const u={};u['players/'+pid]=null;u['kicked/'+t.name]=true;u['lastActivity']=Date.now();
      await App.roomRef.update(u);
      toast('تم طرد '+t.name,'ok');
    }catch(e){toast('مشكلة','err');}
  }
};

function setGame(fields){
  if(!App.roomRef)return Promise.resolve();
  const p={lastActivity:Date.now()};
  Object.keys(fields).forEach(k=>{p['game/'+k]=fields[k];});
  return App.roomRef.update(p);
}
function getJoinedPlayers(room){
  return Object.keys(room.players||{}).map(k=>Object.assign({id:k},room.players[k])).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
}

/* ============================================================
   VOICE CHAT (WebRTC star topology through the room host)
   Firebase Realtime Database is used only for SDP/ICE signaling.
   ============================================================ */
const Voice={
  sessionId:null,
  peers:new Map(),
  inboxRef:null,
  inboxChannels:new Map(),
  localStream:null,
  audioContext:null,
  mixDestination:null,
  mixTrack:null,
  localMixSource:null,
  remoteMixSources:new Map(),
  meterAnalyser:null,
  meterSource:null,
  meterTimer:null,
  lastSpeaking:false,
  _syncing:false,
  _errorShown:false,
  _audioEl:null,
  _iceConfig:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'}
  ]},
  _newId(){return 'v'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);},
  async attach(){
    if(!App.roomRef||!App.uid)return;
    this.detach();
    this.sessionId=this._newId();
    this._audioEl=$('voice-audio');
    this.inboxRef=App.roomRef.child('voiceSignals/'+App.uid);
    this.inboxRef.on('child_added',senderSnap=>{
      const from=senderSnap.key;
      if(!from||from===App.uid)return;
      const channel=senderSnap.ref;
      const cb=channel.on('child_added',msgSnap=>{
        this._handleSignal(from,msgSnap.val()).catch(err=>{console.warn('Voice signal:',err);if(!this._errorShown){this._errorShown=true;toast('تعذر إكمال اتصال الصوت؛ تحقق من صلاحيات Firebase والشبكة','err');}});
      });
      this.inboxChannels.set(from,{ref:channel,cb});
    });
    try{await App.roomRef.child('players/'+App.uid).update({voiceSession:this.sessionId,micOn:false,speaking:false});}catch(e){console.warn('Voice state write:',e);}
  },
  async sync(room){
    if(!room||!App.uid||!this.sessionId||this._syncing)return;
    if(App.isHost){
      for(const [id,entry] of this.peers){
        if(entry.role!=='host'||!room.players||!room.players[id]||room.players[id].online===false)this._closePeer(id);
      }
      if(App._micOn&&this.localStream&&!this.localMixSource){
        try{const ctx=await this._ensureAudioContext();this.localMixSource=ctx.createMediaStreamSource(this.localStream);this.localMixSource.connect(this.mixDestination);}catch(e){console.warn('Host mic mix:',e);}
      }
      return;
    }
    const hostId=room.hostId;
    if(!hostId||hostId===App.uid)return;
    for(const id of Array.from(this.peers.keys()))if(id!==hostId)this._closePeer(id);
    if(this.localMixSource){try{this.localMixSource.disconnect();}catch(e){}this.localMixSource=null;}
    const current=this.peers.get(hostId);
    if(current&&current.sid===this.sessionId)return;
    this._syncing=true;
    try{await this._createClientOffer(hostId);}catch(e){console.warn('Voice connection:',e);if(!this._errorShown){this._errorShown=true;toast('تعذر إنشاء اتصال الصوت. راجع صلاحيات Firebase لمسار voiceSignals','err');}}
    finally{this._syncing=false;}
  },
  async _ensureAudioContext(){
    if(!this.audioContext){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)throw new Error('Web Audio غير مدعوم في المتصفح');
      this.audioContext=new Ctx();
    }
    if(!this.mixDestination){
      this.mixDestination=this.audioContext.createMediaStreamDestination();
      this.mixTrack=this.mixDestination.stream.getAudioTracks()[0]||null;
    }
    if(this.audioContext.state==='suspended'){try{await this.audioContext.resume();}catch(e){/* Browser may require a user gesture; unlock on the next tap. */}}
    return this.audioContext;
  },
  async unlockAudio(){
    try{if(App.isHost&&!this.audioContext)await this._ensureAudioContext();else if(this.audioContext&&this.audioContext.state==='suspended')await this.audioContext.resume();}catch(e){}
    try{if(this._audioEl&&this._audioEl.srcObject){const p=this._audioEl.play();if(p&&p.catch)p.catch(()=>{});}}catch(e){}
  },
  async _createClientOffer(hostId){
    if(!window.RTCPeerConnection)throw new Error('WebRTC غير مدعوم في المتصفح');
    const old=this.peers.get(hostId);if(old)this._closePeer(hostId);
    const pc=new RTCPeerConnection(this._iceConfig);
    const transceiver=pc.addTransceiver('audio',{direction:'sendrecv'});
    const entry={pc,sid:this.sessionId,role:'client',transceiver,pendingIce:[],outgoingIce:[],signalReady:false,remoteReady:false};
    this.peers.set(hostId,entry);
    pc.onicecandidate=e=>{
      if(!e.candidate)return;
      const msg={type:'candidate',sid:entry.sid,candidate:e.candidate.toJSON(),ts:Date.now()};
      if(entry.signalReady)this._send(hostId,msg).catch(err=>console.warn(err));else entry.outgoingIce.push(msg);
    };
    pc.ontrack=e=>{
      const stream=(e.streams&&e.streams[0])||new MediaStream([e.track]);
      this._playRemote(stream);
    };
    pc.onconnectionstatechange=()=>{
      if(['failed','closed'].includes(pc.connectionState))console.warn('Voice peer state:',pc.connectionState);
    };
    if(this.localStream){const track=this.localStream.getAudioTracks()[0];if(track)await transceiver.sender.replaceTrack(track);}
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    await this._send(hostId,{type:'offer',sid:entry.sid,sdp:pc.localDescription.toJSON(),ts:Date.now()});
    entry.signalReady=true;
    for(const candidate of entry.outgoingIce.splice(0))await this._send(hostId,candidate);
  },
  async _handleSignal(from,data){
    if(!data||!data.type||!data.sid)return;
    if(data.ts&&Date.now()-data.ts>120000)return;
    if(!App.roomRef||!App.uid)return;
    let currentSid=null;
    try{const snap=await App.roomRef.child('players/'+from+'/voiceSession').once('value');currentSid=snap.val();}catch(e){return;}
    if(App.isHost){if(currentSid&&currentSid!==data.sid)return;}
    else if(data.sid!==this.sessionId)return;
    if(data.type==='offer'){
      if(!App.isHost)return;
      let entry=this.peers.get(from);
      if(entry&&entry.sid!==data.sid){this._closePeer(from);entry=null;}
      if(!entry){
        if(!window.RTCPeerConnection)throw new Error('WebRTC غير مدعوم في المتصفح');
        const pc=new RTCPeerConnection(this._iceConfig);
        entry={pc,sid:data.sid,role:'host',transceiver:null,pendingIce:[],outgoingIce:[],signalReady:false,remoteReady:false};
        this.peers.set(from,entry);
        pc.onicecandidate=e=>{
          if(!e.candidate)return;
          const msg={type:'candidate',sid:entry.sid,candidate:e.candidate.toJSON(),ts:Date.now()};
          if(entry.signalReady)this._send(from,msg).catch(err=>console.warn(err));else entry.outgoingIce.push(msg);
        };
        pc.ontrack=e=>this._addRemoteToMix(from,e.track);
        pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))console.warn('Voice host peer state:',pc.connectionState);};
      }
      const pc=entry.pc;
      if(!entry.remoteReady){
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        entry.remoteReady=true;
        entry.transceiver=pc.getTransceivers().find(t=>t.receiver&&t.receiver.track&&t.receiver.track.kind==='audio')||null;
        if(entry.transceiver){entry.transceiver.direction='sendrecv';await this._ensureAudioContext();if(this.mixTrack)await entry.transceiver.sender.replaceTrack(this.mixTrack);}
        await this._flushIce(entry);
        const answer=await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await this._send(from,{type:'answer',sid:entry.sid,sdp:pc.localDescription.toJSON(),ts:Date.now()});
        entry.signalReady=true;
        for(const candidate of entry.outgoingIce.splice(0))await this._send(from,candidate);
      }
      return;
    }
    const entry=this.peers.get(from);
    if(!entry||entry.sid!==data.sid)return;
    if(data.type==='answer'&&entry.role==='client'){
      if(!entry.remoteReady){await entry.pc.setRemoteDescription(new RTCSessionDescription(data.sdp));entry.remoteReady=true;await this._flushIce(entry);}
    }else if(data.type==='candidate'&&data.candidate){
      if(entry.remoteReady){try{await entry.pc.addIceCandidate(new RTCIceCandidate(data.candidate));}catch(e){console.warn('ICE candidate:',e);}}
      else entry.pendingIce.push(data.candidate);
    }
  },
  async _flushIce(entry){
    for(const c of entry.pendingIce.splice(0)){try{await entry.pc.addIceCandidate(new RTCIceCandidate(c));}catch(e){console.warn('ICE flush:',e);}}
  },
  _send(to,data){
    if(!App.roomRef)return Promise.reject(new Error('الغرفة غير متصلة'));
    return App.roomRef.child('voiceSignals/'+to+'/'+App.uid).push(data);
  },
  async _addRemoteToMix(uid,track){
    try{
      const ctx=await this._ensureAudioContext();
      if(this.remoteMixSources.has(uid))return;
      const stream=new MediaStream([track]);
      const source=ctx.createMediaStreamSource(stream);
      source.connect(this.mixDestination);
      this.remoteMixSources.set(uid,source);
      if(this._audioEl){this._audioEl.srcObject=this.mixDestination.stream;const p=this._audioEl.play();if(p&&p.catch)p.catch(()=>{});}
      for(const entry of this.peers.values()){
        if(entry.role!=='host'||!entry.transceiver)continue;
        try{await entry.transceiver.sender.replaceTrack(this.mixTrack);}catch(e){console.warn(e);}
      }
    }catch(e){console.warn('Voice mix:',e);}
  },
  _playRemote(stream){
    if(!this._audioEl)return;
    this._audioEl.srcObject=stream;
    const p=this._audioEl.play();if(p&&p.catch)p.catch(()=>{});
  },
  async toggleMic(){
    if(!App.roomRef||!App.uid)return;
    if(!App._micOn){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('الميكروفون يحتاج HTTPS ومتصفح يدعمه','err');return;}
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
        this.localStream=stream;
        const track=stream.getAudioTracks()[0];if(!track)throw new Error('لم يتم العثور على مسار صوت');
        track.enabled=true;
        if(App.isHost){
          const ctx=await this._ensureAudioContext();
          if(this.localMixSource){try{this.localMixSource.disconnect();}catch(e){}}
          this.localMixSource=ctx.createMediaStreamSource(stream);
          this.localMixSource.connect(this.mixDestination);
          if(this._audioEl){this._audioEl.srcObject=this.mixDestination.stream;const p=this._audioEl.play();if(p&&p.catch)p.catch(()=>{});}
        }else{
          const hostId=App.room&&App.room.hostId;
          if(hostId){if(!this.peers.has(hostId))await this.sync(App.room);const entry=this.peers.get(hostId);if(entry&&entry.transceiver)await entry.transceiver.sender.replaceTrack(track);}
        }
        App._micOn=true;
        await App.roomRef.child('players/'+App.uid).update({micOn:true,speaking:false});
        this._startMeter(stream);
        this.unlockAudio();
        toast('🎙️ الميكروفون مفتوح','ok');
        renderTopBar();
      }catch(e){
        this.localStream=null;App._micOn=false;
        toast(e&&e.name==='NotAllowedError'?'اسمح للمتصفح باستخدام الميكروفون':'تعذر تشغيل الميكروفون: '+(e.message||'خطأ غير معروف'),'err');
        renderTopBar();
      }
    }else{
      this._stopMeter();
      if(this.localMixSource){try{this.localMixSource.disconnect();}catch(e){}this.localMixSource=null;}
      if(this.localStream){this.localStream.getTracks().forEach(t=>t.stop());this.localStream=null;}
      if(!App.isHost){
        const hostId=App.room&&App.room.hostId;const entry=hostId&&this.peers.get(hostId);
        if(entry&&entry.transceiver){try{await entry.transceiver.sender.replaceTrack(null);}catch(e){}}
      }
      App._micOn=false;
      await App.roomRef.child('players/'+App.uid).update({micOn:false,speaking:false}).catch(()=>{});
      toast('🎙️ الميكروفون مقفول','ok');
      renderTopBar();
    }
  },
  _startMeter(stream){
    this._stopMeter();
    try{
      const ctx=this.audioContext||new (window.AudioContext||window.webkitAudioContext)();
      this.audioContext=ctx;
      const source=ctx.createMediaStreamSource(stream);
      const analyser=ctx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.72;
      source.connect(analyser);
      this.meterSource=source;this.meterAnalyser=analyser;
      const data=new Uint8Array(analyser.fftSize);
      this.meterTimer=setInterval(()=>{
        if(!App.roomRef||!App._micOn||!this.meterAnalyser)return;
        analyser.getByteTimeDomainData(data);
        let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v;}
        const rms=Math.sqrt(sum/data.length);
        const speaking=rms>.035;
        if(speaking!==this.lastSpeaking){
          this.lastSpeaking=speaking;
          App.roomRef.child('players/'+App.uid+'/speaking').set(speaking).catch(()=>{});
          const card=document.querySelector('.rtb-player[data-uid="'+App.uid+'"]');
          if(card)card.classList.toggle('is-speaking',speaking);
        }
      },250);
    }catch(e){console.warn('Voice meter:',e);}
  },
  _stopMeter(){
    if(this.meterTimer){clearInterval(this.meterTimer);this.meterTimer=null;}
    if(this.meterSource){try{this.meterSource.disconnect();}catch(e){}this.meterSource=null;}
    this.meterAnalyser=null;this.lastSpeaking=false;
  },
  _closePeer(uid){
    const entry=this.peers.get(uid);if(!entry)return;
    try{entry.pc.onicecandidate=null;entry.pc.ontrack=null;entry.pc.close();}catch(e){}
    this.peers.delete(uid);
    const source=this.remoteMixSources.get(uid);if(source){try{source.disconnect();}catch(e){}this.remoteMixSources.delete(uid);}
  },
  detach(){
    this._stopMeter();
    if(this.inboxRef){try{this.inboxRef.off('child_added');}catch(e){}}
    for(const [from,item] of this.inboxChannels){try{item.ref.off('child_added',item.cb);}catch(e){}}
    this.inboxChannels.clear();this.inboxRef=null;
    for(const id of Array.from(this.peers.keys()))this._closePeer(id);
    if(this.localMixSource){try{this.localMixSource.disconnect();}catch(e){}this.localMixSource=null;}
    if(this.localStream){this.localStream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});this.localStream=null;}
    if(this.mixDestination){try{this.mixDestination.disconnect();}catch(e){}}
    this.mixDestination=null;this.mixTrack=null;this.remoteMixSources.clear();
    if(this.audioContext){try{this.audioContext.close();}catch(e){}this.audioContext=null;}
    if(this._audioEl){this._audioEl.srcObject=null;}
    this.sessionId=null;this._syncing=false;this.lastSpeaking=false;
  }
};

function setupComedyListener(pin){
  try{
    const r=db.ref('rooms/'+pin+'/game/comedySounds');
    r.on('child_added',s=>{
      const d=s.val();
      if(!d||!d.uid||!d.soundId||!d.ts)return;
      if(Date.now()-d.ts>15000)return;
      const key=d.uid+'_'+d.ts;
      if(ComedyQueue.seenKeys.has(key))return;
      ComedyQueue.seenKeys.add(key);
      ComedyQueue.enqueue({uid:d.uid,soundId:d.soundId,ts:d.ts});
    });
  }catch(e){}
}

ComedyQueue.onQueueChange=function(){

    const uid=ComedyQueue.currentItem.uid;
    const snd=COMEDY_SOUNDS.find(s=>s.id===ComedyQueue.currentItem.soundId);

      showSpeechBubble(dispName,snd.name,isMystery);
      highlightSpeaker(uid);

};

/* ============================================================
   BAI DONGAME
   ============================================================ */
const BaiDonGame={
  _carTokens:{},
  _animDisplayPos:{},
  _animKey:'',
  _animPhase:0,
  _animDone:false,
  _blockRenders:false,
  _overlayShown:{},
  _animSafetyTimer:null,
  _autoStartTimer:null,
  resolveBusy:false,
  restartBusy:false,
  voteResolveBusy:false,
  voteContinueBusy:false,

  getConfig(count){return{target:20,maxNum:3};},
  emptyState(){
    return{
      round:1,phase:'idle',timerEnd:0,
      target:20,maxNum:3,
      baiDonId:null,baiDonRevealed:false,
      actions:null,votes:null,lastResult:null,voteResult:null,
      finalMessage:'',winner:'',winnerName:'',
      introReady:null,comedySounds:null,comedyUsed:null,
      playerState:null,blockCount:1
    };
  },

  /* Choose BaiDon (random, avoid same as last round) */
  _pickBaiDon(room,prevBdId){
    const players=room.players||{};
    let cands=room.hostMode==='judge'?Object.keys(players).filter(id=>id!==room.hostId):Object.keys(players);
    if(cands.length>1&&prevBdId&&cands.includes(prevBdId)){
      const filtered=cands.filter(id=>id!==prevBdId);
      if(filtered.length>=1)cands=filtered;
    }
    return cands[Math.floor(Math.random()*cands.length)];
  },

  async hostStart(){
    if(!App.isHost||!App.room)return;
    const players=App.room.players||{};
    const ids=Object.keys(players);
    if(ids.length<2){toast('الحد الأدنى لاعبين','err');return;}
    const cfg=BaiDonGame.getConfig(ids.length);
    const prevBd=App.room.game&&App.room.game.baiDonId;
    const bdId=BaiDonGame._pickBaiDon(App.room,prevBd);
    const bdRev=ids.length<=2;

    BaiDonGame._carTokens={};BaiDonGame._animDisplayPos={};BaiDonGame._animKey='';
    BaiDonGame._animPhase=0;BaiDonGame._animDone=false;BaiDonGame._blockRenders=false;
    BaiDonGame._overlayShown={};

    const ps={};
    ids.forEach(id=>{ps[id]={pos:0,frozen:0,lastHitRound:0};});

    const u={
      status:'playing',lastActivity:Date.now(),
      'game/round':1,'game/phase':'intro','game/timerEnd':0,
      'game/target':cfg.target,'game/maxNum':cfg.maxNum,
      'game/baiDonId':bdId,'game/baiDonRevealed':bdRev,
      'game/actions':null,'game/votes':null,'game/lastResult':null,'game/voteResult':null,
      'game/finalMessage':'','game/winner':'','game/winnerName':'',
      'game/introReady':null,'game/comedySounds':null,'game/comedyUsed':null,
      'game/playerState':ps,'game/blockCount':1
    };
    ids.forEach(pid=>{
      u['players/'+pid+'/cumulative']=players[pid].cumulative||0;
      u['players/'+pid+'/score']=0;
      u['players/'+pid+'/pos']=0;
    });
    try{await App.roomRef.update(u);App.sig='';}catch(e){toast('مشكلة','err');}
  },

  async introContinue(){
    if(!App.room||!App.room.game||App.room.game.phase!=='intro')return;
    try{await setGame({['introReady/'+App.uid]:true});SFX.click();}
    catch(e){console.error('Intro readiness write failed:',e);toast('تعذر تسجيل استعدادك — تحقق من اتصال الغرفة','err');}
  },

  async hostStartAction(){
    if(!App.isHost||!App.room||!App.room.game||App.room.game.phase!=='intro')return;
    try{await setGame({phase:'action',timerEnd:Date.now()+BAIDON_TIMER*1000,actions:null});App.sig='';}catch(e){toast('مشكلة','err');}
  },

  async submitAction(moveStation,blockStation,disguise){
    if(!App.room||!App.room.game)return;
    const g=App.room.game;
    if(g.phase!=='action')return;
    const bdId=g.baiDonId;
    const amBd=(App.uid===bdId);
    const isRev=!!g.baiDonRevealed;
    const ps=g.playerState||{};
    const me=ps[App.uid];
    if(!me||me.frozen>0)return;
    const act={ts:Date.now()};
    if(amBd){
      if(disguise){
        if(!blockStation){toast('اختار محطة التمويه','err');return;}
        act.disguise=true;
        act.moveStation=blockStation;
        act.blockStation=blockStation;
      }else if(isRev){
        if(!blockStation){toast('اختار محطة القفل','err');return;}
        act.blockStation=blockStation;
      }else{
        if(!moveStation||!blockStation){toast('اختار كارت الطاقة ومحطة القفل','err');return;}
        if(moveStation===blockStation){toast('كارت الطاقة لازم يختلف عن القفل','err');return;}
        act.moveStation=moveStation;
        act.blockStation=blockStation;
      }
    }else{
      if(!moveStation){toast('اختار كارت الطاقة','err');return;}
      act.moveStation=moveStation;
    }
    try{await setGame({['actions/'+App.uid]:act});SFX.click();}catch(e){toast('مشكلة','err');}
  },

  async hostResolve(){
    if(!App.isHost||!App.room||!App.room.game)return;
    if(BaiDonGame.resolveBusy)return;
    BaiDonGame.resolveBusy=true;
    try{
      const room=App.room,g=room.game;
      if(g.phase!=='action')return;
      const actions=JSON.parse(JSON.stringify(g.actions||{}));
      const bdId=g.baiDonId;
      const bdRev=!!g.baiDonRevealed;
      const ps=JSON.parse(JSON.stringify(g.playerState||{}));
      const target=g.target||20;
      const round=g.round||1;

      /* Auto-select station 1 for players who didn't submit */
      Object.keys(ps).forEach(uid=>{
        if(room.hostMode==='judge'&&uid===room.hostId)return;
        if(ps[uid].frozen>0)return;
        const a=actions[uid];
        if(!a||(!a.moveStation&&!a.blockStation&&!a.disguise)){
          if(uid===bdId){
            actions[uid]=bdRev?{blockStation:1,ts:Date.now(),_auto:true}:{moveStation:1,blockStation:Math.min(2,g.maxNum||3),ts:Date.now(),_auto:true};
          }else actions[uid]={moveStation:1,ts:Date.now(),_auto:true};
        }
      });

      const oldPositions={};
      Object.keys(ps).forEach(uid=>{oldPositions[uid]=ps[uid].pos;});

      const events=[];
      const hitThisRound={};
      const blockedStations=[];
      const bdAct=actions[bdId];
      const wantDisguise=!!(bdAct&&bdAct.disguise);

      let effectiveBlock=null,botUsed=false;
      if(!bdAct||(!bdAct.blockStation&&!wantDisguise)){
        const bdOnline=room.players[bdId]&&room.players[bdId].online;
        if(!bdOnline){effectiveBlock=Math.floor(Math.random()*g.maxNum)+1;botUsed=true;}
      }else{effectiveBlock=bdAct.blockStation;}
      if(effectiveBlock)blockedStations.push(effectiveBlock);
      if(bdRev&&g.blockCount===2&&bdAct){
        for(let i=1;i<=g.maxNum;i++){
          if(!blockedStations.includes(i)){blockedStations.push(i);break;}
        }
      }

      /* Freeze decrement */
      Object.keys(ps).forEach(uid=>{
        const p=ps[uid];
        if(!p)return;
        if(p.frozen>0){p._wasFrozen=true;p.frozen-=1;if(p.frozen>0)events.push({type:'stillFrozen',uid});}
      });

      /* Hits and moves */
      Object.keys(actions).forEach(uid=>{
        if(room.hostMode==='judge'&&uid===room.hostId)return;
        const p=ps[uid];
        if(!p||p._wasFrozen)return;
        const a=actions[uid];
        if(!a)return;
        const mySt=a.moveStation;
        const isHit=mySt&&blockedStations.includes(mySt);
        if(isHit){
          hitThisRound[uid]=true;
          p.pos=Math.max(0,p.pos-1);
          const isBdDisguise=wantDisguise&&uid===bdId;
          events.push({type:'hit',uid,station:mySt,disguise:isBdDisguise});
          const gap=p.lastHitRound?(round-p.lastHitRound):999;
          if(gap<=3){p.frozen=(p.frozen||0)+1;events.push({type:'freeze',uid});p.lastHitRound=0;}
          else{p.lastHitRound=round;}
        }else if(mySt){
          p.pos=Math.min(target,p.pos+mySt);
          events.push({type:'move',uid,station:mySt,from:p.pos-mySt,to:p.pos});
        }
      });

      /* Revealed BaiDon auto +1 */
      const bdP=ps[bdId];
      if(bdRev&&bdP&&!bdP._wasFrozen){
        bdP.pos=Math.min(target,bdP.pos+1);
        events.push({type:'autoMove',uid:bdId,to:bdP.pos});
      }

      Object.keys(ps).forEach(uid=>{if(ps[uid])delete ps[uid]._wasFrozen;});

      let winner=null,winnerName='',finalMessage='';
      const winners=Object.keys(ps).filter(uid=>ps[uid].pos>=target);
      if(winners.length>0){
        if(winners.includes(bdId)){
          winner='baidon';winnerName=room.players[bdId]?room.players[bdId].name:'';
          finalMessage='🎭 البيدون '+winnerName+' وصل النهاية وفاز!';
        }else{
          winner='runner';winnerName=room.players[winners[0]]?room.players[winners[0]].name:'';
          finalMessage='🏆 الزعبول السالك '+winnerName+' وصل النهاية وفاز!';
        }
      }

      const newPositions={};
      Object.keys(ps).forEach(uid=>{newPositions[uid]=ps[uid].pos;});

      const u={
        lastActivity:Date.now(),
        'game/actions':null,
        'game/comedySounds':null,
        'game/lastResult':{events,round,blockedStations,botUsed,oldPositions,newPositions,animStartTs:Date.now()}
      };
      Object.keys(ps).forEach(uid=>{
        u['game/playerState/'+uid+'/pos']=ps[uid].pos;
        u['game/playerState/'+uid+'/frozen']=ps[uid].frozen;
        u['game/playerState/'+uid+'/lastHitRound']=ps[uid].lastHitRound;
        u['players/'+uid+'/score']=ps[uid].pos;
        u['players/'+uid+'/pos']=ps[uid].pos;
      });
      if(winner){
        u['game/phase']='final';
        u['game/winner']=winner;
        u['game/winnerName']=winnerName;
        u['game/finalMessage']=finalMessage;
        if(winner==='baidon')u['players/'+bdId+'/cumulative']=(room.players[bdId].cumulative||0)+100;
        else u['players/'+winners[0]+'/cumulative']=(room.players[winners[0]].cumulative||0)+100;
      }else{
        u['game/phase']='racing';
      }
      await App.roomRef.update(u);
      App.sig='';
    }catch(e){
      console.error(e);toast('مشكلة','err');
    }finally{
      setTimeout(()=>{BaiDonGame.resolveBusy=false;},500);
    }
  },

  async hostNextRound(){
    if(!App.isHost||!App.room)return;
    const g=App.room.game;
    if(!g||g.phase!=='racing')return;
    BaiDonGame._blockRenders=false;
    await Promise.race([ComedyQueue.waitForEnd(),delay(3000)]);
    ComedyQueue.clearPending();
    const round=g.round||1;
    const nextRound=round+1;
    const playerCount=Object.keys(App.room.players||{}).length;
    const voteInterval=getVoteInterval(playerCount);
    const needVote=!g.baiDonRevealed&&playerCount>=3&&round%voteInterval===0&&round>0;
    if(needVote){
      try{
        await setGame({phase:'vote',votes:null,voteResult:null,round:nextRound,voteEndAt:Date.now()+18000,voteResultEndAt:0,comedySounds:null,blockCount:1});
        App.sig='';toast('🗳️ وقت التصويت!','ok');
      }catch(e){toast('مشكلة','err');}
      return;
    }
    try{
      await setGame({phase:'action',round:nextRound,timerEnd:Date.now()+BAIDON_TIMER*1000,actions:null,lastResult:null,comedySounds:null,blockCount:1});
      App.sig='';
    }catch(e){toast('مشكلة','err');}
  },

  async castVote(targetId){
    if(!App.room||!App.room.game||App.room.game.phase!=='vote')return;
    if(targetId===App.uid){toast('متقدرش تصوت لنفسك','err');return;}
    try{await setGame({['votes/'+App.uid]:targetId});SFX.vote();}catch(e){}
  },

  async hostResolveVote(){
    if(!App.isHost||!App.room||BaiDonGame.voteResolveBusy)return;
    const g=App.room.game;
    if(!g||g.phase!=='vote')return;
    BaiDonGame.voteResolveBusy=true;
    if(!g||g.phase!=='vote')return;
    const votes=g.votes||{};
    const counts={};
    Object.keys(votes).forEach(v=>{const t=votes[v];if(t)counts[t]=(counts[t]||0)+1;});
    let topId=null,topCount=0,tie=false;
    Object.keys(counts).forEach(id=>{
      if(counts[id]>topCount){topCount=counts[id];topId=id;tie=false;}
      else if(counts[id]===topCount&&topCount>0){tie=true;}
    });
    if(!topId||tie){
      try{await setGame({phase:'voteResult',voteResult:{tie:true,topId:null,counts,votes},voteResultEndAt:Date.now()+4500});App.sig='';toast('تعادل');}catch(e){}
      BaiDonGame.voteResolveBusy=false;
      return;
    }
    const bdId=g.baiDonId;
    const ps=JSON.parse(JSON.stringify(g.playerState||{}));
    const u={lastActivity:Date.now(),'game/voteResult':{tie:false,topId,counts,wasBaiDon:topId===bdId,votes},'game/voteResultEndAt':Date.now()+4500};
    if(topId===bdId){
      u['game/baiDonRevealed']=true;
      u['game/blockCount']=1;
      if(ps[bdId]){
        ps[bdId].pos=0;
        u['game/playerState/'+bdId+'/pos']=0;
        u['players/'+bdId+'/pos']=0;
        u['players/'+bdId+'/score']=0;
      }
      u['game/phase']='voteResult';
      SFX.unmask();
      toast('🎭 تم كشف البيدون!','ok');
    }else{
      u['game/blockCount']=2;
      u['game/phase']='voteResult';
      toast('❌ تصويت خاطئ! البيدون هيعطل محطتين الجاية','err');
    }
    try{await App.roomRef.update(u);App.sig='';}catch(e){}
    BaiDonGame.voteResolveBusy=false;
  },

  async hostAfterVote(){
    if(!App.isHost||!App.room||BaiDonGame.voteContinueBusy)return;
    const g=App.room.game;
    if(!g||g.phase!=='voteResult')return;
    BaiDonGame.voteContinueBusy=true;
    await Promise.race([ComedyQueue.waitForEnd(),delay(3000)]);
    ComedyQueue.clearPending();
    try{
      await setGame({phase:'action',timerEnd:Date.now()+BAIDON_TIMER*1000,actions:null,votes:null,voteResult:null,lastResult:null,comedySounds:null});
      App.sig='';
    }catch(e){toast('مشكلة','err');}
    finally{BaiDonGame.voteContinueBusy=false;}
  },

  async hostPlayAgain(){
    if(!App.isHost)return;
    try{await setGame({phase:'playAgain',ready:null});App.sig='';}catch(e){}
  },
  async setReady(){
    if(!App.room||!App.room.game)return;
    try{await setGame({['ready/'+App.uid]:true});SFX.click();}catch(e){}
  },
  async hostRestart(){
    if(!App.isHost||!App.room)return;
    if(BaiDonGame.restartBusy)return;
    BaiDonGame.restartBusy=true;
    try{
      const room=App.room;
      const ids=Object.keys(room.players||{});
      const cfg=BaiDonGame.getConfig(ids.length);
      const prevBd=room.game&&room.game.baiDonId;
      const bdId=BaiDonGame._pickBaiDon(room,prevBd);
      const bdRev=ids.length<=2;
      BaiDonGame._carTokens={};BaiDonGame._animDisplayPos={};BaiDonGame._animKey='';
      BaiDonGame._animPhase=0;BaiDonGame._animDone=false;BaiDonGame._blockRenders=false;
      BaiDonGame._overlayShown={};
      const ps={};ids.forEach(id=>{ps[id]={pos:0,frozen:0,lastHitRound:0};});
      const u={
        lastActivity:Date.now(),
        'game/round':1,'game/phase':'intro','game/timerEnd':0,
        'game/target':cfg.target,'game/maxNum':cfg.maxNum,
        'game/baiDonId':bdId,'game/baiDonRevealed':bdRev,
        'game/actions':null,'game/votes':null,'game/lastResult':null,'game/voteResult':null,
        'game/finalMessage':'','game/winner':'','game/winnerName':'',
        'game/introReady':null,'game/comedySounds':null,'game/comedyUsed':null,
        'game/playerState':ps,'game/ready':null,'game/blockCount':1
      };
      ids.forEach(pid=>{
        u['players/'+pid+'/cumulative']=(room.players[pid].cumulative||0)+(room.players[pid].pos||0);
        u['players/'+pid+'/score']=0;
        u['players/'+pid+'/pos']=0;
      });
      await App.roomRef.update(u);
      App.sig='';
      ComedyQueue.reset();
    }catch(e){toast('مشكلة','err');}
    finally{setTimeout(()=>{BaiDonGame.restartBusy=false;},1200);}
  },

  maybeAutoStartIntro(room){
    if(!App.isHost||!room||!room.game||room.game.phase!=='intro'){
      if(this._autoStartTimer){clearTimeout(this._autoStartTimer);this._autoStartTimer=null;}
      return;
    }
    const players=Object.entries(room.players||{}).filter(([id,p])=>p&&p.online!==false);
    const ready=room.game.introReady||{};
    const allReady=players.length>=MIN_PLAYERS&&players.every(([id])=>!!ready[id]);
    if(allReady&&!this._autoStartTimer){
      this._autoStartTimer=setTimeout(()=>{
        this._autoStartTimer=null;
        const latest=App.room;
        const active=latest&&Object.entries(latest.players||{}).filter(([id,p])=>p&&p.online!==false);
        if(latest&&latest.game&&latest.game.phase==='intro'&&active.length>=MIN_PLAYERS&&active.every(([id])=>!!((latest.game.introReady||{})[id])))this.hostStartAction();
      },900);
    }else if(!allReady&&this._autoStartTimer){clearTimeout(this._autoStartTimer);this._autoStartTimer=null;}
  },

  _trackPosition(index,count,pos,target){
    const t=Math.max(0,Math.min(1,(Number(pos)||0)/Math.max(1,target||20)));
    const leftEdge=17.2-(9.2*t);
    const rightEdge=79.8+(13.4*t);
    const left=leftEdge+((index+.5)/Math.max(1,count))*(rightEdge-leftEdge);
    const top=15.4+t*73.2;
    return {left,top};
  },

  /* Build UI */
  build(room,g,phase,round){
    const wrap=el('div','phase');
    const isHost=App.isHost;
    const amBd=(g.baiDonId===App.uid);
    const isRev=!!g.baiDonRevealed;
    const ps=g.playerState||{};
    const me=ps[App.uid];
    const frozen=!!(me&&me.frozen>0);
    switch(phase){
      case 'intro':return BaiDonGame._uiIntro(wrap,room,g,isHost,amBd);
      case 'action':BaiDonGame._uiRace(wrap,room,g,round,isHost,amBd,isRev,frozen,false);break;
      case 'racing':BaiDonGame._uiRace(wrap,room,g,round,isHost,amBd,isRev,frozen,true);break;
      case 'vote':BaiDonGame._uiVoteModal(wrap,room,g,isHost);break;
      case 'voteResult':BaiDonGame._uiVoteResult(wrap,room,g,isHost);break;
      case 'final':BaiDonGame._uiFinal(wrap,room,g,isHost);break;
      case 'playAgain':BaiDonGame._uiPlayAgain(wrap,room,g,isHost);break;
      default:wrap.appendChild(el('div','waiting','…'));
    }
    return wrap;
  },

      card.innerHTML='<div class="shush-emoji">🤫</div><div class="intro-role">أنت البيدون!</div><div class="intro-hint">متكشفش نفسك. اختار كارت طاقة (تتحرك) ومحطة قفل (توقع زعبول).<br>أو استخدم "تمويه" عشان تبان مصاب.<br><br><b>هدفك:</b> توصل النهاية قبل الزعابيل.</div>';
    }else{
      card.innerHTML='<div class="runner-emoji">🏎️</div><div class="intro-role">أنت زعبول</div><div class="intro-hint">اختار كارت طاقة من المحطات.<br>لو محطتك مقفولة هتترجع خطوة.<br><br><b>هدفك:</b> توصل النهاية قبل البيدون.</div>';

    if(myReady){wrap.appendChild(el('div','ok-box','✅ جاهز -- في انتظار الباقي…'));}
    else{
      const b=el('button','primary block','متابعة ✓');
      b.onclick=()=>BaiDonGame.introContinue();
      wrap.appendChild(b);
    }
    if(isHost){
      const fb=el('button','ghost block small','ابدأ دلوقتي 🚀');
      fb.onclick=()=>BaiDonGame.hostStartAction();
      wrap.appendChild(fb);
