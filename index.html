  _uiRace(wrap,room,g,round,isHost,amBd,isRev,frozen,isResolving){
    const ps=g.playerState||{};
    const myAct=(g.actions||{})[App.uid];
    const submitted=!!(myAct&&myAct.ts);
    const target=g.target||20;
    const maxNum=Math.min(3,g.maxNum||3);
    const lr=g.lastResult||{};
    const animPhase=BaiDonGame._animKey===room.pin+'_'+g.round?BaiDonGame._animPhase:0;
    let selMove=myAct?(myAct.moveStation||null):null;
    let selBlock=myAct?(myAct.blockStation||null):null;
    let selDisguise=!!(myAct&&myAct.disguise);
    let selectionMode=selDisguise?'block':(selMove?'block':'move');
    const isJudgeHost=!!(isHost&&room.hostMode==='judge');
    const canInteract=!isJudgeHost&&!isResolving&&!frozen&&!submitted;
    const players=Object.keys(room.players||{}).map(id=>Object.assign({id},room.players[id]));
    players.sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
    const count=players.length;

    const timerText=el('div','timer-big');
    timerText.id='bd-timer-text';
    timerText.textContent=isResolving?'النتيجة...':'--';
    wrap.appendChild(timerText);

    const raceWrap=el('div','race-wrap');
    const roadScene=el('div','road-scene');
    roadScene.style.setProperty('--player-count',String(Math.max(1,count)));
    const bg=el('img','track-bg-img');
    bg.src=TRACK_IMAGE_SRC;bg.alt='مضمار السباق من خط البداية إلى خط النهاية';bg.draggable=false;
    roadScene.appendChild(bg);
    BaiDonGame._roadScene=roadScene;
    BaiDonGame._carIndices={};
    const stationTops={1:14.2,2:23.7,3:33.1};
    const stationEls={};

    const updateStationButtons=()=>{
      Object.keys(stationEls).forEach(key=>{
        const i=Number(key),st=stationEls[i];
        st.classList.toggle('selected-move',selMove===i);
        st.classList.toggle('selected-block',selBlock===i);
        let icon='⚡',label='اختيار';
        if(amBd&&(!isRev||selDisguise)){
          if(selectionMode==='block'){icon='🔒';label='قفل';}
          else{icon='⚡';label='طاقة';}
        }else if(amBd&&isRev){icon='🔒';label='قفل';}
        else{icon='⚡';label='طاقة';}
        if(selMove===i){icon='✅';label='طاقة '+i;}
        if(selBlock===i){icon='🔒';label='قفل '+i;}
        st.innerHTML='<span class="station-icon">'+icon+'</span><span class="station-label">'+label+'</span>';
      });
      const moveMode=document.getElementById('track-mode-move');
      const blockMode=document.getElementById('track-mode-block');
      if(moveMode)moveMode.classList.toggle('active',selectionMode==='move');
      if(blockMode)blockMode.classList.toggle('active',selectionMode==='block');
      const submit=document.getElementById('bd-submit-btn');
      if(submit){
        if(selDisguise|| (amBd&&isRev))submit.disabled=!selBlock;
        else if(amBd)submit.disabled=!(selMove&&selBlock&&selMove!==selBlock);
        else submit.disabled=!selMove;
      }
    };

    const chooseStation=(i)=>{
      if(!canInteract)return;
      if(amBd&&!isRev){
        if(selDisguise||selectionMode==='block'){
          if(i===selMove){toast('محطة القفل لازم تختلف عن كارت الطاقة','err');return;}
          selBlock=selBlock===i?null:i;
        }else{
          selMove=selMove===i?null:i;
          if(selMove)selectionMode='block';
          if(selBlock===selMove)selBlock=null;
        }
      }else if(amBd&&isRev){selBlock=selBlock===i?null:i;}
      else{selMove=selMove===i?null:i;}
      updateStationButtons();
    };

    for(let i=1;i<=maxNum;i++){
      const st=el('button','station station-overlay');
      st.type='button';st.dataset.station=String(i);
      st.style.top=stationTops[i]+'%';
      if(isResolving&&animPhase>=i+1){
        if((lr.blockedStations||[]).includes(i)){
          st.classList.add('fail');
          const hits=(lr.events||[]).filter(e=>e.type==='hit'&&e.station===i);
          if(hits.length){const names=hits.map(e=>room.players[e.uid]?room.players[e.uid].name:'').filter(Boolean).join('، ');if(names)st.title='المصابون: '+names;}
        }else st.classList.add('success');
      }
      st.disabled=!canInteract;
      st.onclick=()=>chooseStation(i);
      roadScene.appendChild(st);stationEls[i]=st;
    }
    updateStationButtons();

    players.forEach((p,idx)=>{
      BaiDonGame._carIndices[p.id]=idx;
      const pp=ps[p.id]||{pos:0};
      const isBd=(g.baiDonId===p.id);
      const displayPos=(isResolving&&BaiDonGame._animDisplayPos[p.id]!==undefined)?BaiDonGame._animDisplayPos[p.id]:pp.pos;
      const position=BaiDonGame._trackPosition(idx,count,displayPos,target);
      const token=el('div','car-token'+(p.id===App.uid?' me':'')+(isBd&&isRev?' revealed':'')+(pp.frozen>0?' frozen':'')+(count>8?' compact':''));
      token.dataset.uid=p.id;
      token.style.top=position.top+'%';
      token.style.left=position.left+'%';
      token.title=p.name;
      token.innerHTML='<div class="car-body"><div class="car-img">'+carHtml(p.carId,'')+'</div><div class="car-identity">'+identityHtml(p.identityId,'')+'</div></div>'+
        '<div class="car-name">'+esc(p.name)+(isBd&&isRev?' 🎭':'')+'</div>';
      roadScene.appendChild(token);
      BaiDonGame._carTokens[p.id]=token;
    });

    raceWrap.appendChild(roadScene);
    wrap.appendChild(raceWrap);

    const controls=el('div','track-controls');
    if(amBd&&!isRev&&!submitted){
      const modeRow=el('div','track-mode-row');
      const moveMode=el('button','track-mode','⚡ كارت الطاقة');moveMode.type='button';moveMode.id='track-mode-move';
      const blockMode=el('button','track-mode block-mode','🔒 محطة القفل');blockMode.type='button';blockMode.id='track-mode-block';
      moveMode.onclick=()=>{selectionMode='move';updateStationButtons();};
      blockMode.onclick=()=>{selectionMode='block';updateStationButtons();};
      modeRow.appendChild(moveMode);modeRow.appendChild(blockMode);controls.appendChild(modeRow);
    }else if(amBd&&isRev&&!submitted){
      controls.appendChild(el('div','track-help','أنت مكشوف: اختر محطة واحدة لإغلاقها. تحركك +1 تلقائيًا.'));
    }else if(!amBd&&!submitted){
      controls.appendChild(el('div','track-help','اضغط على إحدى محطات الطاقة داخل الصورة لاختيار كارت الحركة.'));
    }

    if(!isResolving){
      if(isJudgeHost){controls.appendChild(el('div','waiting','👑 أنت الحكم — تابع نتيجة الجولة'));}
      else if(frozen){controls.appendChild(el('div','waiting','❄️ أنت متجمد الجولة دي!'));}
      else if(submitted){controls.appendChild(el('div','ok-box','✅ تم إرسال اختيارك'));}
      else{
        if(amBd&&!isRev){
          const disBtn=el('button','chip disguise-chip'+(selDisguise?' on':'')+(g.timerEnd?' disguise-pulse':''),selDisguise?'🎭 التمويه مفعّل':'🎭 تمويه');
          disBtn.type='button';
          disBtn.onclick=()=>{
            selDisguise=!selDisguise;
            if(selDisguise){selMove=null;selectionMode='block';}
            else{selectionMode='move';selBlock=null;}
            disBtn.className='chip disguise-chip'+(selDisguise?' on':'')+(g.timerEnd?' disguise-pulse':'');
            disBtn.textContent=selDisguise?'🎭 التمويه مفعّل':'🎭 تمويه';
            updateStationButtons();
          };
          controls.appendChild(disBtn);
        }
        const submitBtn=el('button','primary block','إرسال الاختيار ✅');
        submitBtn.id='bd-submit-btn';
        controls.appendChild(submitBtn);
        submitBtn.onclick=async()=>{
          if(selDisguise){if(!selBlock){toast('اختار محطة التمويه','err');return;}await BaiDonGame.submitAction(null,selBlock,true);}
          else if(amBd&&isRev){if(!selBlock){toast('اختار محطة القفل','err');return;}await BaiDonGame.submitAction(null,selBlock,false);}
          else if(amBd){if(!selMove||!selBlock){toast('اختار كارت الطاقة ومحطة القفل','err');return;}if(selMove===selBlock){toast('كارت الطاقة لازم يختلف عن القفل','err');return;}await BaiDonGame.submitAction(selMove,selBlock,false);}
          else{if(!selMove){toast('اختار كارت الطاقة','err');return;}await BaiDonGame.submitAction(selMove,null,false);}
          submitBtn.disabled=true;submitBtn.textContent='تم الإرسال ✅';
        };
        updateStationButtons();
      }
    }
    if(controls.children.length)wrap.appendChild(controls);
    updateStationButtons();

    const available=BaiDonGame.getAvailableSounds(room,g,App.uid);
    if(available.length){
      const comedyToolbar=el('div','comedy-toolbar');
      available.forEach(s=>{
        const snd=COMEDY_SOUNDS.find(x=>x.id===s.id);if(!snd)return;
        const b=el('button','comedy-btn');b.type='button';
        b.disabled=Date.now()<(App._comedyCooldownUntil||0);
        b.innerHTML='<span class="cb-emoji">'+snd.emoji+'</span><span class="cb-name">'+esc(snd.name)+'</span>';
        b.onclick=()=>{if(!b.disabled)sendComedySound(s.id);};
        comedyToolbar.appendChild(b);
      });
      wrap.appendChild(comedyToolbar);
    }

    if(isResolving&&isHost){
      const btn=el('button','primary block','الجولة التالية ▶️');btn.id='race-next-btn';
      btn.style.display=BaiDonGame._animDone?'block':'none';
      btn.onclick=()=>{SFX.click();BaiDonGame.hostNextRound();};wrap.appendChild(btn);
      BaiDonGame._startRaceAnimation(room,g);
    }else if(isResolving&&!isHost){
      wrap.appendChild(el('div','waiting','⏳ في انتظار الهوست…'));
      BaiDonGame._startRaceAnimation(room,g);
    }else if(!isResolving&&isHost&&App.room.hostMode!=='auto'){
      const btn=el('button','warn block','إنهاء الجولة يدوياً ⏹');
      btn.onclick=()=>BaiDonGame.hostResolve();wrap.appendChild(btn);
    }

    if(isResolving){
      const evWrap=el('div','list');let idx=0;
      (lr.events||[]).forEach(ev=>{
        const p=room.players[ev.uid];if(!p)return;
        let cls='event-line',txt='';
        if(ev.type==='hit'){cls+=' hit';txt='💥 '+p.name+' اتصاب! تم الخصم من كارت الطاقة (-1)';if(ev.disguise)txt+=' — تمويه';}
        else if(ev.type==='freeze'){txt='❄️ '+p.name+' اتجمد!';}
        else if(ev.type==='move'){txt='⚡ '+p.name+': تم شحن كارت الطاقة (+'+ev.station+')';}
        else if(ev.type==='autoMove'){txt='🤖 '+p.name+' اتحرك +1 تلقائيًا.';}
        else return;
        const row=el('div',cls,txt);row.style.animationDelay=(idx*.25)+'s';idx++;evWrap.appendChild(row);
      });
      if(evWrap.children.length)wrap.appendChild(evWrap);
    }
  },

  _startRaceAnimation(room,g){
    const key=room.pin+'_'+g.round;
    if(BaiDonGame._animKey===key)return;
    BaiDonGame._animKey=key;BaiDonGame._animPhase=0;BaiDonGame._animDone=false;BaiDonGame._blockRenders=true;
    const lr=g.lastResult||{},oldPos=lr.oldPositions||{},newPos=lr.newPositions||{};
    const maxNum=Math.min(3,g.maxNum||3),target=g.target||20;
    const board=BaiDonGame._roadScene;
    const players=Object.keys(room.players||{}).map(id=>Object.assign({id},room.players[id])).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
    const count=players.length,indexMap={};players.forEach((p,i)=>{indexMap[p.id]=i;});
    Object.keys(oldPos).forEach(uid=>{BaiDonGame._animDisplayPos[uid]=oldPos[uid];});
    players.forEach(p=>{
      const token=BaiDonGame._carTokens[p.id];if(!token)return;
      const pos=BaiDonGame._trackPosition(indexMap[p.id],count,oldPos[p.id]||0,target);
      token.style.transition='none';token.style.left=pos.left+'%';token.style.top=pos.top+'%';token.offsetHeight;token.style.transition='';
    });

    const walkers=[];
    if(board){
      const stationTops={1:14.2,2:23.7,3:33.1};
      (lr.events||[]).filter(e=>(e.type==='move'||e.type==='hit')&&e.station&&indexMap[e.uid]!==undefined).forEach((ev,idx)=>{
        const p=room.players[ev.uid];if(!p)return;
        const start=BaiDonGame._trackPosition(indexMap[ev.uid],count,oldPos[ev.uid]||0,target);
        const targetX=88.8+((idx%5)-2)*1.5;
        const targetY=(stationTops[ev.station]||23.7)+Math.floor(idx/5)*1.0;
        const walker=el('div','station-walker',identityHtml(p.identityId,''));
        walker.style.left=start.left+'%';walker.style.top=start.top+'%';
        board.appendChild(walker);
        const points=[];
        for(let step=0;step<=3;step++){
          const f=step/3;
          points.push({left:(start.left+(targetX-start.left)*f+Math.sin(f*Math.PI)*1.2)+'%',top:(start.top+(targetY-start.top)*f)+'%'});
        }
        walkers.push({walker,start,points,targetX,targetY});
        setTimeout(()=>{
          if(BaiDonGame._animKey!==key)return;
          try{walker.animate(points.map(p=>({left:p.left,top:p.top})),{duration:1150,easing:'ease-in-out',fill:'forwards'});}catch(e){walker.style.left=targetX+'%';walker.style.top=targetY+'%';}
        },350);
      });
    }

    const baseDelay=350,stationDelay=700;
    for(let i=1;i<=maxNum;i++){
      setTimeout(()=>{if(BaiDonGame._animKey!==key)return;BaiDonGame._animPhase=i;BaiDonGame._applyStationCheck(i,room,g);},baseDelay+i*stationDelay);
    }
    const returnStartAt=baseDelay+(maxNum+1)*stationDelay;
    setTimeout(()=>{
      if(BaiDonGame._animKey!==key)return;
      walkers.forEach(({walker,start,targetX,targetY})=>{
        try{walker.animate([{left:targetX+'%',top:targetY+'%'},{left:(start.left+(targetX-start.left)*.67)+'%',top:(start.top+(targetY-start.top)*.67)+'%'},{left:(start.left+(targetX-start.left)*.33)+'%',top:(start.top+(targetY-start.top)*.33)+'%'},{left:start.left+'%',top:start.top+'%'}],{duration:950,easing:'ease-in-out',fill:'forwards'}).onfinish=()=>walker.remove();}
        catch(e){walker.remove();}
      });
    },returnStartAt);

    const carsStartAt=returnStartAt+1100;
    setTimeout(()=>{
      if(BaiDonGame._animKey!==key)return;
      BaiDonGame._animPhase=maxNum+2;
      let forward=false,reverse=false;
      Object.keys(newPos).forEach(uid=>{
        const previous=Number(oldPos[uid]||0),next=Number(newPos[uid]||0);
        BaiDonGame._animDisplayPos[uid]=next;
        const t=BaiDonGame._carTokens[uid];if(!t)return;
        const pos=BaiDonGame._trackPosition(indexMap[uid],count,next,target);
        t.style.left=pos.left+'%';t.style.top=pos.top+'%';
        if(next>previous)forward=true;if(next<previous)reverse=true;
      });
      if(forward)SFX.engineMove();
      if(reverse)setTimeout(()=>SFX.engineReverse(),forward?350:0);
      const hits=(lr.events||[]).filter(e=>e.type==='hit');
      if(hits.length&&!BaiDonGame._overlayShown[g.round]){
        BaiDonGame._overlayShown[g.round]=true;
        setTimeout(()=>showBidonOverlay(hits,room),450);
      }
    },carsStartAt);

    const doneAt=carsStartAt+1900+450;
    setTimeout(()=>{
      if(BaiDonGame._animKey!==key)return;
      BaiDonGame._animPhase=maxNum+3;BaiDonGame._animDone=true;BaiDonGame._blockRenders=false;
      const btn=document.getElementById('race-next-btn');if(btn)btn.style.display='block';
    },doneAt);
    if(BaiDonGame._animSafetyTimer)clearTimeout(BaiDonGame._animSafetyTimer);
    BaiDonGame._animSafetyTimer=setTimeout(()=>{
      if(BaiDonGame._animKey!==key)return;
      BaiDonGame._animDone=true;BaiDonGame._blockRenders=false;
      const btn=document.getElementById('race-next-btn');if(btn)btn.style.display='block';
    },doneAt+7000);
  },

  _applyStationCheck(i,room,g){
    const lr=g.lastResult||{},blocked=(lr.blockedStations||[]);
    const stEl=document.querySelector('.station[data-station="'+i+'"]');if(!stEl)return;
    if(blocked.includes(i)){
      stEl.classList.add('fail');SFX.stationFail();
      const hits=(lr.events||[]).filter(e=>e.type==='hit'&&e.station===i);
      if(hits.length){const names=hits.map(e=>room.players[e.uid]?room.players[e.uid].name:'').filter(Boolean).join('، ');if(names)stEl.title='المصابون: '+names;}
    }else{stEl.classList.add('success');SFX.stationSuccess();}
  },

  _uiVoteModal(wrap,room,g,isHost){
    const modal=el('div','vote-modal');
    const inner=el('div','vote-modal-inner');
    inner.appendChild(el('h3','phase-title','تصويت 🗳️'));
    inner.appendChild(el('div','waiting','مين البيدون؟ — التصويت هيُحسم تلقائيًا عند انتهاء العداد'));
    const myVote=(g.votes||{})[App.uid];
    const candidates=Object.keys(room.players||{}).filter(id=>id!==App.uid);
    const voteWrap=el('div','list');
    candidates.forEach(id=>{
      const p=room.players[id];if(!p)return;
      const row=el('button','row'+(myVote===id?' me':''));
      row.type='button';row.style.cursor='pointer';
      row.innerHTML='<div class="r-ava">'+identityHtml(p.identityId,'')+'</div>'+
        '<div class="r-main"><div class="r-name">'+nameWithCrown(room,id,p.name)+'</div></div>'+
        (myVote===id?'<div style="color:#22ff88;font-weight:900">✓</div>':'');

  _uiVoteResult(wrap,room,g,isHost){

            :'<div class="tiny" style="margin-top:6px">مفيش حد اتكشف. البيدون هيعطل محطتين الجاية.</div>');
        wrap.appendChild(box);
      }

  _uiFinal(wrap,room,g,isHost){

    }else{wrap.appendChild(el('div','waiting','⏳ في انتظار الهوست…'));}
  },

  _uiPlayAgain(wrap,room,g,isHost){
    wrap.appendChild(el('h3','phase-title','إعادة الزعبله 🔁'));
    const ready=g.ready||{};
    const total=Object.keys(room.players||{}).length;
    const rc=Object.keys(ready).filter(k=>ready[k]).length;
    wrap.appendChild(el('div','waiting','الاستعداد: '+rc+' / '+total));
    if(!isHost){
      if(ready[App.uid])wrap.appendChild(el('div','ok-box','✅ أنت مستعد!'));
      else{
        const b=el('button','success block','أنا مستعد ✋');
        b.onclick=()=>BaiDonGame.setReady();
        wrap.appendChild(b);
      }
    }else{
      const msg=rc<total?'في انتظار استعداد '+(total-rc)+' لاعبين…':'الكل مستعد ✓';
      wrap.appendChild(el('div','tiny',msg));
      const b=el('button','primary block','ابدأ من جديد 🚀');
      b.onclick=()=>{BaiDonGame.hostRestart();SFX.click();};
      wrap.appendChild(b);
    }
  },

  getAvailableSounds(room,g,uid){
    const ps=(g.playerState&&g.playerState[uid])||{};
    const isBd=(g.baiDonId===uid);
    const isRev=!!g.baiDonRevealed;
    const out=[];
    if(isBd){
      const events=(g.lastResult&&g.lastResult.events)||[];
      const hitSome=events.some(e=>e.type==='hit'&&!e.disguise&&e.uid!==uid);
      if(hitSome){out.push({id:'bala_seyah'},{id:'da_anto_lakta'});}
      out.push({id:'salam'});
    }
    /* Runner sounds based on context */
    const events=(g.lastResult&&g.lastResult.events)||[];
    const round=g.round||1;
    const vr=g.voteResult||{};
    const gotHit=events.some(e=>e.type==='hit'&&e.uid===uid);
    const moved=events.some(e=>e.type==='move'&&e.uid===uid);
    const myVote=vr.votes&&vr.votes[uid];
    const voteWrong=vr&&!vr.tie&&myVote&&myVote!==g.baiDonId;
    const voteRight=vr&&!vr.tie&&vr.wasBaiDon;
    if(gotHit||voteWrong){out.push({id:'ah_ana_hmar'},{id:'ana_hmar'},{id:'ezay'},{id:'ya_bni_haram'},{id:'awsakh'});}
    if(moved||voteRight){out.push({id:'edaah'});}
    if(round<=3){
      const used=(g.comedyUsed&&g.comedyUsed[uid]&&g.comedyUsed[uid].ank_lmeet)||false;
      if(!used)out.push({id:'ank_lmeet'});
    }
    if(vr&&!vr.tie&&vr.wasBaiDon)out.push({id:'hatouly'});
    if(vr&&!vr.tie&&!vr.wasBaiDon)out.push({id:'ehna_bhayem'});
    /* Dedupe */
    const seen=new Set();
    return out.filter(s=>{if(seen.has(s.id))return false;seen.add(s.id);return true;});
  }
};

function showBidonOverlay(hits,room){

function renderGame(){
  const room=App.room;
  const g=room.game||{};
  const phase=g.phase||'action';
  const round=g.round||1;
  $('game-round').textContent='جولة '+round;
  const me=room.players[App.uid];
  const myPs=(g.playerState||{})[App.uid]||{};
  const fTag=myPs.frozen>0?' ❄️':'';
  $('game-score').textContent='تقدمك: '+(me?(me.pos||0):0)+fTag;

  /* Block renders during racing animation */
  if(phase==='racing'&&BaiDonGame._blockRenders)return;

  let sig;
  const sigG=Object.assign({},g);delete sigG.comedySounds;delete sigG.lastSeen;
  const sigP={};
  Object.keys(room.players||{}).forEach(uid=>{
    const p=room.players[uid];
    sigP[uid]={n:p.name,c:p.carId,i:p.identityId,j:p.joinedAt,cu:p.cumulative||0};
  });

  if(phase==='action'){
    const a=(g.actions||{})[App.uid];
    const sub=!!(a&&a.ts);
    sig='act:'+round+':'+(g.baiDonRevealed?1:0)+':'+(sub?1:0)+':'+(myPs.frozen||0);
  }else if(phase==='intro'){
    const ready=g.introReady||{};
    const activeIds=Object.entries(room.players||{}).filter(([id,p])=>p&&p.online!==false).map(([id])=>id).sort();
    sig='intro:'+JSON.stringify(ready)+':'+activeIds.join(',');
  }else if(phase==='racing'){
    sig='racing:'+round+':'+(g.lastResult&&g.lastResult.animStartTs||0);
  }else{
    sig=phase+':'+JSON.stringify(sigG)+':'+JSON.stringify(sigP);
  }
  if(App.sig===sig)return;
  App.sig=sig;

  const body=$('game-body');
  body.innerHTML='';
  body.appendChild(BaiDonGame.build(room,g,phase,round));
}

function updateGameHint(){
  const bar=$('game-hint');
  if(!bar)return;
  const room=App.room;
  if(!room||room.status!=='playing'){bar.classList.add('hidden');return;}
  const g=room.game||{};
  const phase=g.phase;
  let hint='';
  const amBd=(g.baiDonId===App.uid);
  const isRev=!!g.baiDonRevealed;
  const ps=g.playerState||{};
  const me=ps[App.uid]||{};
  if(me.frozen>0){hint='❄️ أنت متجمد الجولة دي';}
  else if(phase==='intro'){hint='لا تفصح عن هويتك 🤫';}
  else if(phase==='action'){
    if(amBd&&!isRev)hint='اختار كارت طاقة (تتحرك) ومحطة قفل (توقع زعبول) — لازم يختلفوا';
    else if(amBd&&isRev)hint='مكشوف! بتتحرك +1 تلقائي، اختار محطة تقفلها';
    else hint='اختار كارت طاقة — لو محطتك مقفولة، هتترجع خطوة';
  }
  else if(phase==='vote'){hint='صوّت بحكمة! لو غلط، البيدون هيعطل محطتين';}
  else if(phase==='racing'){hint='شوف النتايج.. مين اتصاب؟';}
  else if(phase==='final'){hint='النهاية!';}
  if(hint){bar.textContent=hint;bar.classList.remove('hidden');}
  else{bar.classList.add('hidden');}
}

/* ============================================================
   GLOBAL TIMER
   ============================================================ */
setInterval(()=>{
  const room=App.room;
  if(!room||!room.game)return;
  const g=room.game;
  const timerPill=$('game-timer');
  if(g.phase==='action'&&g.timerEnd){
    const leftMs=g.timerEnd-Date.now();
    const left=Math.max(0,Math.ceil(leftMs/1000));
    if(timerPill&&timerPill.getAttribute('data-val')!==String(left)){
      timerPill.textContent='⏱ '+left+'ث';
      timerPill.setAttribute('data-val',String(left));
    }
    const txtEl=$('bd-timer-text');
    if(txtEl&&txtEl.getAttribute('data-val')!==String(left)){
      txtEl.textContent='⏱ '+left;
      txtEl.setAttribute('data-val',String(left));
    }
    if(App.isHost){
      const ps=g.playerState||{};
      const actions=g.actions||{};
      const needed=Object.keys(ps).filter(uid=>{
        const p=ps[uid];
        if(!p||p.frozen>0)return false;
        if(room.hostMode==='judge'&&uid===room.hostId)return false;
        return true;
      });
      const done=needed.filter(uid=>actions[uid]&&actions[uid].ts).length;
      if(needed.length>0&&done>=needed.length&&leftMs>800){BaiDonGame.hostResolve();}
      if(leftMs<=0)BaiDonGame.hostResolve();
    }
  }else if(g.phase==='vote'){
    const left=Math.max(0,Math.ceil(((g.voteEndAt||Date.now()+18000)-Date.now())/1000));
    if(timerPill){timerPill.textContent='🗳️ '+left+'ث';timerPill.setAttribute('data-val',String(left));}
    if(App.isHost&&left<=0)BaiDonGame.hostResolveVote();
  }else if(g.phase==='voteResult'){
    const left=Math.max(0,Math.ceil(((g.voteResultEndAt||Date.now()+4500)-Date.now())/1000));
    if(timerPill){timerPill.textContent='▶ '+left+'ث';timerPill.setAttribute('data-val',String(left));}
    if(App.isHost&&left<=0)BaiDonGame.hostAfterVote();
  }else{
    if(timerPill){timerPill.textContent='--';timerPill.removeAttribute('data-val');}
  }
},1000);

async function submitSetup(){
  const name=$('inp-name').value.trim();
  const pin=$('inp-pin').value.trim();
  if(name.length<2){toast('اكتب اسم من حرفين','err');return;}
  if(!/^\d{5}$/.test(pin)){toast('الرقم السري لازم 5 أرقام','err');return;}
  if(!selectedCarId){toast('اختر سيارة','err');return;}
  if(!selectedIdentityId){toast('اختر أفاتار أو ستيكر','err');return;}
  safeBlur($('inp-name'));safeBlur($('inp-pin'));
  showLoading('جاري الدخول... ⏳');
  try{
    let uid;
    if(App.flowMode==='create'){uid=await Core.createRoom(pin,name,selectedCarId,selectedIdentityId,currentIdTab,App.hostMode);}
    else{uid=await Core.joinRoom(pin,name,selectedCarId,selectedIdentityId,currentIdTab);}
    hideLoading();
    App.name=name;App.carId=selectedCarId;App.identityId=selectedIdentityId;
    Core.attach(pin,uid);
    App.sig='';
  }catch(err){
    hideLoading();
    const code=err&&err.message;
    if(code==='PIN_TAKEN')toast('الرقم السري مستخدم','err');
    else if(code==='NO_ROOM')toast('مفيش زعبل بالرقم ده','err');
    else if(code==='FULL')toast('الزعبل مليان','err');
    else if(code==='NAME_TAKEN')toast('الاسم موجود','err');
    else if(code==='CAR_TAKEN')toast('السيارة متاخدة','err');
    else if(code==='IDENTITY_TAKEN')toast('الأفاتار/الستيكر متاخد','err');
    else if(code==='STARTED')toast('اللعبة بدأت خلاص','err');
    else if(code==='KICKED')toast('أنت مطرود','err');
    else toast('مشكلة في الاتصال','err');
  }
}

  });

  window.addEventListener('pagehide',()=>{
    try{if(App.roomRef&&App.uid)App.roomRef.child('players/'+App.uid).update({online:false});}catch(e){}
  });
  document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('tab-hidden',document.hidden);});
  document.addEventListener('pointerdown',()=>{SFX._init();Voice.unlockAudio();});
  document.addEventListener('touchstart',()=>{SFX._init();Voice.unlockAudio();},{passive:true});
}

(async function boot(){
  App._comedyCooldownUntil=0;
  buildAssetGrids();
  bindEvents();
  showScreen('home');
  showLoading('جاري الاتصال... ⏳');
  try{
    await initFirebase();
    hideLoading();
    Core.sweepOldRooms();
    /* Comedy sounds download only when the player taps one. */
  }catch(err){
    hideLoading();
    toast('فشل الاتصال بالسيرفر ⚠️','err');
  }
})();
</script>
</body>
</html>
