    if (panels) wrap.appendChild(panels);
    const qInd = el('div', 'queue-bar hidden');
    qInd.id = 'comedy-queue-indicator';
    wrap.appendChild(qInd);
    setTimeout(updateQueueIndicator, 100);
    if (isHost){
      const btn = el('button', 'primary block', 'استمرار اللعبة ▶️');
      btn.onclick = () => BaiDonGame.hostAfterVote();
      wrap.appendChild(btn);
    } else { wrap.appendChild(el('div', 'waiting', '⏳ في انتظار الهوست…')); }
  },

  uiEndGuess(wrap, room, g, isHost){
    const guesser = g.endGuessUid;
    wrap.appendChild(el('h3', 'phase-title', 'تخمين النهاية! 🏁'));
    wrap.appendChild(el('div', 'waiting', 'لازم تخمن مين البيدون.. لو غلط هترجع 3 خطوات!'));
    if (App.uid === guesser){
      const ps = g.playerState || {};
      const candidates = Object.keys(room.players || {}).filter(id => id !== App.uid && ps[id] && !ps[id].eliminated);
      const list = el('div', 'list');
      candidates.forEach(function(id){
        const p = room.players[id]; if (!p) return;
        const row = el('button', 'row');
        row.type = 'button'; row.style.cursor = 'pointer';
        row.innerHTML = '<div class="r-ava">' + esc(p.avatar) + '</div>' +
          '<div class="r-main"><div class="r-name">' + nameWithCrown(room, id, p.name) + '</div></div>';
        row.onclick = function(){
          if (window.confirm('متأكد إن ' + p.name + ' هو البيدون؟')) BaiDonGame.submitEndGuess(id);
        };
        list.appendChild(row);
      });
      wrap.appendChild(list);
    } else {
      wrap.appendChild(el('div', 'waiting', '⏳ في انتظار تخمين ' + (room.players[guesser] ? room.players[guesser].name : '') + '…'));
    }
  },

  uiFinal(wrap, room, g, isHost){
    const finalMessage = g.finalMessage || '';
    wrap.appendChild(el('h3', 'phase-title', 'النهاية! 🏁'));
    const box = el('div', 'winner-box unmask');
    const winner = g.winner;
    const winnerName = g.winnerName || '';
    const winnerPlayerId = Object.keys(room.players || {}).find(id => room.players[id].name === winnerName);
    const winnerAvatar = winnerPlayerId ? room.players[winnerPlayerId].avatar : (winner === 'baidon' ? '🎭' : '🏆');
    box.innerHTML = '<div class="w-title">' + (winner === 'baidon' ? '🎭 البيدون فاز!' : '🏆 الزعبول فاز!') + '</div>' +
      '<div class="w-ava">' + winnerAvatar + '</div>' +
      '<div class="w-name">' + esc(winnerName) + '</div>' +
      '<div class="tiny" style="margin-top:8px;color:#fff">' + esc(finalMessage) + '</div>';
    wrap.appendChild(box);
    const ps = g.playerState || {};
    const list = el('div', 'list');
    const sorted = Object.keys(room.players || {}).map(id => Object.assign({ id }, room.players[id], { _ps: ps[id] || {} }))
      .filter(p => !p._ps.eliminated)
      .sort((a, b) => (b._ps.pos || 0) - (a._ps.pos || 0));
    sorted.forEach(function(p, i){
      const medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : (i + 1)));
      const bdTag = p.id === g.baiDonId ? ' 🎭' : '';
      const row = el('div', 'row' + (p.id === App.uid ? ' me' : ''));
      row.innerHTML = '<div class="rank-medal">' + medal + '</div>' +
        '<div class="r-ava">' + esc(p.avatar) + '</div>' +
        '<div class="r-main"><div class="r-name">' + nameWithCrown(room, p.id, p.name) + bdTag + '</div></div>' +
        '<div class="r-pts pos">' + (p._ps.pos || 0) + '</div>';
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if (winner === 'baidon' && App.uid === g.baiDonId) SFX.win();
    else if (winner === 'runner' && App.uid === winnerPlayerId) SFX.win();
    else if (winner) SFX.lose();
    if (isHost){
      const btn = el('button', 'primary block', 'إعادة الزعبله 🔁');
      btn.onclick = () => { BaiDonGame.hostPlayAgain(); SFX.click(); };
      wrap.appendChild(btn);
    } else { wrap.appendChild(el('div', 'waiting', '⏳ في انتظار الهوست…')); }
  },

  uiPlayAgain(wrap, room, g, isHost){
    wrap.appendChild(el('h3', 'phase-title', 'إعادة الزعبله 🔁'));
    const ready = g.ready || {};
    const total = Object.keys(room.players || {}).length;
    const readyCount = Object.keys(ready).filter(k => ready[k]).length;
    wrap.appendChild(el('div', 'waiting', 'الاستعداد: ' + readyCount + ' / ' + total + ' زعبول'));
    if (!isHost){
      if (ready[App.uid]) wrap.appendChild(el('div', 'ok-box', '✅ أنت مستعد!'));
      else {
        const btn = el('button', 'success block', 'أنا مستعد ✋');
        btn.onclick = () => BaiDonGame.setReady();
        wrap.appendChild(btn);
      }
    } else {
      const msg = readyCount < total ? 'في انتظار استعداد ' + (total - readyCount) + ' لاعبين…' : 'الكل مستعد ✓';
      wrap.appendChild(el('div', 'tiny', msg));
      const btn = el('button', 'primary block', 'ابدأ من جديد 🚀');
      btn.onclick = () => { BaiDonGame.hostRestart(); SFX.click(); };
      wrap.appendChild(btn);
    }
  }
};

function showBidonOverlay(realHits, room){
  const victimsHtml = realHits.map((ev, i) => {
    const v = room.players[ev.uid];
    if (!v) return '';
    return '<div class="ov-victim" style="animation-delay:' + (0.3 + i * 0.15) + 's">' + esc(v.avatar) + ' ' + esc(v.name) + '</div>';
  }).join('');
  const overlay = el('div', 'bd-overlay');
  overlay.innerHTML = '<div class="ov-icon">💥</div>' +
    '<div class="ov-text">البيدون أوقع!</div>' +
    '<div class="ov-victims">' + victimsHtml + '</div>' +
    '<div class="ov-sub">ضربة قاسية! 💀</div>';
  document.body.appendChild(overlay);
  SFX.baiDonHit();
  setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 2200);
}

function buildTopBar(room, g){
  const wrap = el('div', 'tb-players');
  const ps = g.playerState || {};
  if (g.baiDonId && !g.baiDonRevealed){
    const bdCard = el('div', 'tb-baidon');
    bdCard.dataset.meta = 'bidon';
    bdCard.innerHTML = '<div class="tb-ava">🎭</div><div class="tb-name">البيدون</div><div class="tb-mask">(متخفي)</div>';
    wrap.appendChild(bdCard);
  }
  const ids = Object.keys(room.players || {}).filter(id => {
    const p = ps[id]; return p && !p.eliminated;
  }).sort((a, b) => (room.players[a].joinedAt || 0) - (room.players[b].joinedAt || 0));
  ids.forEach(uid => {
    const p = room.players[uid];
    const pp = ps[uid] || {};
    const card = el('div', 'tb-player' + (uid === App.uid ? ' me' : ''));
    card.dataset.uid = uid;
    const isBidon = (g.baiDonId === uid);
    const showBidon = isBidon && g.baiDonRevealed;

function buildComedyPanels(room, g, round){
  const uid = App.uid;
  const myPs = (g.playerState || {})[uid] || {};
  if (myPs.eliminated) return null;
  const available = BaiDonGame.getAvailableSounds(room, g, uid);
  if (available.length === 0) return null;
  const wrap = el('div', 'comedy-wrap');
  const isBidon = (g.baiDonId === uid);
  const isRevealed = !!g.baiDonRevealed;
  const leftSounds = available.filter(s => s.panel === 'left');
  const rightSounds = available.filter(s => s.panel === 'right');
  const inCooldown = Date.now() < (App._comedyCooldownUntil || 0);
  function buildPanel(sounds, sideClass, title){
    if (sounds.length === 0) return null;
    const panel = el('div', 'comedy-panel ' + sideClass);
    panel.appendChild(el('div', 'cp-label', title));
    const grid = el('div', 'comedy-grid');
    sounds.forEach(function(s){
      const snd = COMEDY_SOUNDS.find(x => x.id === s.id);
      if (!snd) return;
      const b = el('button');
      b.type = 'button'; b.dataset.soundId = s.id;
      b.disabled = inCooldown;
      if (inCooldown) b.classList.add('cooldown');
      b.innerHTML = '<span class="cg-emoji">' + snd.emoji + '</span><span class="cg-name">' + esc(snd.name) + '</span>';
      b.onclick = function(){
        if (b.disabled) return;
        sendComedySound(s.id, round);
        SFX.click();
      };
      grid.appendChild(b);
    });
    panel.appendChild(grid);
    return panel;
  }
  if (isBidon && !isRevealed){
    const leftPanel = buildPanel(leftSounds, 'left', '🎭 مؤثرات البيدون');
    if (leftPanel) wrap.appendChild(leftPanel);
    const rightPanel = buildPanel(rightSounds, 'right', '🏃 مؤثرات كزعبول (تمويه)');
    if (rightPanel) wrap.appendChild(rightPanel);
  } else if (isBidon && isRevealed){
    const leftPanel = buildPanel(leftSounds, 'left', '🎭 مؤثرات البيدون');
    if (leftPanel) wrap.appendChild(leftPanel);
  } else {
    const rightPanel = buildPanel(rightSounds, 'right', '🎉 مؤثرات كوميدية');
    if (rightPanel) wrap.appendChild(rightPanel);
  }
  return wrap.children.length > 0 ? wrap : null;
}

async function sendComedySound(soundId, round){

    return;
  }
  App._comedyCooldownUntil = Date.now() + COMEDY_COOLDOWN_MS;
  document.querySelectorAll('.comedy-grid button').forEach(b => { b.disabled = true; b.classList.add('cooldown'); });
  setTimeout(() => {
    if (Date.now() >= (App._comedyCooldownUntil || 0) - 50){
      document.querySelectorAll('.comedy-grid button').forEach(b => { b.disabled = false; b.classList.remove('cooldown'); });

  if (soundId === 'ank_lmeet'){
    try { await setGame({ ['comedyUsed/' + App.uid + '/ank_lmeet']: true }); } catch(e){}

    await App.roomRef.child('game/comedySounds').push({
      uid: App.uid, soundId, ts: Date.now(), round

}

let micStream = null, mediaRecorder = null, audioChunks = [], isRecording = false, sharedAudio = null;

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = (e) => reject(e);
    reader.readAsDataURL(blob);
  });
}
function playAudioData(dataUrl){
  try {
    if (!sharedAudio) sharedAudio = new Audio();
    sharedAudio.pause(); sharedAudio.src = dataUrl;
    const p = sharedAudio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e){}
}
function setupMicListener(pin){
  try {
    const micRef = db.ref('rooms/' + pin + '/mic');
    micRef.on('child_added', function(snap){
      const v = snap.val();
      const now = Date.now();
      if (!v || !v.data || v.from === App.uid || (v.ts && now - v.ts > 12000)){
        snap.ref.remove().catch(() => {}); return;
      }
      playAudioData(v.data);
      setTimeout(() => snap.ref.remove().catch(() => {}), 25000);
    });
  } catch (e){}
}
async function startRecording(){
  if (isRecording || !App.roomRef) return;
  try {
    if (!micStream){ micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    audioChunks = [];
    const mimeCandidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', ''];
    let options = {};
    for (let i = 0; i < mimeCandidates.length; i++){
      if (!mimeCandidates[i]){ options = {}; break; }
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mimeCandidates[i])){ options = { mimeType: mimeCandidates[i] }; break; }
    }
    const mr = new MediaRecorder(micStream, options);
    mr.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
    mr.onstop = async () => {
      try {
        if (!audioChunks.length) return;
        const blob = new Blob(audioChunks, { type: mr.mimeType || 'audio/webm' });
        if (blob.size < 400) return;
        const b64 = await blobToBase64(blob);
        if (!b64 || b64.length > 900000){ toast('الصوت طويل أوي', 'err'); return; }
        if (App.roomRef){
          await App.roomRef.child('mic').push({
            from: App.uid,
            name: (App.room && App.room.players[App.uid]) ? App.room.players[App.uid].name : '',
            data: b64, ts: Date.now()
          });
          await App.roomRef.update({ lastActivity: Date.now() });
        }
      } catch (e){}
    };
    mr.start(); mediaRecorder = mr; isRecording = true;
    $('mic-btn').classList.add('rec');
  } catch (e){ toast('لازم تسمح بالمايك 🎙️', 'err'); }
}
function stopRecording(){
  if (!isRecording || !mediaRecorder) return;
  try { mediaRecorder.stop(); } catch(e){}
  mediaRecorder = null; isRecording = false;
  $('mic-btn').classList.remove('rec');
}

setInterval(function(){
  const room = App.room;
  if (!room || !room.game) return;
  const g = room.game;
  const isBaiDon = room.gameType === 'baidon';
  const timerPill = $('game-timer');
  if (isBaiDon){
    if (g.phase === 'action' && g.timerEnd){
      const leftMs = g.timerEnd - Date.now();
      const left = Math.max(0, Math.ceil(leftMs / 1000));
      if (timerPill && timerPill.getAttribute('data-val') !== String(left)){
        timerPill.textContent = '⏱ ' + left + 'ث';
        timerPill.setAttribute('data-val', String(left));
      }
      const txtEl = $('bd-timer-text');
      if (txtEl && txtEl.getAttribute('data-val') !== String(left)){
        txtEl.textContent = '⏱ ' + left + ' ثانية';
        txtEl.setAttribute('data-val', String(left));
      }
      const counter = $('bd-action-counter');
      if (counter){
        const ps = g.playerState || {};
        const actions = g.actions || {};
        const needed = Object.keys(ps).filter(uid => {
          const p = ps[uid];
          if (!p || p.eliminated || p.frozen > 0) return false;
          if (room.hostMode === 'judge' && uid === room.hostId) return false;
          return true;
        });
        const done = needed.filter(uid => actions[uid] && actions[uid].ts).length;
        const str = done + ' / ' + needed.length + ' اختاروا';
        if (counter.getAttribute('data-val') !== str){ counter.textContent = str; counter.setAttribute('data-val', str); }
        if (needed.length > 0 && done >= needed.length && leftMs > 800) BaiDonGame.hostResolve();
      }
      if (leftMs <= 0) BaiDonGame.hostResolve();
    } else {
      if (timerPill && g.phase !== 'action'){ timerPill.textContent = '--'; timerPill.removeAttribute('data-val'); }
      const txtEl = $('bd-timer-text');
      if (txtEl && g.phase !== 'action') txtEl.textContent = '';
    }
    if (App.isHost && room.hostMode === 'auto'){
      if (g.phase === 'intro' && !BaiDonGame._autoIntroTimer){
        BaiDonGame._autoIntroTimer = setTimeout(() => {
          BaiDonGame._autoIntroTimer = null;
          if (App.room && App.room.game.phase === 'intro') BaiDonGame.hostStartAction();
        }, 8000);
      }
      if (g.phase === 'intro'){
        const ready = g.introReady || {};
        const total = Object.keys(room.players || {}).length;
        let cnt = 0; Object.keys(ready).forEach(k => { if (ready[k]) cnt++; });
        if (total > 0 && cnt >= total) BaiDonGame.hostStartAction();
      }
    }
    if (App.isHost && g.phase === 'intro' && !BaiDonGame._introCheckTimer){
      BaiDonGame._introCheckTimer = setInterval(function(){
        if (!App.room || App.room.game.phase !== 'intro'){ clearInterval(BaiDonGame._introCheckTimer); BaiDonGame._introCheckTimer = null; return; }
        const ready = App.room.game.introReady || {};
        const total = Object.keys(App.room.players || {}).length;
        let cnt = 0; Object.keys(ready).forEach(k => { if (ready[k]) cnt++; });
        if (total > 0 && cnt >= total){ clearInterval(BaiDonGame._introCheckTimer); BaiDonGame._introCheckTimer = null; BaiDonGame.hostStartAction(); }
      }, 700);
    }
  } else {
    if (g.phase === 'answering' && g.timerEnd){
      const leftMs = g.timerEnd - Date.now();
      const left = Math.max(0, Math.ceil(leftMs / 1000));
      if (timerPill && timerPill.getAttribute('data-val') !== String(left)){
        timerPill.textContent = '⏱ ' + left + 'ث';
        timerPill.setAttribute('data-val', String(left));
      }
      const txtEl = $('box-timer-text');
      if (txtEl && txtEl.getAttribute('data-val') !== String(left)){
        txtEl.textContent = '⏱ ' + left + ' ثانية';
        txtEl.setAttribute('data-val', String(left));
      }
      if (App.isHost){
        const answererIds = getAnswererIds(room);
        const allAnswered = answererIds.length > 0 && answererIds.every(id => g.answers && g.answers[id] && g.answers[id].text);
        if (leftMs <= 0 || allAnswered) BoxGame.hostEndTimer();
      }
    } else {
      if (timerPill && g.phase !== 'answering'){ timerPill.textContent = '--'; timerPill.removeAttribute('data-val'); }
    }
    if (App.isHost && g.phase === 'playAgain'){
      const ready = g.ready || {};
      const total = Object.keys(room.players || {}).length;
      let cnt = 0; Object.keys(ready).forEach(k => { if (ready[k]) cnt++; });
      if (total > 0 && cnt >= total) BoxGame.hostRestart();
    }
  }
}, 1000);

  App.flowMode = mode;
  App.gameType = gameType || 'box';
  $('setup-title').textContent = (mode === 'create')
    ? (App.gameType === 'baidon' ? 'إنشاء زعبل البيدون 🎭' : 'إنشاء زعبل جديد')
    : 'دخول زعبل موجود';
  $('btn-submit').textContent = (mode === 'create')
    ? (App.gameType === 'baidon' ? 'إنشاء زعبل البيدون 🎭' : 'إنشاء الزعبل 🚀')
    : 'دخول الزعبل 🚪';
  $('host-opts').classList.toggle('hidden', mode !== 'create');
  $('inp-name').value = '';
  $('inp-pin').value = '';
  showScreen('setup');
}

async function submitSetup(){
  const name = $('inp-name').value.trim();
  const pin = $('inp-pin').value.trim();
  if (name.length < 2){ toast('اكتب اسم من حرفين على الأقل', 'err'); return; }
  if (!/^\d{5}$/.test(pin)){ toast('الرقم السري لازم 5 أرقام', 'err'); return; }
  if (!selectedAvatar){ toast('اختر أفاتار', 'err'); return; }
  safeBlur($('inp-name')); safeBlur($('inp-pin'));
  showLoading('جاري الدخول... ⏳');
  try {
    let uid;
    if (App.flowMode === 'create'){ uid = await Core.createRoom(pin, name, selectedAvatar, App.hostMode, App.gameType); }
    else { uid = await Core.joinRoom(pin, name, selectedAvatar); }
    hideLoading();
    App.name = name; App.avatar = selectedAvatar;
    Core.attach(pin, uid);
    App.sig = '';
  } catch (err){
    hideLoading();
    const code = err && err.message;
    if (code === 'PIN_TAKEN') toast('الرقم السري مستخدم', 'err');
    else if (code === 'NO_ROOM') toast('مفيش زعبل بالرقم ده 🤔', 'err');
    else if (code === 'FULL') toast('الزعبل مليان', 'err');
    else if (code === 'NAME_TAKEN') toast('الاسم موجود', 'err');
    else if (code === 'AVATAR_TAKEN') toast('الأفاتار ده متاخد', 'err');
    else if (code === 'STARTED') toast('اللعبة بدأت خلاص', 'err');
    else if (code === 'KICKED') toast('أنت مطرود من الزعبل ده 🚪', 'err');
    else toast('مشكلة في الاتصال', 'err');
  }
}

function bindEvents(){
  $('card-box').addEventListener('click', () => showHomeChoice('box'));
  $('card-baidon').addEventListener('click', () => showHomeChoice('baidon'));
  function showHomeChoice(gameType){
    const old = document.getElementById('home-choice'); if (old) old.remove();
    const choice = el('div', 'card');
    choice.id = 'home-choice';
    choice.innerHTML = '<h3 class="center">' + (gameType === 'baidon' ? 'البيدون 🎭' : 'بره الصندوق 📦') + '</h3>' +
      '<div class="stack" style="margin-top:12px">' +
        '<button class="primary block" id="pick-create" type="button">إنشاء زعبل جديد 🎉</button>' +
        '<button class="secondary block" id="pick-join" type="button">دخول زعبل موجود 🚪</button>' +
        '<button class="ghost block small" id="pick-cancel" type="button">إلغاء</button>' +
      '</div>';
    $('screen-home').appendChild(choice);
    $('pick-create').onclick = () => { choice.remove(); openSetup('create', gameType); };
    $('pick-join').onclick = () => { choice.remove(); openSetup('join', gameType); };
    $('pick-cancel').onclick = () => choice.remove();
  }
  $('btn-back').addEventListener('click', function(){
    showScreen('home');
    const c = document.getElementById('home-choice'); if (c) c.remove();
  });
  $('btn-submit').addEventListener('click', submitSetup);
  onEnter($('inp-name'), () => $('inp-pin').focus());
  onEnter($('inp-pin'), submitSetup);
  $('inp-pin').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, '').slice(0, 5); });
  const hostChips = document.querySelectorAll('#host-opts .chip');
  const hostHints = {
    play: 'هوست + لاعب: تتحكم يدوياً وتلعب كزعبول عادي.',
    judge: 'هوست وحكم فقط: متلعبش، تتحكم في إيقاع اللعبة فقط.',
    auto: 'أوتوماتيكي: اللعبة تتقدم بتايمر، وأنت تلعب عادي.'
  };
  hostChips.forEach(function(chip){
    chip.addEventListener('click', function(){
      hostChips.forEach(c => c.classList.remove('on'));
      chip.classList.add('on');
      App.hostMode = chip.getAttribute('data-host');
      $('host-hint').textContent = hostHints[App.hostMode] || '';
    });
  });
  $('btn-leave').addEventListener('click', () => Core.leave());
  $('btn-start-game').addEventListener('click', function(){
    if (App.room.gameType === 'baidon') BaiDonGame.hostStart();
    else BoxGame.hostStart();
  });
  $('lobby-players').addEventListener('click', function(e){
    let node = e.target;
    while (node && node !== this && !(node.getAttribute && node.getAttribute('data-kick'))) node = node.parentNode;
    if (node && node !== this && node.getAttribute){
      const pid = node.getAttribute('data-kick');
      if (pid) Core.kick(pid);
    }
  });
  const micBtn = $('mic-btn');
  micBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('pointerup', (e) => { e.preventDefault(); stopRecording(); });
  micBtn.addEventListener('pointerleave', () => stopRecording());
  micBtn.addEventListener('pointercancel', () => stopRecording());
  window.addEventListener('pagehide', function(){
    try { if (App.roomRef && App.uid) App.roomRef.child('players/' + App.uid).update({ online: false }); } catch(e){}
  });
  document.addEventListener('visibilitychange', () => {
    document.body.classList.toggle('tab-hidden', document.hidden);
  });
  document.addEventListener('pointerdown', () => SFX._init(), { once: true });
  document.addEventListener('touchstart', () => SFX._init(), { once: true });
}

(async function boot(){
  App._comedyCooldownUntil = 0;
  buildAvatarGrid();
  bindEvents();
  showScreen('home');
  showLoading('جاري الاتصال بالسيرفر... ⏳');
  try {
    await initFirebase();
    hideLoading();
    Core.sweepOldRooms();
    ComedyAudio.preload().catch(() => {});
  } catch (err){
    hideLoading();
    toast('فشل الاتصال بالسيرفر. تأكد من الإنترنت ⚠️', 'err');
  }
})();
</script>
