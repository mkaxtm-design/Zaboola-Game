<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0518">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>زعبوله | البيدون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:#f4ecff;min-height:100vh;
  background:linear-gradient(-45deg,#0b0518,#1a0b2e,#08131f,#2a0a22);
  background-size:400% 400%;
  animation:bgmove 22s ease infinite;
  overflow-x:hidden;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.42;pointer-events:none;z-index:0;}
.orb.a{width:250px;height:250px;background:#ff2e9a;top:-70px;right:-70px;animation:float1 15s ease-in-out infinite;}
.orb.b{width:230px;height:230px;background:#00f0ff;bottom:-80px;left:-80px;animation:float2 18s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,38px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-30px)}}

button{
  font-family:inherit;font-size:16px;font-weight:800;color:#fff;
  border:none;outline:none;cursor:pointer;border-radius:16px;
  padding:14px 18px;transition:filter .14s ease, box-shadow .2s ease, opacity .2s ease;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;
}
button:active{filter:brightness(.78);}
button:disabled{opacity:.42;filter:grayscale(.45);}
button.primary{background:linear-gradient(135deg,#ff2e9a,#a855f7);box-shadow:0 6px 22px rgba(255,46,154,.38),0 0 0 1px rgba(255,255,255,.12) inset;}
button.secondary{background:linear-gradient(135deg,#00f0ff,#3b82f6);box-shadow:0 6px 22px rgba(0,240,255,.30);color:#04141a;}
button.success{background:linear-gradient(135deg,#22ff88,#0ea5a4);box-shadow:0 6px 22px rgba(34,255,136,.28);color:#06231a;}
button.warn{background:linear-gradient(135deg,#ffb020,#ff5e3a);box-shadow:0 6px 22px rgba(255,94,58,.3);color:#241000;}
button.ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:none;font-weight:700;}
button.small{font-size:13px;padding:9px 14px;border-radius:12px;}
button.block{width:100%;}

input[type=text],input[type=tel]{
  font-family:inherit;font-size:16px;font-weight:700;width:100%;padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);color:#fff;outline:none;
  transition:border-color .18s, background .18s;-webkit-appearance:none;appearance:none;
}
input::placeholder{color:rgba(255,255,255,.35);font-weight:600;}
input:focus{border-color:#ff2e9a;background:rgba(255,255,255,.11);}
input[type=tel]{letter-spacing:6px;text-align:center;font-size:22px;font-weight:900;}

#app{position:relative;z-index:2;padding:16px 14px 90px;max-width:960px;margin:0 auto;}
.screen{display:none;animation:fadein .28s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{
  background:rgba(22,10,40,.72);border:1px solid rgba(255,255,255,.10);border-radius:24px;
  padding:20px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);margin-bottom:16px;
}
h1,h2,h3,h4{margin:0 0 12px;line-height:1.25;}
h2{font-size:22px;font-weight:900;}
h3{font-size:18px;font-weight:800;}
label{display:block;font-size:14px;font-weight:800;margin:16px 0 8px;color:#c9b6ff;}
label:first-child{margin-top:0;}

.brand{text-align:center;padding:34px 0 22px;}
.logo{
  font-size:clamp(44px,15vw,76px);font-weight:900;letter-spacing:-2px;margin:0;
  background:linear-gradient(120deg,#ff2e9a,#00f0ff 45%,#22ff88 75%,#a855f7);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:shine 6s ease infinite;filter:drop-shadow(0 4px 26px rgba(255,46,154,.45));
}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tag{color:#a797c9;font-size:15px;font-weight:700;margin:6px 0 0;line-height:1.6;}

.setup-tab-row{display:flex;gap:6px;margin-bottom:8px;}
.setup-tab{flex:1;font-size:13px;font-weight:800;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#c9b6ff;cursor:pointer;}
.setup-tab.on{background:linear-gradient(135deg,rgba(0,240,255,.28),rgba(59,130,246,.22));border-color:#00f0ff;color:#fff;}

.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;}
.asset-grid.cars{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));max-height:160px;}
.asset-tile{aspect-ratio:1/1;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;}
.asset-tile img{width:100%;height:100%;object-fit:contain;padding:4px;}
.asset-tile.sel{border-color:#ff2e9a;background:rgba(255,46,154,.20);box-shadow:0 0 16px rgba(255,46,154,.55);}

.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.pin-badge{font-size:15px;font-weight:800;color:#c9b6ff;}
.pin-badge span{display:inline-block;font-size:24px;font-weight:900;letter-spacing:5px;color:#00f0ff;text-shadow:0 0 16px rgba(0,240,255,.7);margin-inline-start:6px;}
.lobby-sub{font-size:13px;color:#8d7fb0;font-weight:700;margin-top:4px;}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin:14px 0;}
.pcard{position:relative;border-radius:16px;padding:10px 6px 8px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);}
.pcard.off{opacity:.45;}
.pcard .pava{font-size:26px;line-height:1.1;width:100%;height:32px;display:flex;align-items:center;justify-content:center;}
.pcard .pava img{max-width:100%;max-height:100%;object-fit:contain;}
.pcard .pname{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#efe6ff;}
.pcard .host-tag{font-size:10px;font-weight:800;color:#ffd166;margin-top:2px;}
.pcard .off-tag{font-size:10px;font-weight:800;color:#ff6b8a;margin-top:2px;}
.pcard .kick{position:absolute;top:-7px;left:-7px;width:24px;height:24px;min-width:24px;border-radius:50%;font-size:12px;padding:0;font-weight:900;background:linear-gradient(135deg,#ff2e5e,#ff5e3a);color:#fff;box-shadow:0 4px 12px rgba(255,46,94,.5);}

.game-topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px;position:sticky;top:8px;z-index:20;}
.pill{background:rgba(22,10,40,.88);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:900;color:#e5d9ff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;}
#game-timer{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.6);min-width:74px;text-align:center;}
#game-score{color:#22ff88;text-shadow:0 0 14px rgba(34,255,136,.5);}

.game-hint{position:sticky;top:56px;z-index:19;font-size:11px;font-weight:700;color:#c9b6ff;background:rgba(22,10,40,.88);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:6px 12px;text-align:center;margin-bottom:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);line-height:1.5;}
.game-hint.hidden{display:none;}

.phase{display:flex;flex-direction:column;gap:10px;}
.phase-title{font-size:19px;font-weight:900;text-align:center;margin:0;background:linear-gradient(120deg,#ff2e9a,#00f0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(255,46,154,.35));}
.waiting{text-align:center;font-size:15px;font-weight:800;color:#a797c9;padding:18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.16);}
.ok-box{text-align:center;font-size:15px;font-weight:800;color:#06231a;padding:16px;border-radius:16px;background:linear-gradient(135deg,#22ff88,#0ea5a4);box-shadow:0 8px 26px rgba(34,255,136,.3);word-break:break-word;}
.answered-count{text-align:center;font-size:14px;font-weight:800;color:#c9b6ff;padding:8px;}
.timer-big{text-align:center;font-size:32px;font-weight:900;color:#00f0ff;text-shadow:0 0 22px rgba(0,240,255,.65);padding:4px;letter-spacing:2px;line-height:1;}

.list{display:flex;flex-direction:column;gap:9px;}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);}
.row.me{border-color:rgba(255,46,154,.55);background:rgba(255,46,154,.10);}
.row .r-ava{font-size:24px;line-height:1;min-width:32px;text-align:center;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.row .r-ava img{max-width:100%;max-height:100%;object-fit:contain;}
.row .r-main{flex:1;min-width:0;}
.row .r-name{font-size:13px;font-weight:900;color:#efe6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .r-pts{font-size:17px;font-weight:900;min-width:46px;text-align:center;color:#00f0ff;}
.rank-medal{font-size:22px;min-width:30px;text-align:center;}

.winner-box{text-align:center;padding:22px 16px;border-radius:22px;background:linear-gradient(140deg,rgba(255,46,154,.22),rgba(0,240,255,.14));border:1.5px solid rgba(255,46,154,.45);box-shadow:0 0 40px rgba(255,46,154,.25);}
.winner-box .w-title{font-size:13px;font-weight:800;color:#c9b6ff;}
.winner-box .w-ava{font-size:52px;line-height:1.2;height:64px;display:flex;align-items:center;justify-content:center;}
.winner-box .w-ava img{max-height:100%;max-width:100%;object-fit:contain;}
.winner-box .w-name{font-size:24px;font-weight:900;}
.winner-box .w-score{font-size:15px;font-weight:800;color:#00f0ff;margin-top:4px;}

#toast-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;padding:0 14px;}
.toast{max-width:92vw;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:800;color:#fff;background:rgba(30,14,54,.96);border:1.5px solid rgba(0,240,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.55);animation:tin .25s ease;text-align:center;}
.toast.err{border-color:rgba(255,46,94,.75);background:rgba(52,10,26,.96);}
.toast.ok{border-color:rgba(34,255,136,.75);background:rgba(8,44,28,.96);}
.toast.out{opacity:0;transition:opacity .35s;}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

#loading-overlay{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(6,2,14,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:16px;font-weight:900;color:#fff;}
#loading-overlay.hidden{display:none;}
.loader{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.14);border-top-color:#ff2e9a;border-right-color:#00f0ff;animation:spin .85s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none !important;}
.tiny{font-size:12px;color:#8d7fb0;font-weight:700;text-align:center;line-height:1.7;}
.stack{display:flex;flex-direction:column;gap:10px;}
.center{text-align:center;}
.crown{color:#ffd166;font-size:14px;}

.intro-card{text-align:center;padding:32px 20px;border-radius:24px;position:relative;overflow:hidden;}
.intro-card.bd{background:linear-gradient(160deg,rgba(255,46,94,.30),rgba(168,85,247,.22));border:2px solid rgba(255,46,94,.55);box-shadow:0 0 60px rgba(255,46,94,.35);}
.intro-card.runner{background:linear-gradient(160deg,rgba(34,255,136,.25),rgba(0,240,255,.18));border:2px solid rgba(34,255,136,.55);box-shadow:0 0 60px rgba(34,255,136,.30);}
.intro-role{font-size:34px;font-weight:900;margin:10px 0;line-height:1.2;}
.intro-hint{font-size:14px;font-weight:700;opacity:.9;margin-top:8px;}
@keyframes shush{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(-8deg)}}
.shush-emoji{font-size:66px;display:inline-block;animation:shush 1.5s ease-in-out infinite;}
@keyframes runAnim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.runner-emoji{font-size:66px;display:inline-block;animation:runAnim 1s ease-in-out infinite;}

/* === TRACK SCENE (image based) === */
.race-wrap{display:grid;grid-template-columns:1fr 54px;gap:6px;margin-bottom:6px;align-items:start;}
.car-token{position:absolute;transform:translate(-50%,-50%);transition:top 2s cubic-bezier(.3,.9,.4,1),left .4s ease,width 2s ease;z-index:5;pointer-events:none;}
.car-body{position:relative;width:100%;aspect-ratio:1/1.25;}
.car-img{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));display:flex;align-items:center;justify-content:center;}
.car-img img{width:100%;height:100%;object-fit:contain;display:block;}
.car-emoji{font-size:5cqw;}
.car-identity{position:absolute;left:50%;top:-8%;transform:translateX(-50%);width:62%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:4cqw;background:rgba(0,0,0,.55);border-radius:50%;z-index:2;line-height:1;}
.car-identity img{width:100%;height:100%;object-fit:contain;}
.car-name{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:2.3cqw;font-weight:900;color:#fff;background:rgba(0,0,0,.72);padding:0 1.2cqw;border-radius:6px;white-space:nowrap;max-width:220%;overflow:hidden;text-overflow:ellipsis;}
.car-token.me .car-name{background:rgba(255,46,154,.85);}
.car-token.revealed .car-body{outline:2px solid #ff2e5e;border-radius:8px;}
.car-token.frozen .car-body{filter:brightness(1.4) hue-rotate(180deg);}
.st-badge{position:absolute;z-index:3;font-size:3.2cqw;font-weight:900;color:#ffd166;background:rgba(0,0,0,.7);border-radius:8px;padding:.5cqw 1.2cqw;}
.disg-btn{position:absolute;right:1.5%;top:62%;z-index:7;font-size:3.3cqw;padding:1.6cqw 2cqw;border-radius:10px;background:rgba(90,30,140,.9);border:1.5px solid #a855f7;}
.disg-btn.on{background:linear-gradient(135deg,#ff2e9a,#a855f7);box-shadow:0 0 14px #ff2e9a;}
.disg-btn.blink{animation:blinkA .7s ease-in-out infinite;}
@keyframes blinkA{50%{opacity:.25;box-shadow:0 0 18px #ffd166;}}
.walker{position:absolute;transform:translate(-50%,-50%);transition:left .6s ease-in-out,top .6s ease-in-out;z-index:8;width:6cqw;height:6cqw;font-size:5cqw;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1;}
.walker img{width:100%;height:100%;object-fit:contain;}
.pstrip{display:flex;gap:6px;overflow-x:auto;padding:8px 4px 4px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.pchip{flex:0 0 auto;position:relative;display:flex;flex-direction:column;align-items:center;min-width:50px;padding:4px 6px;border-radius:12px;background:rgba(255,255,255,.07);border:2px solid transparent;}
.pchip.speaking{border-color:#22ff88;box-shadow:0 0 12px #22ff88;}
.pc-ava{font-size:22px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.pc-ava img{max-width:100%;max-height:100%;object-fit:contain;}
.pc-sc{font-size:12px;font-weight:900;color:#22ff88;}
.pc-mic{position:absolute;top:-7px;left:-5px;width:20px;height:20px;min-width:20px;padding:0;font-size:11px;border-radius:50%;background:#3b3b8f;}
.pc-mic.off{background:#555;opacity:.7;}
.event-line{font-size:13px;font-weight:800;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);}
.event-line.hit{background:rgba(255,46,94,.15);}
.frozen-box{text-align:center;font-weight:800;padding:12px;border-radius:14px;background:rgba(0,240,255,.15);}
.bd-overlay .ov-victims{font-size:var(--vs,20px);}
.bd-overlay .ov-victim{font-size:1em;padding:.4em .8em;}
.bd-overlay .ov-victim img{height:1.3em;vertical-align:middle;}

.st-zone{position:absolute;width:3.6cqw;height:3.6cqw;border-radius:50%;transform:translate(-50%,-50%);z-index:4;opacity:0;transition:opacity .25s;pointer-events:none;}
.st-zone.success{opacity:1;background:#22ff88;box-shadow:0 0 2.4cqw #22ff88;}
.st-zone.fail{opacity:1;background:#ff2e5e;box-shadow:0 0 2.4cqw #ff2e5e;}
.sfx-row{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;}
.sfx-row .comedy-btn{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:4px;width:auto;min-width:0;padding:4px 8px;border-radius:10px;}
.sfx-row .cb-emoji{font-size:15px;}
.sfx-row .cb-name{font-size:10px;white-space:nowrap;}
.car-bubble{position:absolute;z-index:9;transform:translate(-50%,-100%);margin-top:-9cqw;padding:.8cqw 2.2cqw;border-radius:2.4cqw;background:linear-gradient(135deg,rgba(255,46,154,.95),rgba(168,85,247,.92));color:#fff;font-size:3.1cqw;font-weight:900;white-space:nowrap;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.5);pointer-events:none;animation:popIn .25s ease;}
.car-bubble.bd{background:linear-gradient(135deg,rgba(255,46,94,.95),rgba(120,30,60,.95));}
@keyframes popIn{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
#screen-game .game-topbar{top:4px;margin-bottom:4px;gap:6px;}
#screen-game .pill{padding:5px 11px;font-size:12px;}
#screen-game .game-hint{position:static;font-size:10px;padding:3px 10px;margin-bottom:4px;line-height:1.4;}

.road-scene{position:relative;flex:0 0 auto;width:100%;aspect-ratio:941/1403;margin:0;overflow:hidden;background:#05030d center/100% 100% no-repeat;container-type:inline-size;}
.scene-box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.scene-status{position:absolute;top:1%;left:50%;transform:translateX(-50%);z-index:10;font-size:3.6cqw;font-weight:900;color:#00f0ff;background:rgba(0,0,0,.62);padding:.5cqw 2.4cqw;border-radius:3cqw;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;}
.rbottom{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
.rbottom>*{flex:1;margin:0!important;padding:9px 12px;font-size:14px;border-radius:14px;}
.confetti{position:absolute;top:-6%;z-index:11;font-size:5cqw;animation:cfall 2.8s linear forwards;pointer-events:none;}
@keyframes cfall{to{top:105%;rotate:360deg;}}
.win-banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:12;background:rgba(0,0,0,.78);border:.6cqw solid #ffd166;border-radius:4cqw;padding:3cqw 6cqw;font-size:6.5cqw;font-weight:900;color:#ffd166;white-space:nowrap;text-align:center;animation:popIn .3s ease;}
body.race-fixed{overflow:hidden;height:100vh;height:100dvh;}
body.race-fixed #app{padding:0;max-width:none;}
body.race-fixed #screen-game{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
body.race-fixed #screen-game .game-topbar{flex:0 0 auto;position:static;margin:0;padding:3px 6px 0;gap:4px;}
body.race-fixed #screen-game .pill{padding:3px 9px;font-size:11px;}
body.race-fixed #screen-game .game-hint{flex:0 0 auto;margin:3px 6px;padding:2px 8px;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
body.race-fixed #game-body{flex:1;min-height:0;display:flex;flex-direction:column;}
body.race-fixed #game-body>.phase{flex:1;min-height:0;display:flex;flex-direction:column;padding:0!important;margin:0!important;gap:0!important;}
.sfx-row{padding:0 6px 3px;gap:4px;flex:0 0 auto;}
.sfx-row .comedy-btn{height:22px;min-height:0!important;padding:0 7px!important;gap:3px;border-radius:8px;line-height:1;}
.sfx-row .cb-emoji{font-size:12px;}
.sfx-row .cb-name{font-size:9px;}


.st-btns{position:absolute;z-index:6;display:flex;flex-direction:column;gap:1.2cqw;}
.st-btn{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.2);border-radius:2.6cqw;color:rgba(255,255,255,.5);font-size:3.4cqw;padding:0;align-items:center;justify-content:center;transition:background .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;}
.st-btn i{display:flex;width:30%;max-width:7cqw;font-style:normal;opacity:.55;line-height:1;}
.st-btn svg{width:100%;height:auto;display:block;}
.st-btn{cursor:pointer;touch-action:manipulation;}
.st-btn:disabled{opacity:.5;}
.st-btn.on.st-move{background:rgba(34,255,136,.14);border-color:rgba(34,255,136,.9);box-shadow:0 0 2.2cqw rgba(34,255,136,.55),inset 0 0 1.8cqw rgba(34,255,136,.28);}
.st-btn.on.st-block{background:rgba(255,46,94,.15);border-color:rgba(255,46,94,.9);box-shadow:0 0 2.2cqw rgba(255,46,94,.55),inset 0 0 1.8cqw rgba(255,46,94,.28);}
.st-btn.on i{opacity:1;}
body.in-game .orb{display:none;}
body.in-game{animation:none;}
#screen-game .pill,#screen-game .game-hint{backdrop-filter:none;-webkit-backdrop-filter:none;}

.comedy-col{display:flex;flex-direction:column;gap:4px;padding-top:14px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.comedy-col::-webkit-scrollbar{width:0;}
.comedy-btn{width:100%;min-height:44px;padding:4px 2px;border-radius:10px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.35);color:#fff;font-size:9px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:inherit;transition:filter .12s ease;text-align:center;line-height:1.15;overflow:hidden;}
.comedy-btn:active{filter:brightness(1.4);}
.comedy-btn:disabled{opacity:.35;cursor:not-allowed;}
.comedy-btn .cb-emoji{font-size:16px;line-height:1;}
.comedy-btn .cb-name{font-size:8px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.queue-badge{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9700;font-size:11px;font-weight:800;color:#fff;background:rgba(0,240,255,.85);border-radius:12px;padding:6px 12px;box-shadow:0 6px 20px rgba(0,240,255,.45);animation:bubbleIn .3s ease;}
.queue-badge.hidden{display:none;}

.tb-bubble{position:fixed;z-index:9700;padding:8px 14px;background:linear-gradient(135deg,rgba(255,46,154,.95),rgba(168,85,247,.9));color:#fff;border-radius:16px;font-size:13px;font-weight:900;box-shadow:0 8px 24px rgba(255,46,154,.5);pointer-events:none;animation:bubbleIn .3s cubic-bezier(.34,1.56,.64,1);max-width:80vw;}
.tb-bubble.bd{background:linear-gradient(135deg,rgba(255,46,94,.95),rgba(120,30,60,.95));}
.tb-bubble .tb-bubble-name{font-size:11px;opacity:.85;font-weight:800;}
.tb-bubble .tb-bubble-text{font-size:14px;margin-top:2px;}
@keyframes bubbleIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

.bd-overlay{position:fixed;inset:0;z-index:9800;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(255,46,94,.42),rgba(0,0,0,.9));animation:ovIn .3s ease-out;pointer-events:none;padding:20px;text-align:center;}
@keyframes ovIn{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
.bd-overlay .ov-icon{font-size:80px;animation:ovIconPulse .55s ease-in-out 3;filter:drop-shadow(0 0 30px rgba(255,46,94,.9));}
@keyframes ovIconPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(12deg)}}
.bd-overlay .ov-text{font-size:22px;font-weight:900;color:#fff;margin-top:12px;text-shadow:0 2px 14px rgba(255,46,94,.9);letter-spacing:1px;}
.bd-overlay .ov-victims{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px;}
.bd-overlay .ov-victim{font-size:20px;font-weight:900;color:#ffd166;background:rgba(255,46,94,.25);border:1.5px solid rgba(255,46,94,.6);padding:8px 16px;border-radius:14px;animation:ovNameIn .5s cubic-bezier(.34,1.56,.64,1) both;text-shadow:0 2px 8px rgba(0,0,0,.5);}
@keyframes ovNameIn{from{opacity:0;transform:translateY(24px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
.bd-overlay .ov-sub{font-size:13px;font-weight:800;color:#ff8fb5;margin-top:14px;opacity:.9;}

.vote-modal{position:fixed;inset:0;z-index:9750;display:flex;align-items:center;justify-content:center;background:rgba(6,2,14,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px;animation:fadein .3s ease;}
.vote-modal-inner{background:rgba(22,10,40,.96);border:1.5px solid rgba(168,85,247,.55);border-radius:22px;padding:20px 16px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(168,85,247,.4);}

@media (max-width: 640px){
  .orb.a{filter:blur(28px);width:170px;height:170px;opacity:.30;animation:none !important;}
  .orb.b{filter:blur(24px);width:150px;height:150px;opacity:.30;animation:none !important;}
  .card{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .pill, .game-hint{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  .logo{filter:drop-shadow(0 2px 14px rgba(255,46,154,.35));}
  body{background-size:200% 200%;animation-duration:30s;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  body{animation:none !important;background-size:100% 100% !important;}
}
body.tab-hidden *, body.tab-hidden *::before, body.tab-hidden *::after{animation-play-state:paused !important;}

<div id="app">

  <section id="screen-setup" class="screen">
    <div class="card">
      <h2 id="setup-title">إنشاء زعبل جديد</h2>
      <label for="inp-name">اسم الزعبول</label>
      <input id="inp-name" type="text" maxlength="14" placeholder="اكتب اسمك…" autocomplete="off" autocorrect="off" spellcheck="false">

      <input id="inp-pin" type="tel" inputmode="numeric" maxlength="5" placeholder="00000" autocomplete="off">

        <label>دور الهوست 👑</label>
        <div class="chip-row" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="setup-tab on" data-host="play" type="button" style="flex:1">هوست + لاعب</button>
          <button class="setup-tab" data-host="judge" type="button" style="flex:1">حكم فقط</button>
          <button class="setup-tab" data-host="auto" type="button" style="flex:1">أوتوماتيكي ⚡</button>
        </div>
        <div class="tiny" id="host-hint" style="margin-top:6px">هوست + لاعب: تتحكم يدوياً وتلعب كزعبول عادي.</div>
      </div>
      <label>اختر سيارتك</label>
      <div id="cars-grid" class="asset-grid cars"></div>
      <label>اختر هويتك</label>
      <div class="setup-tab-row">
        <button class="setup-tab on" data-idtab="avatar" type="button">😀 أفارت</button>
        <button class="setup-tab" data-idtab="sticker" type="button">🎨 ستيكر</button>
      </div>
      <div id="identity-grid" class="asset-grid"></div>
      <div class="stack" style="margin-top:18px">
        <button id="btn-submit" class="primary block">إنشاء الزعبل 🚀</button>
        <button id="btn-back" class="ghost block small">رجوع</button>
      </div>
    </div>
  </section>

  <section id="screen-lobby" class="screen">
    <div class="card">
      <div class="lobby-head">
        <div>
          <div class="pin-badge">رقم الزعبل: <span id="lobby-pin">-----</span></div>
          <div class="lobby-sub" id="lobby-sub"></div>
        </div>
        <button id="btn-leave" class="ghost small">خروج</button>
      </div>
      <div id="lobby-players" class="players-grid"></div>
      <div class="stack">
        <button id="btn-start-game" class="primary block hidden">ابدأ اللعبة 🚀</button>
        <div class="tiny">شارك رقم الزعبل مع أصحابك -- الحد الأقصى 20 زعبول</div>
      </div>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <div class="game-topbar">
      <div class="pill" id="game-round">جولة 1</div>
      <div class="pill" id="game-timer">--</div>

    </div>
    <div id="game-hint" class="game-hint hidden"></div>
    <div id="game-body"></div>
  </section>
</div>

/* ============================================================
   ASSET CACHE (IndexedDB)
   ============================================================ */
const AssetCache = {
  db:null,
  async init(){
    return new Promise(res=>{
      if(!window.indexedDB)return res();
      try{
        const r=indexedDB.open('zabola_assets_v3',1);
        r.onupgradeneeded=()=>{try{r.result.createObjectStore('blobs');}catch(e){}};
        r.onsuccess=()=>{this.db=r.result;res();};
        r.onerror=()=>res();
        r.onblocked=()=>res();
      }catch(e){res();}
    });
  },
  async get(id){
    if(!this.db)return null;
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('blobs','readonly');
        const rq=tx.objectStore('blobs').get(id);
        rq.onsuccess=()=>res(rq.result||null);
        rq.onerror=()=>res(null);
      }catch(e){res(null);}
    });
  },
  async set(id,blob){
    if(!this.db)return;
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('blobs','readwrite');
        tx.objectStore('blobs').put(blob,id);
        tx.oncomplete=()=>res();
        tx.onerror=()=>res();
      }catch(e){res();}
    });
  }
};

/* ============================================================
   COMEDY AUDIO + QUEUE
   ============================================================ */
const ComedyAudio = {
  audios:{},
  async preload(){
    await AssetCache.init();
    for(const s of COMEDY_SOUNDS){
      try{
        const cached = await AssetCache.get('snd_'+s.id);
        let url=null;
        if(cached) url=URL.createObjectURL(cached);
        else{
          try{
            const r=await fetch(s.url);
            if(r.ok){
              const b=await r.blob();
              await AssetCache.set('snd_'+s.id,b);
              url=URL.createObjectURL(b);
            }
          }catch(e){}
        }
        if(url){ const a=new Audio(url); a.preload='auto'; this.audios[s.id]=a; }
      }catch(e){ try{ const a=new Audio(s.url); a.preload='auto'; this.audios[s.id]=a; }catch(e2){} }
    }
  },
  play(id,onEnd){
    const a=this.audios[id];
    if(!a){ if(onEnd)onEnd(); return; }
    try{
      a.currentTime=0; let called=false;
      const done=()=>{ if(called)return; called=true; if(onEnd)onEnd(); };
      a.onended=done; a.onerror=done;
      const p=a.play();
      if(p&&p.catch)p.catch(()=>setTimeout(done,200));
      setTimeout(done,15000);
    }catch(e){ if(onEnd)onEnd(); }
  }
};

const ComedyQueue = {
  queue:[], playing:false, currentItem:null, onQueueChange:null, seenKeys:new Set(),
  enqueue(item){
    if(!item||!item.soundId)return;
    this.queue.push(item);
    this.queue.sort((a,b)=>(a.ts||0)-(b.ts||0));
    this.process();
    if(this.onQueueChange)this.onQueueChange();
  },
  process(){
    if(this.playing||this.queue.length===0)return;
    const next=this.queue.shift();
    this.playing=true; this.currentItem=next;
    if(this.onQueueChange)this.onQueueChange();
    ComedyAudio.play(next.soundId,()=>{
      this.playing=false; this.currentItem=null;
      if(this.onQueueChange)this.onQueueChange();
      this.process();
    });
  },
  waitForEnd(){
    return new Promise(res=>{
      if(!this.playing)return res();
      const t=setInterval(()=>{ if(!this.playing){clearInterval(t);res();} },100);
      setTimeout(()=>{clearInterval(t);res();},12000);
    });
  },
  clearPending(){ this.queue=[]; if(this.onQueueChange)this.onQueueChange(); },
  reset(){ this.clearPending(); this.currentItem=null; if(this.onQueueChange)this.onQueueChange(); },
  resetSeen(){ this.seenKeys.clear(); }
};

    const players=room.players||{};

    if(!uid){
      const keys=Object.keys(players);
      for(let i=0;i<keys.length;i++){

        if(p&&p.name===name&&!p.online){uid=keys[i];break;}
      }

    if(!uid){
      if(room.kicked&&room.kicked[name])throw new Error('KICKED');
      const keys=Object.keys(players);
      if(keys.length>=MAX_PLAYERS)throw new Error('FULL');

        if(players[keys[i]]&&players[keys[i]].name===name)throw new Error('NAME_TAKEN');

        if(players[keys[i]]&&players[keys[i]].carId===carId)throw new Error('CAR_TAKEN');
      }

        if(players[keys[i]]&&players[keys[i]].identityId===identityId)throw new Error('IDENTITY_TAKEN');
      }
      if(room.status!=='lobby')throw new Error('STARTED');
      uid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
      const now=Date.now();
      await db.ref('rooms/'+pin+'/players/'+uid).set({
        name,carId,identityId,identityType,
        cumulative:0,score:0,pos:0,
        isHost:false,online:true,joinedAt:now,lastSeen:now
      });
      await db.ref('rooms/'+pin).update({lastActivity:now});
      localStorage.setItem('zab_uid_'+pin,uid);
      return uid;
    }
    await db.ref('rooms/'+pin+'/players/'+uid).update({online:true,lastSeen:Date.now()});

    App.pin=pin; App.uid=uid;

    if(!App.room||!App.pin)return;

    if(!host)return;
    const lastSeen=host.lastSeen||host.joinedAt||0;
    if(Date.now()-lastSeen<HOST_TIMEOUT_MS)return;
    const cands=Object.keys(room.players).filter(u=>u!==room.hostId&&room.players[u].online).map(u=>({uid:u,joinedAt:room.players[u].joinedAt||0})).sort((a,b)=>a.joinedAt-b.joinedAt);

  return Object.keys(room.players||{}).map(k=>Object.assign({id:k},room.players[k])).sort((a,b)=>(b.score||0)-(a.score||0)||(a.joinedAt||0)-(b.joinedAt||0));

function setupComedyListener(pin){
  try{
    const r=db.ref('rooms/'+pin+'/game/comedySounds');
    r.on('child_added',s=>{
      const d=s.val();
      if(!d||!d.uid||!d.soundId||!d.ts)return;
      if(Date.now()-d.ts>15000)return;
      const key=d.uid+'_'+d.ts;
      if(ComedyQueue.seenKeys.has(key))return;
      ComedyQueue.seenKeys.add(key);
      if(App.muted[d.uid])return;
      ComedyQueue.enqueue({uid:d.uid,soundId:d.soundId,ts:d.ts});
    });
  }catch(e){}
}

  async hostResolve(){
    if(!App.isHost||!App.room||!App.room.game)return;  /* FIX: check isHost */
    if(BaiDonGame.resolveBusy)return;
    BaiDonGame.resolveBusy=true;
    try{
      const room=App.room, g=room.game;
      if(g.phase!=='action')return;
      const actions=Object.assign({},g.actions||{});
      const bdId=g.baiDonId;
      const bdRev=!!g.baiDonRevealed;
      const ps=JSON.parse(JSON.stringify(g.playerState||{}));
      const target=g.target||20;
      const round=g.round||1;
      Object.keys(ps).forEach(u=>{const p=ps[u]; if(!p||p.frozen>0)return; if(room.hostMode==='judge'&&u===room.hostId)return; if(actions[u]&&actions[u].ts)return; if(u===bdId&&bdRev)return; actions[u]={ts:Date.now(),moveStation:1,auto:true};});

      /* Save OLD positions for animation */
      const oldPositions={};
      Object.keys(ps).forEach(uid=>{oldPositions[uid]=ps[uid].pos;});

      const events=[];
      const hitThisRound={};
      const blockedStations=[];
      const bdAct=actions[bdId];
      const wantDisguise=!!(bdAct&&bdAct.disguise);

      /* Determine block stations */
      let effectiveBlock=null, botUsed=false;
      if(!bdAct||(!bdAct.blockStation&&!wantDisguise)){
        const cs=[]; for(let i=1;i<=3;i++){ if(!(bdAct&&bdAct.moveStation===i))cs.push(i); }
        effectiveBlock=cs[Math.floor(Math.random()*cs.length)]; botUsed=true;
      }else{
        effectiveBlock=bdAct.blockStation;
      }
      if(effectiveBlock)blockedStations.push(effectiveBlock);
      if(bdRev&&g.blockCount===2&&bdAct){
        const all=[];for(let i=1;i<=3;i++)all.push(i);
        const second=all.find(s=>s!==effectiveBlock);
        if(second)blockedStations.push(second);
      }

      /* Phase 1: Decrement freeze */
      Object.keys(ps).forEach(uid=>{
        const p=ps[uid];
        if(!p)return;
        if(p.frozen>0){
          p._wasFrozen=true;
          p.frozen-=1;
          if(p.frozen>0)events.push({type:'stillFrozen',uid});
        }
      });

      /* Phase 2: Apply hits/moves */
      Object.keys(actions).forEach(uid=>{
        const p=ps[uid];
        if(!p||p._wasFrozen)return;
        const a=actions[uid];
        if(!a)return;
        const mySt=a.moveStation;
        const isHit=mySt&&blockedStations.includes(mySt);
        if(isHit){
          hitThisRound[uid]=true;
          p.pos=Math.max(0,p.pos-1);
          const isBdDisguise = wantDisguise && uid===bdId;
          events.push({type:'hit',uid,station:mySt,disguise:isBdDisguise});
          const gap=p.lastHitRound?(round-p.lastHitRound):999;
          if(gap<=3){
            p.frozen=(p.frozen||0)+1;
            events.push({type:'freeze',uid});
            p.lastHitRound=0;
          }else{
            p.lastHitRound=round;
          }
        }else if(mySt){
          p.pos=Math.min(target,p.pos+mySt);
          events.push({type:'move',uid,station:mySt,from:p.pos-mySt,to:p.pos});
        }
      });

      /* Phase 3: Revealed BaiDon auto +1 ALWAYS */
      const bdP=ps[bdId];
      if(bdRev&&bdP&&!bdP._wasFrozen){
        bdP.pos=Math.min(target,bdP.pos+1);
        events.push({type:'autoMove',uid:bdId,to:bdP.pos});
      }

      Object.keys(ps).forEach(uid=>{if(ps[uid])delete ps[uid]._wasFrozen;});

      /* Win check */
      let winner=null,winnerName='',finalMessage='';
      const winners=Object.keys(ps).filter(uid=>ps[uid].pos>=target);
      if(winners.length>0){
        if(winners.includes(bdId)){
          winner='baidon';
          winnerName=room.players[bdId]?room.players[bdId].name:'';
          finalMessage='🎭 البيدون '+winnerName+' وصل النهاية وفاز!';
        }else{
          winner='runner';
          winnerName=room.players[winners[0]]?room.players[winners[0]].name:'';
          finalMessage='🏆 الزعبول السالك '+winnerName+' وصل النهاية وفاز!';
        }
      }

      /* Save NEW positions */
      const newPositions={};
      Object.keys(ps).forEach(uid=>{newPositions[uid]=ps[uid].pos;});

      const u={
        lastActivity:Date.now(),
        'game/actions':null,
        'game/comedySounds':null,
        'game/lastResult':{
          events,round,blockedStations,botUsed,winUid:(winners.length?(winners.includes(bdId)?bdId:winners[0]):null),winName:winnerName,winType:winner||null,
          oldPositions,newPositions,
          animStartTs:Date.now()
        }
      };
      Object.keys(ps).forEach(uid=>{
        u['game/playerState/'+uid+'/pos']=ps[uid].pos;
        u['game/playerState/'+uid+'/frozen']=ps[uid].frozen;
        u['game/playerState/'+uid+'/lastHitRound']=ps[uid].lastHitRound;
        u['players/'+uid+'/score']=ps[uid].pos;
        u['players/'+uid+'/pos']=ps[uid].pos;
      });
      if(winner){
        u['game/phase']='racing';
        u['game/winner']=winner;
        u['game/winnerName']=winnerName;
        u['game/finalMessage']=finalMessage;
        if(winner==='baidon')u['players/'+bdId+'/cumulative']=(room.players[bdId].cumulative||0)+100;
        else u['players/'+winners[0]+'/cumulative']=(room.players[winners[0]].cumulative||0)+100;
      }else{
        u['game/phase']='racing';
      }
      await App.roomRef.update(u);
    }catch(e){
      console.error(e);
      toast('مشكلة','err');
    }finally{
      setTimeout(()=>{BaiDonGame.resolveBusy=false;},500);
    }
  },

  pickBd(c){ let pool=c.filter(x=>x!==App._lastBd); if(!pool.length)pool=c; const a=new Uint32Array(1); crypto.getRandomValues(a); const r=pool[a[0]%pool.length]; App._lastBd=r; return r; },

  _runRaceAnimation(room,g){
    const S=BaiDonGame, key=room.pin+'_'+g.round;
    const lr=g.lastResult||{}, oldPos=lr.oldPositions||{}, newPos=lr.newPositions||{}, blocked=lr.blockedStations||[], events=lr.events||[];
    const target=g.target||20, maxNum=3;
    const showBtn=()=>{ const b=$('race-next-btn'); if(b)b.style.display='block'; };
    if(S._animKey===key){ if(S._animDone===key)showBtn(); return; }
    S._animKey=key; S._animDone=null;
    setTimeout(()=>{ if(S._animKey===key)showBtn(); },20000);
    (async()=>{
      try{
        const say=t=>{ const e=$('bd-timer-text'); if(e)e.textContent=t; };
        const acts=events.filter(e=>(e.type==='move'||e.type==='hit')&&e.station);
        const cnt={}, dest={}, start={}, W={};
        acts.forEach(e=>{ const j=cnt[e.station]=(cnt[e.station]||0); cnt[e.station]++; dest[e.uid]=[PD[e.station]+(j%3)*18,SY[e.station]+Math.floor(j/3)*24-10]; start[e.uid]=S._xy(e.uid,oldPos[e.uid]||0,room,target); });
        const mk=uid=>{ const s=document.querySelector('.road-scene'); if(!s)return null; let w=W[uid]; if(w&&w.isConnected)return w; const p=room.players[uid]; if(!p)return null;
          w=el('div','walker',identityHtml(p.identityId,'')); w.style.left=PX(start[uid][0]); w.style.top=PY(start[uid][1]); s.appendChild(w); w.offsetHeight; W[uid]=w; return w; };
        const walk=async(fa,fb)=>{ for(let k=1;k<=3;k++){ acts.forEach(e=>{ const w=mk(e.uid); if(!w)return; const a=fa(e.uid), b=fb(e.uid); w.style.left=PX(a[0]+(b[0]-a[0])*k/3); w.style.top=PY(a[1]+(b[1]-a[1])*k/3); }); SFX.step(); await delay(650); } };
        const setId=v=>acts.forEach(e=>{ const t=S._carTokens[e.uid]; const d=t&&t.querySelector('.car-identity'); if(d)d.style.visibility=v; });
        say('⚡ الزعابيل رايحين محطات الطاقة…');
        await delay(900);
        setId('hidden');
        await walk(u=>start[u],u=>dest[u]);
        await delay(500);
        for(let i=1;i<=maxNum;i++){
          const z=document.querySelector('.st-zone[data-station="'+i+'"]'); if(!z)continue;
          const bad=blocked.includes(i);
          z.classList.add(bad?'fail':'success');
          say(bad?'🔒 محطة '+i+' مقفولة! تم الخصم من كارت الطاقة (-1)':'⚡ محطة '+i+' مفتوحة! تم شحن كارت الطاقة +'+i);
          if(bad)SFX.stationFail(); else SFX.stationSuccess();
          await delay(1300);
        }
        const hits=events.filter(e=>e.type==='hit');
        if(hits.length&&!S._overlayShown[g.round]){ S._overlayShown[g.round]=true; showBidonOverlay(hits,room); await delay(2800); }
        say('🏎️ الرجوع للسيارات…');
        await walk(u=>dest[u],u=>start[u]);
        Object.keys(W).forEach(u=>{ if(W[u].parentNode)W[u].parentNode.removeChild(W[u]); });
        setId('visible');
        say('🏁 السيارات بتتحرك…');
        if(events.some(e=>e.type==='move'))SFX.engineFwd();
        if(events.some(e=>e.type==='hit'))SFX.engineRev();
        Object.keys(newPos).forEach(u=>{ S._animDisplayPos[u]=newPos[u]; const t=S._carTokens[u]; if(t)S.placeCar(t,newPos[u],t._idx,t._n,target); });
        await delay(2200);
        const wu=lr.winUid;
        if(wu&&S._carTokens[wu]){
          const t=S._carTokens[wu], sc=document.querySelector('.road-scene');
          if(sc){
            S.placeCar(t,target,t._idx,t._n,target,1268); await delay(2300);
            SFX.win();
            for(let k=0;k<28;k++){ const c=el('div','confetti',['🎉','🎊','✨','⭐'][k%4]); c.style.left=(Math.random()*94+3)+'%'; c.style.animationDelay=(Math.random()*0.8)+'s'; sc.appendChild(c); }
            const pw=room.players[wu]; sc.appendChild(el('div','win-banner',(lr.winType==='baidon'?'🎭 البيدون ':'🏆 ')+esc(pw?pw.name:'')+' كسب!'));
            await delay(3500);
          }
        }
        say('النتيجة');
      }catch(e){ console.error(e); }
      S._animDone=key; showBtn();
    })();
  },

  getRunnerSoundsForUid(room,g,uid){
    const events=(g.lastResult&&g.lastResult.events)||[];
    const ps=(g.playerState&&g.playerState[uid])||{};
    const round=g.round||1;
    const vr=g.voteResult||{};
    const result=[];
    const gotHit=events.some(e=>e.type==='hit'&&e.uid===uid);
    const moved=events.some(e=>e.type==='move'&&e.uid===uid);
    const myVote=vr.votes&&vr.votes[uid];
    const voteWrong=vr&&!vr.tie&&myVote&&myVote!==g.baiDonId;
    const voteRight=vr&&!vr.tie&&vr.wasBaiDon;
    if(gotHit||voteWrong){result.push({id:'ah_ana_hmar'},{id:'ana_hmar'},{id:'ezay'},{id:'ya_bni_haram'},{id:'awsakh'});}
    if(moved||voteRight){result.push({id:'edaah'});}
    if(round<=3){
      const used=(g.comedyUsed&&g.comedyUsed[uid]&&g.comedyUsed[uid].ank_lmeet)||false;
      if(!used)result.push({id:'ank_lmeet'});
    }
    if(vr&&!vr.tie&&vr.wasBaiDon)result.push({id:'hatouly'});
    if(vr&&!vr.tie&&!vr.wasBaiDon)result.push({id:'ehna_bhayem'});
    return result;
  },

  getAvailableSounds(room,g,uid){
    const ps=(g.playerState&&g.playerState[uid])||{};
    const isBd=(g.baiDonId===uid);
    const isRev=!!g.baiDonRevealed;
    const out=[];
    if(isBd){
      const events=(g.lastResult&&g.lastResult.events)||[];
      const hitSome=events.some(e=>e.type==='hit'&&!e.disguise&&e.uid!==uid);
      if(hitSome){out.push({id:'bala_seyah'},{id:'da_anto_lakta'});}
      out.push({id:'salam'});
    }
    BaiDonGame.getRunnerSoundsForUid(room,g,uid).forEach(s=>out.push(s));
    const seen=new Set();
    return out.filter(s=>{if(seen.has(s.id))return false; seen.add(s.id); return true;});
  }
};

function showBidonOverlay(hits,room){
  const html=hits.map((ev,i)=>{
    const v=room.players[ev.uid];
    if(!v)return '';
    return '<div class="ov-victim" style="animation-delay:'+(0.3+i*0.15)+'s">'+identityHtml(v.identityId,'')+' '+esc(v.name)+'</div>';
  }).join('');
  const o=el('div','bd-overlay'); o.style.setProperty('--vs',(hits.length>12?11:hits.length>8?13:hits.length>5?16:20)+'px');
  o.innerHTML='<div class="ov-icon">💥</div><div class="ov-text">البيدون أوقع!</div><div class="ov-victims">'+html+'</div><div class="ov-sub">ضربة قاسية! 💀</div>';
  document.body.appendChild(o);
  SFX.baiDonHit();
  setTimeout(()=>{if(o.parentNode)o.parentNode.removeChild(o);},2700);
}

function buildSigGame(g){
  const out=Object.assign({},g);
  delete out.comedySounds;
  return out;
}
function buildSigPlayers(room){
  const out={};
  Object.keys(room.players||{}).forEach(uid=>{
    const p=room.players[uid];
    out[uid]={name:p.name,carId:p.carId,identityId:p.identityId,joinedAt:p.joinedAt,cumulative:p.cumulative||0};
  });
  return out;
}

function render(){
  const room=App.room;
  if(!room)return;
  if(room.status==='lobby'||!room.game||room.game.phase==='idle'){
    showScreen('lobby'); renderLobby();
  }else{
    showScreen('game'); renderGame();
  }
  updateGameHint();
}

function renderLobby(){
  const room=App.room;
  $('lobby-pin').textContent=App.pin||'-----';
  const players=getJoinedPlayers(room);
  $('lobby-sub').textContent='الزعابيل: '+players.length+'/'+MAX_PLAYERS;
  const grid=$('lobby-players');
  let html='';
  players.forEach(p=>{
    html+='<div class="pcard'+(p.online?'':' off')+'">';
    if(App.isHost&&p.id!==App.uid)html+='<button class="kick" data-kick="'+p.id+'" type="button">✕</button>';
    html+='<div class="pava">'+identityHtml(p.identityId,'')+'</div>';
    html+='<div class="pname">'+esc(p.name)+'</div>';
    if(p.id===room.hostId)html+='<div class="host-tag">هوست 👑</div>';
    if(!p.online)html+='<div class="off-tag">غير متصل</div>';
    html+='</div>';
  });
  grid.innerHTML=html;
  const btn=$('btn-start-game');
  if(App.isHost){
    btn.classList.remove('hidden');
    if(players.length<MIN_PLAYERS){btn.disabled=true; btn.textContent='محتاجين '+(MIN_PLAYERS-players.length)+' كمان…';}
    else{btn.disabled=false; btn.textContent='ابدأ اللعبة 🚀';}
  }else{btn.classList.add('hidden');}
}

function renderGame(){
  const room=App.room;
  const g=room.game||{};
  const phase=g.phase||'action';
  const round=g.round||1;
  $('game-round').textContent='جولة '+round;
  const me=room.players[App.uid];
  const myPs=(g.playerState||{})[App.uid]||{};
  const fTag=myPs.frozen>0?' ❄️':'';
  $('game-score').textContent='تقدمك: '+(me?(me.pos||0):0)+fTag;

  let sig;
  const sigG=buildSigGame(g);
  const sigP=buildSigPlayers(room);

  if(phase==='action'){
    const a=(g.actions||{})[App.uid];
    const sub=!!(a&&a.ts);
    sig='act:'+round+':'+(g.baiDonRevealed?1:0)+':'+(sub?1:0)+':'+(myPs.frozen||0);
  }else if(phase==='intro'){
    const ready=!!(g.introReady&&g.introReady[App.uid]);
    sig='intro:'+(ready?1:0)+':'+Object.keys(g.introReady||{}).length;
  }else if(phase==='racing'){
    /* Racing uses only lastResult - don't re-render if sig same */
    sig='racing:'+round+':'+(g.lastResult&&g.lastResult.animStartTs||0);
  }else{
    sig=phase+':'+JSON.stringify(sigG)+':'+JSON.stringify(sigP);
  }
  if(App.sig===sig)return;
  App.sig=sig;

  const body=$('game-body');
  body.innerHTML='';
  body.appendChild(BaiDonGame.build(room,g,phase,round));
  document.body.classList.toggle('race-fixed',phase==='action'||phase==='racing');
}

function updateGameHint(){
  const bar=$('game-hint');
  if(!bar)return;
  const room=App.room;
  if(!room||room.status!=='playing'){bar.classList.add('hidden');return;}
  const g=room.game||{};
  const phase=g.phase;
  let hint='';
  const amBd=(g.baiDonId===App.uid);
  const isRev=!!g.baiDonRevealed;
  const ps=g.playerState||{};
  const me=ps[App.uid]||{};
  if(me.frozen>0){hint='❄️ أنت متجمد الجولة دي';}
  else if(phase==='intro'){hint='لا تفصح عن هويتك 🤫';}
  else if(phase==='action'){
    if(amBd&&!isRev)hint='اختار محطة طاقة تتقدم بيها ومحطة تقفلها (لازم يختلفوا) -- أو فعّل التمويه';
    else if(amBd&&isRev)hint='أنت مكشوف! بتتحرك تلقائي +1، اختار محطة تقفلها';
    else hint='اختار محطة طاقة، وخد بالك من المحطة المقفولة! (مفتوحة = تشحن كارت الطاقة)';
  }
  else if(phase==='vote'){hint='صوّت بحكمة! لو غلط، البيدون هيعطل محطتين';}
  else if(phase==='racing'){hint='شوف النتايج.. مين اتصاب؟';}
  else if(phase==='final'){hint='النهاية!';}
  if(hint){bar.textContent=hint; bar.classList.remove('hidden');}
  else{bar.classList.add('hidden');}
}

/* ============================================================
   GLOBAL TIMER
   ============================================================ */
setInterval(()=>{
  const room=App.room;
  if(!room||!room.game)return;
  const g=room.game;
  const timerPill=$('game-timer');
  if(App.isHost&&g.phase==='intro'){const rd=g.introReady||{};const on=Object.keys(room.players||{}).filter(u=>room.players[u].online);if(on.length&&on.every(u=>rd[u])&&!BaiDonGame._starting){BaiDonGame._starting=true;BaiDonGame.hostStartAction().finally(()=>setTimeout(()=>{BaiDonGame._starting=false;},1500));}}

  if(g.phase==='action'&&g.timerEnd){
    const leftMs=g.timerEnd-Date.now();
    const left=Math.max(0,Math.ceil(leftMs/1000));
    if(timerPill&&timerPill.getAttribute('data-val')!==String(left)){
      timerPill.textContent='⏱ '+left+'ث';
      timerPill.setAttribute('data-val',String(left));
    }
    const dgb=$('disg-btn'); if(dgb)dgb.classList.toggle('blink',left<=8&&left>0);
    const txtEl=$('bd-timer-text');
    if(txtEl&&txtEl.getAttribute('data-val')!==String(left)){
      txtEl.textContent='⏱ '+left;
      txtEl.setAttribute('data-val',String(left));
    }
    /* Early resolve - HOST ONLY */
    if(App.isHost){
      const ps=g.playerState||{};
      const actions=g.actions||{};
      const needed=Object.keys(ps).filter(uid=>{
        const p=ps[uid];
        if(!p||p.frozen>0)return false;
        if(room.hostMode==='judge'&&uid===room.hostId)return false;
        return true;
      });
      const done=needed.filter(uid=>actions[uid]&&actions[uid].ts).length;
      if(needed.length>0&&done>=needed.length&&leftMs>800){BaiDonGame.hostResolve();}
      if(leftMs<=0)BaiDonGame.hostResolve();
    }
  }else{
    if(timerPill&&g.phase!=='action'){timerPill.textContent='--'; timerPill.removeAttribute('data-val');}
  }
},1000);

/* ============================================================
   SETUP + BINDING + BOOT
   ============================================================ */
let selectedCarId='', selectedIdentityId='', currentIdTab='avatar';

function buildAssetGrids(){
  const carGrid=$('cars-grid');
  carGrid.innerHTML='';
  CARS.forEach(car=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='asset-tile';
    b.dataset.carId=car.id; if(car.id===selectedCarId)b.classList.add('sel');
    if(car.url)b.innerHTML='<img src="'+esc(car.url)+'" alt="">';
    else b.textContent='🚗';
    b.onclick=()=>{
      carGrid.querySelectorAll('.asset-tile').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      selectedCarId=car.id;
    };
    carGrid.appendChild(b);
  });
  const idGrid=$('identity-grid');
  idGrid.innerHTML='';
  if(currentIdTab==='avatar'){
    AVATARS.forEach(a=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='asset-tile';
      b.dataset.idId=a.id; if(a.id===selectedIdentityId)b.classList.add('sel');
      b.textContent=a.emoji;
      b.onclick=()=>{
        idGrid.querySelectorAll('.asset-tile').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        selectedIdentityId=a.id;
      };
      idGrid.appendChild(b);
    });
  }else{
    STICKERS.forEach(st=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='asset-tile';
      b.dataset.idId='sticker_'+st.id; if(('sticker_'+st.id)===selectedIdentityId)b.classList.add('sel');
      if(st.url)b.innerHTML='<img src="'+esc(st.url)+'" alt="">';
      else b.textContent='🎨';
      b.onclick=()=>{
        idGrid.querySelectorAll('.asset-tile').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        selectedIdentityId='sticker_'+st.id;
      };
      idGrid.appendChild(b);
    });
  }
}

function openSetup(mode){
  App.flowMode=mode;
  $('setup-title').textContent=(mode==='create')?'إنشاء زعبل جديد':'دخول زعبل موجود';
  $('btn-submit').textContent=(mode==='create')?'إنشاء الزعبل 🚀':'دخول الزعبل 🚪';
  $('host-opts').classList.toggle('hidden',mode!=='create');
  $('inp-name').value='';
  $('inp-pin').value='';
  showScreen('setup');
}

function showHomeChoice(){
  const old=document.getElementById('home-choice');
  if(old)old.remove();
  const c=el('div','card');
  c.id='home-choice';
  c.innerHTML='<h3 class="center">البيدون 🎭</h3>'+
    '<div class="stack" style="margin-top:12px">'+
      '<button class="primary block" id="pick-create" type="button">إنشاء زعبل جديد 🎉</button>'+
      '<button class="secondary block" id="pick-join" type="button">دخول زعبل موجود 🚪</button>'+
      '<button class="ghost block small" id="pick-cancel" type="button">إلغاء</button>'+
    '</div>';
  $('screen-home').appendChild(c);
  $('pick-create').onclick=()=>{c.remove(); openSetup('create');};
  $('pick-join').onclick=()=>{c.remove(); openSetup('join');};
  $('pick-cancel').onclick=()=>c.remove();
}

async function submitSetup(){
  const name=$('inp-name').value.trim();
  const pin=$('inp-pin').value.trim();
  if(name.length<2){toast('اكتب اسم من حرفين','err');return;}
  if(!/^\d{5}$/.test(pin)){toast('الرقم السري لازم 5 أرقام','err');return;}
  if(!selectedCarId){toast('اختر سيارة','err');return;}
  if(!selectedIdentityId){toast('اختر أفاتار أو ستيكر','err');return;}
  safeBlur($('inp-name')); safeBlur($('inp-pin'));
  showLoading('جاري الدخول... ⏳');
  try{
    let uid;
    if(App.flowMode==='create'){uid=await Core.createRoom(pin,name,selectedCarId,selectedIdentityId,currentIdTab,App.hostMode);}
    else{uid=await Core.joinRoom(pin,name,selectedCarId,selectedIdentityId,currentIdTab);}
    hideLoading();
    App.name=name; App.carId=selectedCarId; App.identityId=selectedIdentityId;
    Core.attach(pin,uid);
    App.sig='';
  }catch(err){
    hideLoading();
    const code=err&&err.message;
    if(code==='PIN_TAKEN')toast('الرقم السري مستخدم','err');
    else if(code==='NO_ROOM')toast('مفيش زعبل بالرقم ده','err');
    else if(code==='FULL')toast('الزعبل مليان','err');
    else if(code==='NAME_TAKEN')toast('الاسم موجود','err');
    else if(code==='CAR_TAKEN')toast('السيارة متاخدة','err');
    else if(code==='IDENTITY_TAKEN')toast('الأفاتار/الستيكر متاخد','err');
    else if(code==='STARTED')toast('اللعبة بدأت خلاص','err');
    else if(code==='KICKED')toast('أنت مطرود','err');
    else toast('مشكلة في الاتصال','err');
  }
}

function bindEvents(){
  $('card-baidon').onclick=showHomeChoice;
  $('btn-back').onclick=()=>{showScreen('home'); const c=document.getElementById('home-choice'); if(c)c.remove();};
  $('btn-submit').onclick=submitSetup;
  onEnter($('inp-name'),()=>$('inp-pin').focus());
  onEnter($('inp-pin'),submitSetup);
  $('inp-pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,5);});

  document.querySelectorAll('#host-opts .setup-tab').forEach(tab=>{
    tab.onclick=()=>{
      document.querySelectorAll('#host-opts .setup-tab').forEach(t=>t.classList.remove('on'));
      tab.classList.add('on');
      App.hostMode=tab.getAttribute('data-host');
      const hints={play:'هوست + لاعب: تتحكم يدوياً وتلعب كزعبول.',judge:'حكم فقط: متلعبش.',auto:'أوتوماتيكي.'};
      $('host-hint').textContent=hints[App.hostMode]||'';
    };
  });

  document.querySelectorAll('.setup-tab-row .setup-tab').forEach(tab=>{
    tab.onclick=()=>{
      document.querySelectorAll('.setup-tab-row .setup-tab').forEach(t=>t.classList.remove('on'));
      tab.classList.add('on');
      currentIdTab=tab.getAttribute('data-idtab');
      selectedIdentityId='';
      buildAssetGrids();
    };
  });

  $('btn-leave').onclick=()=>Core.leave();
  $('btn-start-game').onclick=()=>BaiDonGame.hostStart();

  $('lobby-players').addEventListener('click',function(e){
    let node=e.target;
    while(node&&node!==this&&!(node.getAttribute&&node.getAttribute('data-kick')))node=node.parentNode;
    if(node&&node!==this&&node.getAttribute){
      const pid=node.getAttribute('data-kick');
      if(pid)Core.kick(pid);
    }
  });

  window.addEventListener('pagehide',()=>{
    try{if(App.roomRef&&App.uid)App.roomRef.child('players/'+App.uid).update({online:false});}catch(e){}
  });
  document.addEventListener('visibilitychange',()=>{
    document.body.classList.toggle('tab-hidden',document.hidden);
  });
  document.addEventListener('pointerdown',()=>SFX._init(),{once:true});
  document.addEventListener('touchstart',()=>SFX._init(),{once:true});
}

(async function boot(){
  App._comedyCooldownUntil=0;
  buildAssetGrids();
  bindEvents();
  showScreen('home');
  showLoading('جاري الاتصال... ⏳');
  try{
    await initFirebase();
    hideLoading();
    Core.sweepOldRooms();
    ComedyAudio.preload().catch(()=>{});
  }catch(err){
    hideLoading();
    toast('فشل الاتصال بالسيرفر ⚠️','err');
  }
})();
</script>
