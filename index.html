  // ---------- ACTION ----------
  uiAction(wrap, room, g, round, isHost, amBaiDon, isRevealed, isEliminated, isFrozen){
    const myAction = (g.actions || {})[App.uid];
    const submitted = !!(myAction && myAction.ts);
    const amJudge = (App.uid === room.hostId && room.hostMode === 'judge');
    const myPs = (g.playerState || {})[App.uid];
    const canAffordDisguise = myPs && myPs.hearts > 1;

    let titleText = 'الجولة ' + round;
    if (isEliminated) titleText = 'أنت خارج اللعبة 👻';
    else if (amBaiDon && isRevealed) titleText = 'الجولة ' + round + ' - أنت Turret! 🎭';
    else if (amBaiDon) titleText = 'الجولة ' + round + ' - أنت البيدون! 🎭';
    wrap.appendChild(el('h3', 'phase-title', titleText));

    wrap.appendChild(BaiDonGame.buildTrack(room, g));

    const timerText = el('div', 'timer-big'); timerText.id = 'bd-timer-text';
    timerText.textContent = '--';
    wrap.appendChild(timerText);

    if (isEliminated){
      const spec = el('div', 'spectator-box');
      spec.innerHTML = '👻 أنت خارج اللعبة<br><span style="font-size:12px;opacity:.8">بتتفرج بس -- استنى الجولة الجاية عشان ترجع تلعب</span>';
      wrap.appendChild(spec);
    } else if (isFrozen){
      const fb = el('div', 'frozen-box');
      fb.innerHTML = '❄️ أنت متجمد الجولة دي!<br><span style="font-size:12px;opacity:.85">هتقف جولة كاملة من غير أي أكشن -- البيدون جمدك 😬</span>';
      wrap.appendChild(fb);
    } else if (amJudge){
      wrap.appendChild(el('div', 'waiting', 'أنت الحكم 👨‍⚖️ -- متابع فقط'));
    } else if (submitted){
      wrap.appendChild(el('div', 'ok-box', '✅ تم إرسال حركتك -- في انتظار الباقي…'));
    } else {
      // Move selection
      let selMove = null;
      let moveRow = null;
      if (!(amBaiDon && isRevealed)){
        wrap.appendChild(el('div', 'q-label', amBaiDon ? 'حركتك (تمويه):' : 'حركتك (تقدمك):'));
        moveRow = el('div', 'chip-row');
        for (let n = 1; n <= g.maxNum; n++){
          const b = el('button', 'num-chip', String(n));
          b.type = 'button'; b.dataset.move = n;
          b.onclick = function(){
            if (b.disabled) return;
            moveRow.querySelectorAll('.num-chip').forEach(function(c){ c.classList.remove('on'); });
            b.classList.add('on'); selMove = n;
            if (window._bdUpdateSubmit) window._bdUpdateSubmit();
          };
          moveRow.appendChild(b);
        }
        wrap.appendChild(moveRow);
      }

      // Attack selection (only baiDon/turret)
      let selAttack = null;
      let atkRow = null;
      if (amBaiDon){
        wrap.appendChild(el('div', 'q-label', 'رقم الهجوم (توقع رقم الزعبول):'));
        atkRow = el('div', 'chip-row');
        for (let n = 1; n <= g.maxNum; n++){
          const b = el('button', 'num-chip attack', String(n));
          b.type = 'button'; b.dataset.attack = n;
          b.onclick = function(){
            atkRow.querySelectorAll('.num-chip').forEach(function(c){ c.classList.remove('on'); });
            b.classList.add('on'); selAttack = n;
            if (window._bdUpdateSubmit) window._bdUpdateSubmit();
          };
          atkRow.appendChild(b);
        }
        wrap.appendChild(atkRow);

        // Disguise toggle
        if (!isRevealed && canAffordDisguise){
          let disguiseOn = false;
          const disRow = el('div', 'chip-row');
          const disBtn = el('button', 'chip disguise-chip', '🎭 تمويه (تفقد قلب)');
          disBtn.type = 'button';
          const noteEl = el('div', 'tiny hidden');
          noteEl.id = 'bd-disguise-note';
          noteEl.style.color = '#ffb020';
          noteEl.style.fontWeight = '900';
          noteEl.textContent = '🚫 التمويه شغّال — مش هتتحرك الجولة دي (لازم تبان كأنك اتضربت)';
          disBtn.onclick = function(){
            disguiseOn = !disguiseOn;
            disBtn.classList.toggle('on', disguiseOn);
            disBtn.textContent = disguiseOn ? '🎭 تمويه مُفعّل ✓' : '🎭 تمويه (تفقد قلب)';
            noteEl.classList.toggle('hidden', !disguiseOn);
            if (disguiseOn){
              // Clear move selection + disable move chips
              if (moveRow){
                moveRow.querySelectorAll('.num-chip').forEach(function(c){
                  c.classList.remove('on'); c.disabled = true; c.style.opacity = '0.35';
                });
              }
              selMove = null;
            } else {
              if (moveRow){
                moveRow.querySelectorAll('.num-chip').forEach(function(c){
                  c.disabled = false; c.style.opacity = '1';
                });
              }
            }
            if (window._bdUpdateSubmit) window._bdUpdateSubmit();
          };
          disRow.appendChild(disBtn);
          wrap.appendChild(disRow);
          wrap.appendChild(noteEl);
          wrap.appendChild(el('div', 'tiny', 'التمويه: هتظهر إنك اتضربت واسمك هيظهر في الضحايا — هتخسر قلب حقيقي. الفرصة دي بتخلي الشك بعيد عنك.'));
          window._bdSelDisguise = function(){ return disguiseOn; };
        } else {
          window._bdSelDisguise = function(){ return false; };
        }

        window._bdSelAttack = function(){ return selAttack; };
      }

      // Submit
      const submitBtn = el('button', 'primary block', 'إرسال ✅');
      submitBtn.disabled = true;
      const updateSubmitState = function(){
        const disguising = amBaiDon && !isRevealed && (window._bdSelDisguise && window._bdSelDisguise());
        const needsMove = !(amBaiDon && isRevealed) && !disguising;
        const moveOk = !needsMove || !!selMove;
        const attackOk = !amBaiDon || !!selAttack;
        submitBtn.disabled = !(moveOk && attackOk);
      };
      window._bdUpdateSubmit = updateSubmitState;
      window._bdSelMove = function(){ return selMove; };

      submitBtn.onclick = function(){
        const disguising = amBaiDon && !isRevealed && (window._bdSelDisguise && window._bdSelDisguise());
        const needsMove = !(amBaiDon && isRevealed) && !disguising;
        const move = needsMove ? selMove : null;
        const attack = amBaiDon ? selAttack : null;
        if (needsMove && !move){ toast('اختار حركة الأول', 'err'); return; }
        if (amBaiDon && !attack){ toast('اختار رقم الهجوم', 'err'); return; }
        BaiDonGame.submitAction(move, attack, disguising);
        submitBtn.disabled = true; submitBtn.textContent = 'تم الإرسال ✅';
      };
      wrap.appendChild(submitBtn);
    }

    const counter = el('div', 'answered-count'); counter.id = 'bd-action-counter';
    wrap.appendChild(counter);

    if (isHost && App.room.hostMode !== 'auto'){
      const endBtn = el('button', 'warn block', 'إنهاء الجولة يدوياً ⏹');
      endBtn.onclick = function(){ BaiDonGame.hostResolve(); };
      wrap.appendChild(endBtn);
    } else if (isHost && App.room.hostMode === 'auto'){
      let fs = document.getElementById('force-stop-btn');
      if (fs) fs.remove();
      fs = document.createElement('button');
      fs.id = 'force-stop-btn'; fs.className = 'force-stop'; fs.textContent = '⏩';
      fs.onclick = function(){ BaiDonGame.hostResolve(); };
      document.body.appendChild(fs);
    } else if (!isHost){
      let fs = document.getElementById('force-stop-btn');
      if (fs) fs.remove();
    }

    setTimeout(function(){
      if ($('bd-action-counter')){
        const ps2 = g.playerState || {};
        const actions2 = g.actions || {};
        const needed = Object.keys(ps2).filter(function(uid){
          const p = ps2[uid];
          if (!p || p.eliminated || p.frozen > 0) return false;
          if (room.hostMode === 'judge' && uid === room.hostId) return false;
          return true;
        });
        const done = needed.filter(function(uid){ return actions2[uid] && actions2[uid].ts; }).length;
        $('bd-action-counter').textContent = done + ' / ' + needed.length + ' اختاروا';
      }
    }, 50);
  },

  // ---------- RESOLVE ----------
  uiResolve(wrap, room, g, round, isHost){
    const lr = g.lastResult || {};
    wrap.appendChild(el('h3', 'phase-title', 'نتيجة الجولة ' + round));
    wrap.appendChild(BaiDonGame.buildTrack(room, g));

    const events = lr.events || [];
    if (events.length){
      const evWrap = el('div', 'list');
      events.forEach(function(ev){
        const p = room.players[ev.uid];
        if (!p) return;
        let cls = 'event-line', txt = '';
        if (ev.type === 'hit'){
          cls += ' hit';
          txt = '💥 البيدون ضرب ' + p.avatar + ' ' + p.name;
          if (ev.attackNum) txt += ' -- اختار نفس الرقم (' + ev.attackNum + ')!';
          if (ev.bot) txt += ' (Bot)';
        }
        else if (ev.type === 'freeze'){ cls += ' freeze'; txt = '❄️ ' + p.avatar + ' ' + p.name + ' اتجمد لجولة!'; }
        else if (ev.type === 'stillFrozen'){ cls += ' freeze'; txt = '❄️ ' + p.avatar + ' ' + p.name + ' لسه متجمد.'; }
        else if (ev.type === 'middleLine'){ cls += ' middle'; txt = '💖 ' + p.avatar + ' ' + p.name + ' عدّى النص وخد قلب هدية (+1)!'; }
        else if (ev.type === 'dangerZone'){ cls += ' danger'; txt = '⚠️ ' + p.avatar + ' ' + p.name + ' دخل منطقة الخطر -- قلوبه بقت 2!'; }
        else if (ev.type === 'eliminated'){ cls += ' elim'; txt = '💀 ' + p.avatar + ' ' + p.name + ' خرج من اللعبة!'; }
        else if (ev.type === 'wrongGuess'){ cls += ' vote'; txt = '❌ ' + p.avatar + ' ' + p.name + ' خمّن غلط في النهاية -- رجع 3 خطوات!'; }
        else if (ev.type === 'move'){ txt = '➡️ ' + p.avatar + ' ' + p.name + ' اتحرك من ' + ev.from + ' لـ ' + ev.to; }
        else return;
        evWrap.appendChild(el('div', cls, txt));
      });
      wrap.appendChild(evWrap);
    } else {
      wrap.appendChild(el('div', 'waiting', 'مفيش أحداث غريبة الجولة دي…'));
    }

    const list = el('div', 'list');
    const ps = g.playerState || {};
    const sorted = Object.keys(room.players || {}).map(function(id){ return Object.assign({ id: id }, room.players[id], { _ps: ps[id] || {} }); })
      .filter(function(p){ return !p._ps.eliminated; })
      .sort(function(a, b){ return (b._ps.pos || 0) - (a._ps.pos || 0); });
    sorted.forEach(function(p){
      const pp = p._ps;
      const row = el('div', 'row' + (p.id === App.uid ? ' me' : '') + (pp.inDanger ? ' danger' : '') + (p.id === g.baiDonId && g.baiDonRevealed ? ' revealed-bd' : ''));
      const heartStr = '❤️'.repeat(Math.max(0, pp.hearts || 0));
      let name = nameWithCrown(room, p.id, p.name);
      if (p.id === g.baiDonId && g.baiDonRevealed) name += ' 🎭';
      let frozenTag = pp.frozen > 0 ? ' <span style="color:#64b5ff;font-weight:900">❄️ متجمد</span>' : '';
      row.innerHTML = '<div class="r-ava' + (pp.frozen > 0 ? ' ice-block' : '') + '">' + esc(p.avatar) + '</div>' +
        '<div class="r-main"><div class="r-name">' + name + frozenTag + '</div>' +
        '<div class="hearts">' + heartStr + ' <span style="color:#8d7fb0">(' + (pp.pos || 0) + '/' + (g.target || 20) + ')</span></div></div>' +
        '<div class="r-pts pos">' + (pp.pos || 0) + '</div>';
      list.appendChild(row);
    });
    wrap.appendChild(list);

    if (isHost){
      const btn = el('button', 'primary block', 'الجولة التالية ▶️');
      btn.onclick = function(){ BaiDonGame.hostNextRound(); };
      wrap.appendChild(btn);
    } else {
      wrap.appendChild(el('div', 'waiting', '⏳ في انتظار الهوست…'));
    }
  },

    wrap.appendChild(el('div', 'waiting', 'الاستعداد: ' + readyCount + ' / ' + total + ' زعبول'));
    if (!isHost){
      if (ready[App.uid]) wrap.appendChild(el('div', 'ok-box', '✅ أنت مستعد!'));
      else {
        const btn = el('button', 'success block', 'أنا مستعد ✋');
        btn.onclick = function(){ BaiDonGame.setReady(); };
        wrap.appendChild(btn);
      }
    } else {
      wrap.appendChild(el('div', 'tiny', 'في انتظار استعداد الجميع…'));
      const btn = el('button', 'primary block', 'ابدأ من جديد 🚀');
      btn.disabled = readyCount < total;
      btn.onclick = function(){ BaiDonGame.hostRestart(); };
      wrap.appendChild(btn);
    }
  }
};

   ================================================================ */
function render(){
  const room = App.room;
  if (!room) return;
  if (room.status === 'lobby' || !room.game || room.game.phase === 'idle'){
    showScreen('lobby');
    renderLobby();
  } else {
    showScreen('game');
    renderGame();
  }
  updateMicVisibility();
  updateGameHint();
}

function renderLobby(){
  const room = App.room;
  $('lobby-pin').textContent = App.pin || '-----';
  const players = getJoinedPlayers(room);
  $('lobby-sub').textContent = 'الزعابيل: ' + players.length + '/' + MAX_PLAYERS + ' • ' + (room.gameType === 'baidon' ? 'لعبة البيدون 🎭' : 'بره الصندوق 📦');

  const grid = $('lobby-players');
  let html = '';
  players.forEach(function(p){
    html += '<div class="pcard' + (p.online ? '' : ' off') + '">';
    if (App.isHost && p.id !== App.uid){
      html += '<button class="kick" data-kick="' + p.id + '" type="button">✕</button>';
    }
    html += '<div class="pava">' + esc(p.avatar || '❓') + '</div>';
    html += '<div class="pname">' + esc(p.name) + '</div>';
    if (p.id === room.hostId) html += '<div class="host-tag">هوست 👑</div>';
    if (!p.online) html += '<div class="off-tag">غير متصل</div>';
    html += '</div>';
  });
  grid.innerHTML = html;

  const startBtn = $('btn-start-game');
  const minPlayers = (room.gameType === 'baidon') ? 2 : MIN_PLAYERS;
  if (App.isHost){
    startBtn.classList.remove('hidden');
    if (players.length < minPlayers){
      startBtn.disabled = true;
      startBtn.textContent = 'محتاجين ' + (minPlayers - players.length) + ' كمان…';
    } else {
      startBtn.disabled = false;
      startBtn.textContent = 'ابدأ اللعبة 🚀';
    }
  } else {
    startBtn.classList.add('hidden');
  }
}

function renderGame(){
  const room = App.room;
  const g = room.game || {};
  const phase = g.phase || 'action';
  const round = g.round || 1;

  $('game-round').textContent = (room.gameType === 'baidon') ? 'جولة ' + round : 'جولة ' + round + '/' + TOTAL_ROUNDS;

  const me = room.players[App.uid];
  if (room.gameType === 'baidon'){
    const myPs = (g.playerState || {})[App.uid] || {};
    const elimTag = myPs.eliminated ? ' 👻 خارج' : '';
    $('game-score').textContent = 'تقدمك: ' + (me ? (me.pos || 0) : 0) + ' • ❤️' + (me ? (me.hearts || 0) : 0) + elimTag;
  } else {
    $('game-score').textContent = 'نقاطك: ' + (me ? (me.score || 0) : 0);
  }

  let sig;
  if (room.gameType === 'baidon'){
    if (phase === 'action'){
      const myAction = (g.actions || {})[App.uid];
      const submitted = !!(myAction && myAction.ts);
      sig = 'bd-action:' + round + ':' + (g.baiDonRevealed ? 1 : 0) + ':' + (submitted ? 1 : 0);
    } else if (phase === 'intro'){
      const ready = !!(g.introReady && g.introReady[App.uid]);
      sig = 'bd-intro:' + (ready ? 1 : 0);
    } else {
      sig = 'bd-' + phase + ':' + JSON.stringify(g) + ':' + JSON.stringify(room.players);
    }
  } else {
    if (phase === 'answering'){
      sig = 'ans:' + round + ':' + (g.mode || '') + ':' + (g.question || '');
    } else {
      sig = 'full:' + JSON.stringify(g) + ':' + JSON.stringify(room.players);
    }
  }
  if (App.sig === sig) return;
  App.sig = sig;

  const body = $('game-body');
  body.innerHTML = '';
  const gameObj = room.gameType === 'baidon' ? BaiDonGame : BoxGame;
  body.appendChild(gameObj.build(room, g, phase, round));
}

function updateGameHint(){
  const bar = $('game-hint');
  if (!bar) return;
  const room = App.room;
  if (!room || room.gameType !== 'baidon' || room.status !== 'playing'){ bar.classList.add('hidden'); return; }
  const g = room.game || {};
  const phase = g.phase;
  let hint = '';
  const amBaiDon = (g.baiDonId === App.uid);
  const isRevealed = !!g.baiDonRevealed;
  const ps = g.playerState || {};
  const myPs = ps[App.uid] || {};

  if (myPs.eliminated){ hint = '👻 أنت خارج اللعبة -- بتتفرج بس'; }
  else if (myPs.frozen > 0){ hint = '❄️ أنت متجمد الجولة دي -- مش هتعمل أي أكشن'; }
  else if (phase === 'intro'){ hint = 'لا تفصح عن هويتك 🤫'; }
  else if (phase === 'action'){
    if (amBaiDon && !isRevealed) hint = '🎭 اختار حركتك، واختار رقم تتوقع زعبول هيختاره عشان توقعه';
    else if (amBaiDon && isRevealed) hint = '🎭 أنت Turret! اختار رقم الهجوم كل جولة';
    else hint = 'حاول متختارش نفس الرقم كتير عشان البيدون ميقفشكش وتخسر قلب!';
  }
  else if (phase === 'vote'){ hint = 'صوّت بحكمة! لو الأغلبية اختارت زعبول بريء.. كل اللي صوّت ضده هيرجع خطوتين لورا!'; }
  else if (phase === 'endGuess'){ hint = 'وصلت لخط النهاية! لازم تخمن مين البيدون.. لو غلط هترجع 3 خطوات لورا!'; }
  else if (phase === 'resolve'){ hint = 'تابع الأحداث -- القلوب والتحركات'; }
  else if (phase === 'final'){ hint = 'النهاية! اضغط إعادة الزعبله عشان جولة جديدة'; }

  if (hint){ bar.textContent = hint; bar.classList.remove('hidden'); }
  else { bar.classList.add('hidden'); }
}

/* ================================================================
   9) Mic
   ================================================================ */
function updateMicVisibility(){
  const btn = $('mic-btn');
  if (App.room && App.uid) btn.classList.remove('hidden');
  else btn.classList.add('hidden');
}
function hideMic(){ const btn = $('mic-btn'); btn.classList.add('hidden'); btn.classList.remove('rec'); }

let micStream = null, mediaRecorder = null, audioChunks = [], isRecording = false, sharedAudio = null;

function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onloadend = function(){ resolve(reader.result); };
    reader.onerror = function(e){ reject(e); };
    reader.readAsDataURL(blob);
  });
}
function playAudioData(dataUrl){
  try {
    if (!sharedAudio) sharedAudio = new Audio();
    sharedAudio.pause(); sharedAudio.src = dataUrl;
    const p = sharedAudio.play();
    if (p && p.catch) p.catch(function(){});
  } catch (e){}
}
function setupMicListener(pin){
  try {
    const micRef = db.ref('rooms/' + pin + '/mic');
    micRef.on('child_added', function(snap){
      const v = snap.val();
      const now = Date.now();
      if (!v || !v.data || v.from === App.uid || (v.ts && now - v.ts > 12000)){
        snap.ref.remove().catch(function(){}); return;
      }
      playAudioData(v.data);
      setTimeout(function(){ snap.ref.remove().catch(function(){}); }, 25000);
    });
  } catch (e){}
}
async function startRecording(){
  if (isRecording || !App.roomRef) return;
  try {
    if (!micStream){ micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    audioChunks = [];
    const mimeCandidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', ''];
    let options = {};
    for (let i = 0; i < mimeCandidates.length; i++){
      if (!mimeCandidates[i]) { options = {}; break; }
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mimeCandidates[i])){ options = { mimeType: mimeCandidates[i] }; break; }
    }
    const mr = new MediaRecorder(micStream, options);
    mr.ondataavailable = function(e){ if (e.data && e.data.size > 0) audioChunks.push(e.data); };
    mr.onstop = async function(){
      try {
        if (!audioChunks.length) return;
        const blob = new Blob(audioChunks, { type: mr.mimeType || 'audio/webm' });
        if (blob.size < 400) return;
        const b64 = await blobToBase64(blob);
        if (!b64 || b64.length > 900000){ toast('الصوت طويل أوي', 'err'); return; }
        if (App.roomRef){
          await App.roomRef.child('mic').push({
            from: App.uid,
            name: (App.room && App.room.players[App.uid]) ? App.room.players[App.uid].name : '',
            data: b64, ts: Date.now()
          });
          await App.roomRef.update({ lastActivity: Date.now() });
        }
      } catch (e){}
    };
    mr.start(); mediaRecorder = mr; isRecording = true;
    $('mic-btn').classList.add('rec');
  } catch (e){ toast('لازم تسمح بالمايك من إعدادات المتصفح 🎙️', 'err'); }
}
function stopRecording(){
  if (!isRecording || !mediaRecorder) return;
  try { mediaRecorder.stop(); } catch(e){}
  mediaRecorder = null; isRecording = false;
  $('mic-btn').classList.remove('rec');
}

/* ================================================================
   10) Global timer
   ================================================================ */
setInterval(function(){
  const room = App.room;
  if (!room || !room.game) return;
  const g = room.game;
  const isBaiDon = room.gameType === 'baidon';
  const timerPill = $('game-timer');

  if (isBaiDon){
    if (g.phase === 'action' && g.timerEnd){
      const leftMs = g.timerEnd - Date.now();
      const left = Math.max(0, Math.ceil(leftMs / 1000));
      if (timerPill && timerPill.getAttribute('data-val') !== String(left)){
        timerPill.textContent = '⏱ ' + left + 'ث';
        timerPill.setAttribute('data-val', String(left));
      }
      const txtEl = $('bd-timer-text');
      if (txtEl && txtEl.getAttribute('data-val') !== String(left)){
        txtEl.textContent = '⏱ ' + left + ' ثانية';
        txtEl.setAttribute('data-val', String(left));
      }
      const counter = $('bd-action-counter');
      if (counter){
        const ps = g.playerState || {};
        const actions = g.actions || {};
        const needed = Object.keys(ps).filter(function(uid){
          const p = ps[uid];
          if (!p || p.eliminated || p.frozen > 0) return false;
          if (room.hostMode === 'judge' && uid === room.hostId) return false;
          return true;
        });
        const done = needed.filter(function(uid){ return actions[uid] && actions[uid].ts; }).length;
        const str = done + ' / ' + needed.length + ' اختاروا';
        if (counter.getAttribute('data-val') !== str){
          counter.textContent = str;
          counter.setAttribute('data-val', str);
        }
        if (needed.length > 0 && done >= needed.length && leftMs > 800){
          BaiDonGame.hostResolve();
        }
      }
      if (leftMs <= 0){
        BaiDonGame.hostResolve();
      }
    } else {
      if (timerPill && g.phase !== 'action'){ timerPill.textContent = '--'; timerPill.removeAttribute('data-val'); }
      const txtEl = $('bd-timer-text');
      if (txtEl && g.phase !== 'action') txtEl.textContent = '';
    }

    if (App.isHost && room.hostMode === 'auto'){
      if (g.phase === 'intro'){
        const ready = g.introReady || {};
        const total = Object.keys(room.players || {}).length;
        let cnt = 0;
        Object.keys(ready).forEach(function(k){ if (ready[k]) cnt++; });
        if (total > 0 && cnt >= total){ BaiDonGame.hostStartAction(); }
      }
      if (g.phase === 'intro' && !BaiDonGame._autoIntroTimer){
        BaiDonGame._autoIntroTimer = setTimeout(function(){
          BaiDonGame._autoIntroTimer = null;
          if (App.room && App.room.game.phase === 'intro') BaiDonGame.hostStartAction();
        }, 8000);
      }
      if (g.phase === 'resolve' && !BaiDonGame._autoNextTimer){
        BaiDonGame._autoNextTimer = setTimeout(function(){
          BaiDonGame._autoNextTimer = null;
          if (App.room && App.room.game.phase === 'resolve') BaiDonGame.hostNextRound();
        }, 5000);
      }
      if (g.phase === 'voteResult' && !BaiDonGame._autoVoteTimer){
        BaiDonGame._autoVoteTimer = setTimeout(function(){
          BaiDonGame._autoVoteTimer = null;
          if (App.room && App.room.game.phase === 'voteResult') BaiDonGame.hostAfterVote();
        }, 4000);
      }
    }

    if (App.isHost && g.phase === 'intro' && !BaiDonGame._introCheckTimer){
      BaiDonGame._introCheckTimer = setInterval(function(){
        if (!App.room || App.room.game.phase !== 'intro'){ clearInterval(BaiDonGame._introCheckTimer); BaiDonGame._introCheckTimer = null; return; }
        const ready = App.room.game.introReady || {};
        const total = Object.keys(App.room.players || {}).length;
        let cnt = 0;
        Object.keys(ready).forEach(function(k){ if (ready[k]) cnt++; });
        if (total > 0 && cnt >= total){
          clearInterval(BaiDonGame._introCheckTimer); BaiDonGame._introCheckTimer = null;
          BaiDonGame.hostStartAction();
        }
      }, 700);
    }
  } else {
    if (g.phase === 'answering' && g.timerEnd){
      const leftMs = g.timerEnd - Date.now();
      const left = Math.max(0, Math.ceil(leftMs / 1000));
      if (timerPill && timerPill.getAttribute('data-val') !== String(left)){
        timerPill.textContent = '⏱ ' + left + 'ث';
        timerPill.setAttribute('data-val', String(left));
      }
      const txtEl = $('box-timer-text');
      if (txtEl && txtEl.getAttribute('data-val') !== String(left)){
        txtEl.textContent = '⏱ ' + left + ' ثانية';
        txtEl.setAttribute('data-val', String(left));
      }
      if (App.isHost){
        const answererIds = getAnswererIds(room);
        const allAnswered = answererIds.length > 0 && answererIds.every(function(id){ return g.answers && g.answers[id] && g.answers[id].text; });
        if (leftMs <= 0 || allAnswered){ BoxGame.hostEndTimer(); }
      }
    } else {
      if (timerPill && g.phase !== 'answering'){ timerPill.textContent = '--'; timerPill.removeAttribute('data-val'); }
    }
    if (App.isHost && g.phase === 'playAgain'){
      const ready = g.ready || {};
      const total = Object.keys(room.players || {}).length;
      let cnt = 0;
      Object.keys(ready).forEach(function(k){ if (ready[k]) cnt++; });
      if (total > 0 && cnt >= total){ BoxGame.hostRestart(); }
    }
  }
}, 500);

/* ================================================================
   11) UI binding
   ================================================================ */
let selectedAvatar = AVATARS[0];

function buildAvatarGrid(){
  const grid = $('avatar-grid');
  grid.innerHTML = '';
  AVATARS.forEach(function(emoji, idx){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'av' + (idx === 0 ? ' sel' : '');
    b.textContent = emoji;
    b.addEventListener('click', function(){
      const prev = grid.querySelector('.av.sel');
      if (prev) prev.classList.remove('sel');
      b.classList.add('sel');
      selectedAvatar = emoji;
    });
    grid.appendChild(b);
  });
  selectedAvatar = AVATARS[0];
}

function openSetup(mode, gameType){
  App.flowMode = mode;
  App.gameType = gameType || 'box';
  $('setup-title').textContent = (mode === 'create')
    ? (App.gameType === 'baidon' ? 'إنشاء زعبل البيدون 🎭' : 'إنشاء زعبل جديد')
    : 'دخول زعبل موجود';
  $('btn-submit').textContent = (mode === 'create')
    ? (App.gameType === 'baidon' ? 'إنشاء زعبل البيدون 🎭' : 'إنشاء الزعبل 🚀')
    : 'دخول الزعبل 🚪';
  $('host-opts').classList.toggle('hidden', mode !== 'create');
  $('inp-name').value = '';
  $('inp-pin').value = '';
  showScreen('setup');
}

async function submitSetup(){
  const name = $('inp-name').value.trim();
  const pin = $('inp-pin').value.trim();
  if (name.length < 2){ toast('اكتب اسم من حرفين على الأقل', 'err'); return; }
  if (!/^\d{5}$/.test(pin)){ toast('الرقم السري لازم 5 أرقام بالظبط', 'err'); return; }
  if (!selectedAvatar){ toast('اختر أفاتار', 'err'); return; }
  safeBlur($('inp-name')); safeBlur($('inp-pin'));
  showLoading('جاري الدخول... ⏳');
  try {
    let uid;
    if (App.flowMode === 'create'){
      uid = await Core.createRoom(pin, name, selectedAvatar, App.hostMode, App.gameType);
    } else {
      uid = await Core.joinRoom(pin, name, selectedAvatar);
    }
    hideLoading();
    App.name = name; App.avatar = selectedAvatar;
    Core.attach(pin, uid);
    App.sig = '';
  } catch (err){
    hideLoading();
    const code = err && err.message;
    if (code === 'PIN_TAKEN') toast('الرقم السري مستخدم، جرّب رقم تاني', 'err');
    else if (code === 'NO_ROOM') toast('مفيش زعبل بالرقم ده 🤔', 'err');
    else if (code === 'FULL') toast('الزعبل مليان (20 زعبول)', 'err');
    else if (code === 'NAME_TAKEN') toast('الاسم موجود، جرّب اسم تاني', 'err');
    else if (code === 'AVATAR_TAKEN') toast('الأفاتار ده متاخد، اختار واحد تاني', 'err');
    else if (code === 'STARTED') toast('اللعبة بدأت خلاص، استنى الجولة الجديدة', 'err');
    else if (code === 'KICKED') toast('أنت مطرود من الزعبل ده 🚪', 'err');
    else toast('مشكلة في الاتصال، جرّب تاني', 'err');
  }
}

function bindEvents(){
  $('card-box').addEventListener('click', function(){ showHomeChoice('box'); });
  $('card-baidon').addEventListener('click', function(){ showHomeChoice('baidon'); });

  function showHomeChoice(gameType){
    const old = document.getElementById('home-choice'); if (old) old.remove();
    const choice = el('div', 'card');
    choice.id = 'home-choice';
    choice.innerHTML =
      '<h3 class="center">' + (gameType === 'baidon' ? 'البيدون 🎭' : 'بره الصندوق 📦') + '</h3>' +
      '<div class="stack" style="margin-top:12px">' +
        '<button class="primary block" id="pick-create" type="button">إنشاء زعبل جديد 🎉</button>' +
        '<button class="secondary block" id="pick-join" type="button">دخول زعبل موجود 🚪</button>' +
        '<button class="ghost block small" id="pick-cancel" type="button">إلغاء</button>' +
      '</div>';
    $('screen-home').appendChild(choice);
    $('pick-create').onclick = function(){ choice.remove(); openSetup('create', gameType); };
    $('pick-join').onclick   = function(){ choice.remove(); openSetup('join', gameType); };
    $('pick-cancel').onclick = function(){ choice.remove(); };
  }

  $('btn-back').addEventListener('click', function(){
    showScreen('home');
    const c = document.getElementById('home-choice'); if (c) c.remove();
  });

  $('btn-submit').addEventListener('click', submitSetup);
  onEnter($('inp-name'), function(){ $('inp-pin').focus(); });
  onEnter($('inp-pin'), submitSetup);
  $('inp-pin').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, '').slice(0, 5); });

  const hostChips = document.querySelectorAll('#host-opts .chip');
  const hostHints = {
    play: 'هوست + لاعب: تتحكم يدوياً وتلعب كزعبول عادي.',
    judge: 'هوست وحكم فقط: متلعبش، تتحكم في إيقاع اللعبة فقط.',
    auto: 'أوتوماتيكي: اللعبة تتقدم بتايمر، وأنت تلعب عادي + زر تخطي مخفي.'
  };
  hostChips.forEach(function(chip){
    chip.addEventListener('click', function(){
      hostChips.forEach(function(c){ c.classList.remove('on'); });
      chip.classList.add('on');
      App.hostMode = chip.getAttribute('data-host');
      $('host-hint').textContent = hostHints[App.hostMode] || '';
    });
  });

  $('btn-leave').addEventListener('click', function(){ Core.leave(); });
  $('btn-start-game').addEventListener('click', function(){
    if (App.room.gameType === 'baidon') BaiDonGame.hostStart();
    else BoxGame.hostStart();
  });

  $('lobby-players').addEventListener('click', function(e){
    let node = e.target;
    while (node && node !== this && !(node.getAttribute && node.getAttribute('data-kick'))) node = node.parentNode;
    if (node && node !== this && node.getAttribute){
      const pid = node.getAttribute('data-kick');
      if (pid) Core.kick(pid);
    }
  });

  const micBtn = $('mic-btn');
  micBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startRecording(); });
  micBtn.addEventListener('pointerup', function(e){ e.preventDefault(); stopRecording(); });
  micBtn.addEventListener('pointerleave', function(){ stopRecording(); });
  micBtn.addEventListener('pointercancel', function(){ stopRecording(); });

  window.addEventListener('pagehide', function(){
    try { if (App.roomRef && App.uid) App.roomRef.child('players/' + App.uid).update({ online: false }); } catch(e){}
  });

  // 🔥 Heat reduction: pause all animations when tab hidden
  document.addEventListener('visibilitychange', function(){
    document.body.classList.toggle('tab-hidden', document.hidden);
  });
}

/* ================================================================
   12) Boot
   ================================================================ */
(async function boot(){
  buildAvatarGrid();
  bindEvents();
  showScreen('home');
  showLoading('جاري الاتصال بالسيرفر... ⏳');
  try {
    await initFirebase();
    hideLoading();
    Core.sweepOldRooms();
  } catch (err){
    hideLoading();
    toast('فشل الاتصال بالسيرفر. تأكد من الإنترنت ⚠️', 'err');
  }
})();
